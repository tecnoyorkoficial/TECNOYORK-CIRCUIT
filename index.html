<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tecnoyork Electrónica</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tecnoyork">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 :root{
    --bg:#0a0d12; --bg2:#0d1117; --panel:rgba(20,26,36,.92); --panel2:rgba(28,36,48,.85);
    --grid:#1a222e;
    --accent:#ffab2e; --accent-glow:rgba(255,171,46,.35);
    --accent2:#2ee6a6; --accent2-glow:rgba(46,230,166,.3);
    --blue:#4da6ff; --blue-glow:rgba(77,166,255,.3);
    --wire-off:#37424f; --wire-on:#ffab2e;
    --text:#eef2f7; --text-dim:#8b97a6; --text-faint:#5c6774;
    --danger:#ff5c6c; --danger-glow:rgba(255,92,108,.3);
    --border:#242e3b; --border-soft:rgba(255,255,255,.06);
    --radius:14px; --radius-sm:9px;
    --font-ui:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','Consolas',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(255,171,46,.06), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(77,166,255,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

 /* TOP BAR */
  #topbarWrap{display:flex;align-items:stretch;gap:0;padding:0 14px 0 0;
    background:linear-gradient(180deg, rgba(22,29,40,.97) 0%, rgba(16,21,29,.97) 100%);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
    box-shadow:0 4px 24px rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,171,46,.08);
    flex-shrink:0;z-index:20;position:relative;}

  .logo{flex-shrink:0;display:flex;align-items:center;gap:10px;
    padding:9px 18px 9px 16px;position:relative;
    background:linear-gradient(180deg, rgba(255,171,46,.05), transparent 70%);}
  .logo::after{content:'';position:absolute;right:0;top:8px;bottom:8px;width:1px;
    background:linear-gradient(180deg, transparent, var(--border-soft) 20%, var(--border-soft) 80%, transparent);}
  .logo::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg, var(--accent), var(--accent2));}
  .logo-img{height:40px !important;max-height:40px !important;width:auto !important;max-width:200px;
    object-fit:contain;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));}

  #topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:1;min-width:0;
    overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:none; -ms-overflow-style:none;}
  #topbar::-webkit-scrollbar{height:0; display:none;}

  #topbarFade{position:absolute;right:0;top:0;bottom:0;width:28px;pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(11,15,20,.85));}
  .tbtn{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    background-color:var(--panel2);
    border:1px solid var(--border);color:var(--text);
    border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;
    transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 6px rgba(0,0,0,.15);}
  .tbtn:hover{border-color:rgba(255,171,46,.35); box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .tbtn:active{transform:scale(.94);}
  .tbtn.on{background:linear-gradient(180deg, #34e0a8, #22c690);color:#04241a;border-color:#22c690;
    font-weight:700; box-shadow:0 0 0 1px rgba(46,230,166,.4), 0 4px 14px var(--accent2-glow);}
  .tbtn.danger{color:#ff8290;border-color:rgba(255,92,108,.25);}
  .tbtn.danger:hover{border-color:var(--danger); box-shadow:0 2px 12px var(--danger-glow);}

  /* MAIN LAYOUT */
  #main{flex:1;display:flex;min-height:0;position:relative;}

  /* PICKER & OVERLAY (shared base) */
  .pickerBackdrop{position:fixed;inset:0;background:rgba(4,6,10,.68);backdrop-filter:blur(4px);
    display:none;z-index:40;}
  .pickerBackdrop.open{display:block;}
  .pickerModal{position:fixed;left:0;right:0;bottom:0;max-height:86vh;
    background:linear-gradient(180deg, rgba(24,31,42,.99), rgba(15,19,27,.99));
    backdrop-filter:blur(18px);
    border-radius:22px 22px 0 0;z-index:41;display:none;flex-direction:column;
    box-shadow:0 -12px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04) inset;
    border-top:1px solid rgba(255,171,46,.18);}
  .pickerModal.open{display:flex;}
  .pickerHandle{width:40px;height:4px;background:linear-gradient(90deg,#3a4756,#5c6b7d,#3a4756);
    border-radius:3px;margin:10px auto 2px;}
  .pickerHeader{display:flex;align-items:center;gap:8px;padding:8px 14px 12px;flex-shrink:0;
    border-bottom:1px solid var(--border-soft);}
  .pickerHeader h3{margin:0;font-size:14.5px;font-weight:700;flex:1;letter-spacing:.2px;}
  .pickerClose{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;
    transition:background .15s;}
  .pickerClose:hover{background:rgba(255,92,108,.15); border-color:var(--danger);}
  .picker-search-row{display:flex;align-items:center;gap:8px;padding:8px 14px 12px;flex-shrink:0;
    border-bottom:1px solid var(--border-soft);}
  .pickerSearch{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);
    border-radius:11px;padding:10px 13px;font-size:13px;outline:none;transition:border-color .15s, box-shadow .15s;}
  .pickerSearch:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
  .pickerBody{overflow-y:auto;padding:8px 14px 26px;-webkit-overflow-scrolling:touch;}
  .cat-title{font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:1.4px;
    font-weight:800;padding:16px 2px 9px;}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;}
  .comp-btn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)) , var(--panel2);
    border:1px solid var(--border);border-radius:13px;padding:10px 5px 9px;
    cursor:pointer;text-align:center;transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease;}
  .comp-btn:hover{transform:translateY(-2px); border-color:rgba(255,171,46,.3); box-shadow:0 6px 16px rgba(0,0,0,.3);}
  .comp-btn:active{transform:scale(.96);}
  .comp-btn.active{border-color:var(--accent);background:linear-gradient(180deg, rgba(255,171,46,.14), rgba(255,171,46,.04));
    box-shadow:0 0 0 1px var(--accent-glow);}
  .comp-btn .icon-wrap{width:60px;height:42px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, #131a24, #0a0e14);border-radius:9px;
    border:1px solid rgba(255,255,255,.04);}
  .comp-btn .icon-wrap img{width:56px;height:38px;}
  .comp-btn .lbl{font-size:9.5px;color:var(--text-dim);line-height:1.25;font-weight:500;}
  #noResults{color:var(--text-dim);font-size:12px;text-align:center;padding:30px 10px;}

  /* OVERLAY BODY VARIANTS */
  .save-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .save-row input{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);
    border-radius:11px;padding:10px 13px;font-size:13px;outline:none;}
  .save-row input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
  .slist{display:flex;flex-direction:column;gap:7px;}
  .sitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
    border-radius:12px;padding:11px 13px;cursor:pointer;transition:border-color .15s, transform .12s;}
  .sitem:hover{border-color:rgba(255,171,46,.25);}
  .sitem:active{transform:scale(.98);}
  .sitem .name{flex:1;font-size:13px;font-weight:500;}
  .sitem .date{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);}
  .sitem .del{color:var(--danger);font-size:13px;background:none;border:none;cursor:pointer;width:28px;text-align:center;}
  .empty{color:var(--text-dim);font-size:12px;text-align:center;padding:20px 10px;}

  /* ENVIRONMENT PANEL */
  .env-group { margin-bottom: 20px; }
  .env-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text); margin-bottom:7px; font-weight:500;}
  .env-label b { color:var(--accent); font-family:var(--font-mono); }
  .env-slider { width:100%; -webkit-appearance:none; height:6px;
    background:linear-gradient(90deg, var(--accent2), var(--accent)); border-radius:3px; outline:none; opacity:.85;}
  .env-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:#fff;
    border:3px solid var(--accent); border-radius:50%; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .env-slider::-moz-range-thumb { width:18px; height:18px; background:#fff; border:3px solid var(--accent);
    border-radius:50%; cursor:pointer; }

  /* SCOPE PANEL */
  .scope-row { display:flex; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .scope-col { flex:1; min-width:140px; display:flex; flex-direction:column; gap:6px; }
  .scope-col select { background:var(--bg2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px; font-size:12px; }
  .scope-col label { font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}

  /* Chip "colocando componente" flotante sobre el lienzo */
  #placingChip{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;
    align-items:center;gap:8px;background:linear-gradient(180deg, rgba(255,171,46,.16), rgba(255,171,46,.08));
    backdrop-filter:blur(8px);
    border:1px solid var(--accent);
    color:var(--accent);border-radius:22px;padding:7px 8px 7px 15px;font-size:12px;font-weight:700;
    box-shadow:0 4px 16px var(--accent-glow);
    z-index:15;}
  #placingChip button{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;
    width:22px;height:22px;line-height:1;}

  /* CANVAS */
  #canvasWrap{flex:1;position:relative;overflow:hidden;
    background:radial-gradient(ellipse 1000px 700px at 50% 40%, #0d131b, var(--bg));}
  #canvas{position:absolute;top:0;left:0;touch-action:none;}

  /* STATUS BAR */
  #statusbar{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;
    pointer-events:none;}
  .chip{background:rgba(16,21,29,.9);backdrop-filter:blur(6px);border:1px solid var(--border-soft);
    border-radius:20px;padding:6px 11px;font-size:11px;color:var(--text-dim);font-weight:500;
    box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .chip b { color:var(--accent2); font-family:var(--font-mono); font-weight:600;}

  /* PROPERTIES PANEL */
  #propPanel{position:absolute;right:8px;top:8px;width:196px;
    background:linear-gradient(180deg, rgba(22,29,40,.97), rgba(15,19,27,.97));
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,171,46,.2);border-radius:14px;padding:12px;display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35);}
  #propPanel h4{margin:0 0 9px;font-size:12.5px;color:var(--accent);font-weight:800;
    letter-spacing:.3px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);}
  #propPanel label{font-size:10.5px;color:var(--text-dim);display:block;margin-top:7px;font-weight:500;}
  #propPanel input[type=number],#propPanel select{width:100%;background:var(--bg2);
    border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px;font-size:12px;
    font-family:var(--font-mono);}
  #propPanel input[type=range]{width:100%;}
  #propPanel .row{display:flex;gap:6px;margin-top:9px;}
  #propPanel .row .tbtn{flex:1;justify-content:center;font-size:11px;padding:7px;}

  /* BOTTOM sheet for mobile: rotate/delete quick actions */
  #quickActions{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;display:none;
    gap:8px;}
  #quickActions .tbtn{padding:11px 15px;border-radius:26px;box-shadow:0 6px 18px rgba(0,0,0,.35);}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#2c3844;border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}

  #hint{position:absolute;top:10px;left:10px;background:rgba(16,21,29,.92);backdrop-filter:blur(6px);
    border:1px solid var(--border-soft);
    border-radius:12px;padding:8px 12px;font-size:11px;color:var(--text-dim);max-width:60%;
    box-shadow:0 4px 14px rgba(0,0,0,.3);}
</style>
</head>
<body>
<div id="app">
  <div id="topbarWrap">
    <div class="logo"><img src="logo.png" alt="Tecnoyork Electrónica" class="logo-img"></div>
    <div id="topbar">
      <button class="tbtn" id="btnAddComp">➕ Componentes</button>
      <button class="tbtn" id="btnWire">🔌 Cable</button>
      <button class="tbtn danger" id="btnCutWire">✂ Cortar</button>
      <button class="tbtn" id="btnEnv">🌡️ Entorno</button>
      <button class="tbtn" id="btnScope">📊 Osciloscopio</button>
      <button class="tbtn" id="btnPower">▶ Encender</button>
      <button class="tbtn" id="btnSave" title="Guardar circuito">💾</button>
      <button class="tbtn" id="btnLoad" title="Cargar / Recientes">📂</button>
      <button class="tbtn" id="btnCenter" title="Centrar vista">⌖</button>
      <button class="tbtn danger" id="btnClear">🗑</button>
    </div>
    <div id="topbarFade"></div>
  </div>
  <div id="main">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="hint">Toca "➕ Componentes" para elegir una pieza, luego toca el lienzo para colocarla. Arrastra el fondo vacío para mover el lienzo.</div>
      <div id="placingChip"></div>
      <div id="statusbar"></div>
      <div id="propPanel"></div>
      <div id="quickActions">
        <button class="tbtn" id="btnRotate">⟳ Girar</button>
        <button class="tbtn danger" id="btnDelete">🗑 Borrar</button>
      </div>
    </div>
  </div>
</div>

<div id="pickerBackdrop" class="pickerBackdrop"></div>
<div id="pickerModal" class="pickerModal">
  <div class="pickerHandle"></div>
  <div class="pickerHeader">
    <h3>Componentes</h3>
    <button class="pickerClose" id="pickerClose">✕</button>
  </div>
  <div class="picker-search-row">
    <input id="pickerSearch" class="pickerSearch" type="text" placeholder="🔍 Buscar componente (ej. led, resistencia...)">
  </div>
  <div id="pickerBody" class="pickerBody"></div>
</div>

<div id="overlayBackdrop" class="pickerBackdrop"></div>
<div id="overlayModal" class="pickerModal">
  <div class="pickerHandle"></div>
  <div class="pickerHeader">
    <h3 id="overlayTitle">Archivo</h3>
    <button class="pickerClose" id="overlayClose">✕</button>
  </div>
  <div id="overlayBody" class="pickerBody"></div>
</div>

<script>
// ============================================================
// components.js — Catálogo de componentes electrónicos
// ============================================================
const GRID = 20;
const COL_WIRE_OFF = '#3a4756';
const COL_WIRE_ON  = '#ffb02e';
const COL_BODY     = '#c7d2de';
const COL_BODY2    = '#8a97a8';

function T(x,y,name){ return {x,y,name}; }

function drawTerminalDot(ctx,x,y,active){
  ctx.beginPath();
  ctx.arc(x,y,3.3,0,Math.PI*2);
  ctx.fillStyle = active? COL_WIRE_ON : '#556274';
  ctx.fill();
}
function leadLines(ctx, pts){
  ctx.strokeStyle = COL_BODY; ctx.lineWidth = 2.4; ctx.lineCap='round';
  ctx.beginPath();
  pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
  ctx.stroke();
}

const COMPONENTS = {

resistor: { label:'Resistencia', cat:'Pasivos', icon:'▭',
  terminals:[T(-40,0),T(40,0)], props:{R:220},
  edges(c){ return [{n:[0,1], type:'R', value:Math.max(0.01,c.props.R)}]; },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-22,0]]); leadLines(ctx,[[22,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.4;
    ctx.strokeRect(-22,-9,44,18);
    const bands = resistorColorBands(c.props.R);
    bands.forEach((col,i)=>{ ctx.fillStyle=col; ctx.fillRect(-16+i*9,-9,5,18); });
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(fmtOhm(c.props.R), 0, 24);
  }
},

battery: { label:'Pila / Batería (DC)', cat:'Fuentes', icon:'🔋',
  terminals:[T(-40,0,'-'),T(40,0,'+')], props:{V:9},
  edges(c){ return [{n:[0,1], type:'V', value:c.props.V, Rint:0.2}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-14,0]]); leadLines(ctx,[[14,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-14,-16); ctx.lineTo(-14,16); ctx.stroke();
    ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(14,-9); ctx.lineTo(14,9); ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('−', -22, 4); ctx.fillText('+', 22, 4);
    ctx.font='9px sans-serif'; ctx.fillText(c.props.V+' V', 0, 26);
  }
},

acsource: { label:'Fuente AC', cat:'Fuentes', icon:'∿', props:{Vp:9, f:1},
  terminals:[T(-40,0),T(40,0)],
  edges(c,sim){ const v=c.props.Vp*Math.sin(2*Math.PI*c.props.f*sim.simTime); return [{n:[0,1],type:'V',value:v, Rint:0.2}]; },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-18,0]]); leadLines(ctx,[[18,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for(let x=-11;x<=11;x++){ const y=-Math.sin(x/11*Math.PI*2)*7; x===-11?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.Vp+'Vp '+c.props.f+'Hz', 0, 32);
  }
},

ground: { label:'Tierra (GND)', cat:'Fuentes', icon:'⏚',
  terminals:[T(0,-20)], props:{}, isGround:true,
  edges(c){ return []; },
  draw(ctx){
    leadLines(ctx,[[0,-20],[0,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.2;
    [12,8,4].forEach((w,i)=>{ ctx.beginPath(); ctx.moveTo(-w,4+i*5); ctx.lineTo(w,4+i*5); ctx.stroke(); });
  }
},

switch_sw: { label:'Interruptor', cat:'Control', icon:'⏻', props:{closed:false},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:c.props.closed?'R':'OPEN', value:0.02}]; },
  interactive:true,
  onTap(c){ c.props.closed = !c.props.closed; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-24,0]]); leadLines(ctx,[[24,0],[40,0]]);
    drawTerminalDot(ctx,-24,0,true); drawTerminalDot(ctx,24,0,true);
    ctx.strokeStyle= c.props.closed? COL_WIRE_ON: COL_BODY; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(-24,0);
    if(c.props.closed) ctx.lineTo(24,0); else ctx.lineTo(18,-16);
    ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='8.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.closed?'CERRADO':'ABIERTO',0,24);
  }
},

pushbutton: { label:'Pulsador', cat:'Control', icon:'⏺', props:{pressed:false},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:c.props.pressed?'R':'OPEN', value:0.02}]; },
  interactive:true, momentary:true,
  onTap(c){ c.props.pressed = !c.props.pressed; },
  draw(ctx,c){

    return [{n:[0,1], type:'DIODE', value:c.props.Vf, Ron:12}];

  },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-16,0]]); leadLines(ctx,[[16,0],[40,0]]);

      ctx.fillStyle = '#1a1010';

capacitor: { label:'Condensador', cat:'Pasivos', icon:'⊣⊢', props:{C:100, chargeR: 1e6},
  terminals:[T(-40,0),T(40,0)],

    return [{n:[0,1], type:'R', value:Reff}];
  },
  step(c, dt, sim){
    const on = sim.powered;
    const targetTau = Math.max(0.08, Math.min(4.5, c.props.C/140));
    let q = c.state.charge ?? 0;
    if(on) q += dt/targetTau*(1-q); else q -= dt/targetTau*q;
    c.state.charge = Math.max(0,Math.min(0.999,q));
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-8,0]]); leadLines(ctx,[[8,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-8,-15); ctx.lineTo(-8,15); ctx.moveTo(8,-15); ctx.lineTo(8,15); ctx.stroke();

    ctx.fillStyle='rgba(57,211,168,.55)'; ctx.fillRect(-8,-15,16*q,30);
    ctx.fillStyle='#aab6c4'; ctx.font='8px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.C+' µF', 0, 26);
  }
},

electrolytic_capacitor: { label:'Condensador Electrolítico', cat:'Pasivos', icon:'⊣C⊢', props:{C:220, chargeR:1e6, Vmax:16, failed:false},
  terminals:[T(-40,0,'+'),T(40,0,'-')],
  edges(c){
    if(c.props.failed) return [{n:[0,1], type:'R', value:0.4}];
    const q = c.state?.charge ?? 0;
    const Reff = 0.5 + (1e7 * q);
    return [{n:[0,1], type:'R', value:Reff}];
  },
  step(c, dt, sim){
    if(c.props.failed) return;
    const on = sim.powered;
    const targetTau = Math.max(0.08, Math.min(4.5, c.props.C/140));
    let q = c.state.charge ?? 0;
    if(on) q += dt/targetTau*(1-q); else q -= dt/targetTau*q;
    c.state.charge = Math.max(0,Math.min(0.999,q));
  },
  postSolve(c){
    if(c.props.failed) return;
    const V = c.state?.V||0;
    if(V < -0.5 || V > c.props.Vmax) c.props.failed = true;
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-8,0]]); leadLines(ctx,[[8,0],[40,0]]);
    ctx.strokeStyle= c.props.failed? '#ff5c5c' : COL_BODY; ctx.lineWidth=3;

    ctx.beginPath(); ctx.arc(11,0,15,Math.PI*0.65,-Math.PI*0.65); ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center'; ctx.fillText('+',-8,-20);
    if(c.props.failed){ ctx.fillStyle='#ff5c5c'; ctx.font='8px sans-serif'; ctx.fillText('¡DAÑADO!',0,28); }
    else {
      const q=c.state?.charge||0;
      ctx.fillStyle='rgba(57,211,168,.55)'; ctx.fillRect(-8,-15,16*q,30);
 ctx.fillStyle='#aab6c4'; ctx.font='8px sans-serif'; ctx.fillText(c.props.C+' µF',0,28);
    }
  }
},

timer555: { label:'Timer 555', cat:'Módulos', icon:'555', props:{mode:'astable', Vcc:5, R1:1000, R2:1000, C:1},
  // Nota: el pin DISCHARGE se añade como indicador (misma fase que OUT en astable);
  // la temporización sigue calculándose con R1/R2/C internos, no con una red RC externa real.
  terminals:[T(-30,-20,'VCC'), T(-30,0,'TRIG'), T(-30,20,'RESET'), T(30,-20,'THRES'), T(30,0,'OUT'), T(30,20,'GND'), T(0,34,'DISCH')],
  step(c, dt, sim){
    const Vcc_actual = c.state.Vt0 || 0;
    if(Vcc_actual < 3.0) { c.state.outHigh = false; return; }
    const Vcc = c.props.Vcc;
    c.state.Vtrig = c.state.Vt1||0;
    c.state.Vreset = c.state.Vt2||0;
    if(c.props.mode==='monostable'){
      const nowTrig = c.state.Vtrig < Vcc*0.35;
      if(nowTrig && !c.state._lastTrig && !c.state._monoOn){ c.state._monoOn=true; c.state._monoT = 1.1*c.props.R1*c.props.C*1e-6; }
      c.state._lastTrig = nowTrig;
      if(c.state._monoOn){ c.state._monoT -= dt; if(c.state._monoT<=0) c.state._monoOn=false; }
      c.state.outHigh = c.state._monoOn && (c.state.Vreset > 0.5);
    } else {
      const f = 1.44 / ((c.props.R1 + 2*c.props.R2) * c.props.C * 1e-6 + 1e-9);
 const duty = (c.props.R1 + c.props.R2) / (c.props.R1 + 2*c.props.R2);
      const period = 1/Math.max(f,0.001);
      const t = sim.simTime % period;
      c.state.outHigh = (t < duty*period) && (c.state.Vreset > 0.5);
      c.state.freq = f;
    }
  },
 edges(c,sim){
    const Vcc_actual = c.state.Vt0 || 0;
    if(Vcc_actual < 3.0) return [{n:[4,'GND'], type:'OPEN', value:1e9},{n:[6,'GND'], type:'OPEN', value:1e9}];
    const V = c.state.outHigh? c.props.Vcc : 0;
    // DISCHARGE es open-collector: en el 555 real conduce a GND cuando OUT está bajo.
    return [
      {n:[4,'GND'], type:'V', value:V, Rint:5},
      {n:[6,'GND'], type: c.state.outHigh? 'OPEN':'R', value: c.state.outHigh? 1e9:20}
    ];
  },
  draw(ctx,c){
    leadLines(ctx,[[-30,-20],[-14,-20]]); leadLines(ctx,[[-30,0],[-14,0]]); leadLines(ctx,[[-30,20],[-14,20]]);
    leadLines(ctx,[[30,-20],[14,-20]]); leadLines(ctx,[[30,0],[14,0]]); leadLines(ctx,[[30,20],[14,20]]); leadLines(ctx,[[0,34],[0,24]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-14,-24,28,48);
    ctx.fillStyle='#aab6c4'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('555',0,3);
    ctx.font='7.5px sans-serif';
    ctx.fillText(c.props.mode==='astable'?'ASTABLE':'MONOSTABLE',0,28);
    if(c.props.mode==='astable') ctx.fillText((c.state?.freq||0).toFixed(1)+' Hz',0,38);
    if(c.state?.outHigh){
      ctx.fillStyle='rgba(255,176,46,.4)'; ctx.fillRect(-14,-24,28,48);
    }
  }
},

opamp: { label:'Amplificador Operacional', cat:'Módulos', icon:'▷OP', props:{modelo:'LM358', gain:100000, Vcc_pos:5, Vcc_neg:0},
  terminals:[T(-30,-20,'in-'), T(-30,20,'in+'), T(0,-30,'Vcc+'), T(0,30,'Vcc-'), T(40,0,'out')],
  edges(c){
    const vcc_actual = c.state.Vt2 || 0;
    const vee_actual = c.state.Vt3 || 0;
    if((vcc_actual - vee_actual) < 3.0) return [{n:[4,'GND'], type:'OPEN', value:1e9}];
    
    const v_in_p = c.state.Vt1||0;
    const v_in_m = c.state.Vt0||0;
    let vout = c.props.gain * (v_in_p - v_in_m);
   const hi = Math.max(vcc_actual, vee_actual);
    const lo = Math.min(vcc_actual, vee_actual);
    if(vout > hi) vout = hi; else if(vout < lo) vout = lo;
    c.state.Vout = vout;
    return [{n:[4,'GND'], type:'V', value:vout, Rint:2}];
  },
  draw(ctx,c){
    leadLines(ctx,[[-30,-20],[-10,-10]]); leadLines(ctx,[[-30,20],[-10,10]]);
    leadLines(ctx,[[0,-30],[0,-12]]); leadLines(ctx,[[0,30],[0,12]]);
    leadLines(ctx,[[40,0],[10,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(-10,-22); ctx.lineTo(14,0); ctx.lineTo(-10,22); ctx.closePath(); ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('A',-2,3);
    ctx.fillStyle='#aab6c4'; ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.fillText(c.props.modelo,0,30);
    ctx.fillStyle='#39d3a8'; ctx.font='8px sans-serif'; ctx.fillText(fmtVolt(c.state?.Vout||0),0,38);
  }
},

    T(-70,49,'D10~'),T(-70,63,'D11~'),T(-70,77,'D12'),T(-70,91,'D13'),

dcdc: { label:'Módulo DC-DC Buck', cat:'Módulos', icon:'⇲5V', props:{Vset:5.0, eta:0.92},
  terminals:[T(-40,0,'VIN'), T(0,25,'GND'), T(40,0,'VOUT')],
  edges(c){
    const vin = (c.state.Vt0||0)-(c.state.Vt1||0);
    if(vin <= 1) return [{n:[2,1], type:'OPEN', value:1e9}];
    let vout = Math.min(c.props.Vset, Math.max(0, vin*c.props.eta));
    c.state.Vin = vin; c.state.Vout = vout;
    return [{n:[2,1], type:'V', value:vout, Rint:0.5}];

function resistorColorBands(R){
  const colors=['#000000','#7a4a1e','#ff3b3b','#ff8c1a','#ffe14d','#7de37d','#4da6ff','#b366ff','#8a8a8a','#ffffff'];
  let s=R.toExponential(1);
  let [mant,exp]=s.split('e'); let d1=mant[0], d2=mant[2]||'0'; let mult=parseInt(exp);
  return [colors[+d1], colors[+d2], colors[Math.max(0,Math.min(9,mult))]];
}

// ============================================================
// ARDUINO PROGRAMABLE — pines, transpilador y planificador
// ============================================================
const ARD_PIN_INDEX = {
  D0:0,D1:1,D2:2,D3:3,D4:4,D5:5,D6:6,D7:7,D8:8,D9:9,D10:10,D11:11,D12:12,D13:13,
  A0:14,A1:15,A2:16,A3:17,A4:18,A5:19,VIN:20,'5V':21,GND:22
};
const ARD_PWM_PINS = new Set([3,5,6,9,10,11]);
const DEFAULT_ARD_SKETCH =
`void setup(){
  pinMode(13, OUTPUT);
}

void loop(){
  digitalWrite(13, HIGH);
  delay(500);
  digitalWrite(13, LOW);
  delay(500);
}`;

function defaultArdPins(){
  const pins={};
  for(let i=0;i<=13;i++) pins['D'+i] = {mode:'IN', out:0, duty:0};
  return pins;
}

// Convierte un sketch estilo Arduino (C/C++) a JavaScript con generadores,
// de modo que delay() pueda "pausar" sin congelar la simulación.
function transpileArduino(src){
  let s = String(src||'');
  s = s.replace(/^\s*#include\s*[<"].*[>"]\s*$/gm,'');
  s = s.replace(/^\s*#define\s+(\w+)\s+(.+)$/gm,'const $1 = $2;');
  s = s.replace(/^\s*#.*$/gm,'');
  const TYPE = '(?:void|int|float|double|long|unsigned\\s+long|unsigned\\s+int|byte|char|bool|boolean|String)';
  const fnNames = [];
  s = s.replace(new RegExp(TYPE+'\\s+(\\w+)\\s*\\(([^)]*)\\)\\s*\\{','g'), (m,name,params)=>{
    fnNames.push(name);
    const cp = params.split(',').map(p=>{
      p=p.trim(); if(!p) return '';
      return p.replace(new RegExp('^'+TYPE+'\\s*[\\*&]?\\s*'),'').trim();
    }).filter(Boolean).join(', ');
    return 'function* '+name+'('+cp+'){';
  });
  s = s.replace(new RegExp('\\b(const\\s+)?('+TYPE+')\\s+(\\w+)\\b','g'), (m,cst,typ,name)=> (cst? cst : 'let ') + name);
  s = s.replace(/\blet (\w+)\[\]\s*=\s*\{([^}]*)\}/g,'let $1 = [$2]');
  s = s.replace(/\blet (\w+)\[(\d+)\]\s*;/g,'let $1 = new Array($2).fill(0);');
  s = s.replace(/\bdelayMicroseconds\s*\(/g,'yield* $delayMicros(');
  s = s.replace(/\bdelay\s*\(/g,'yield* $delay(');
  fnNames.forEach(name=>{
    if(name==='setup'||name==='loop') return;
    const re = new RegExp('(?<!function\\*\\s)\\b'+name+'\\s*\\(','g');
    s = s.replace(re,'yield* '+name+'(');
  });
  return s;
}

function ardPinKey(pin){ return (typeof pin==='string')? pin : ('D'+pin); }

function buildArduinoCtx(c){
  const idx = ARD_PIN_INDEX;
  function ensurePin(key){
    c.state.pins = c.state.pins || defaultArdPins();
    if(!c.state.pins[key]) c.state.pins[key] = {mode:'IN', out:0, duty:0};
    return c.state.pins[key];
  }
  const ctx = {
    HIGH:1, LOW:0, INPUT:0, OUTPUT:1, INPUT_PULLUP:2, LED_BUILTIN:13,
    A0:'A0',A1:'A1',A2:'A2',A3:'A3',A4:'A4',A5:'A5',
    pinMode(pin, mode){
      const key=ardPinKey(pin); const st=ensurePin(key);
      st.mode = mode===1? 'OUT' : mode===2? 'INPUT_PULLUP' : 'IN';
    },
    digitalWrite(pin, val){
      const key=ardPinKey(pin); const st=ensurePin(key);
      if(st.mode!=='OUT' && st.mode!=='PWM') st.mode='OUT';
      st.out = val? 1:0;
    },
    digitalRead(pin){
      const key=ardPinKey(pin); const st=ensurePin(key);
      if(st.mode==='OUT') return st.out;
      const v = c.state['Vt'+idx[key]]||0;
      return v > c.props.Vcc/2 ? 1:0;
    },
    analogRead(pin){
      const key = ardPinKey(pin);
      if(idx[key]===undefined || key[0]!=='A') return 0;
      const v = c.state['Vt'+idx[key]]||0;
      return Math.max(0, Math.min(1023, Math.round(v/c.props.Vcc*1023)));
    },
    analogWrite(pin, val){
      const num = typeof pin==='string'? parseInt(pin.replace('D',''),10): pin;
      const key = ardPinKey(pin);
      if(!ARD_PWM_PINS.has(num)){ ctx.digitalWrite(pin, val>=128?1:0); return; }
      const st = ensurePin(key);
      st.mode='PWM'; st.duty = Math.max(0,Math.min(255,val))/255;
    },
    millis(){ return Math.floor((c.state.program&&c.state.program.virtualMillis)||0); },
    micros(){ return Math.floor(((c.state.program&&c.state.program.virtualMillis)||0)*1000); },
    map(x,inMin,inMax,outMin,outMax){ return (x-inMin)*(outMax-outMin)/((inMax-inMin)||1)+outMin; },
    constrain(x,a,b){ return Math.max(a,Math.min(b,x)); },
    random(a,b){ if(b===undefined){ b=a; a=0; } return Math.floor(Math.random()*(b-a))+a; },
    Serial:{
      begin(){},
      print(...args){ appendArdSerial(c, args.map(String).join('')); },
      println(...args){ appendArdSerial(c, args.map(String).join('')+'\n'); },
      available(){ return 0; },
      read(){ return -1; }
    },
    *$delay(ms){
      const start = c.state.program.virtualMillis;
      while(c.state.program && (c.state.program.virtualMillis-start) < ms){ yield; }
    },
    *$delayMicros(us){
      const start = c.state.program.virtualMillis;
      const ms = us/1000;
      while(c.state.program && (c.state.program.virtualMillis-start) < ms){ yield; }
    }
  };
  return ctx;
}

function appendArdSerial(c, text){
  const p = c.state.program; if(!p) return;
  p.serialLog = (p.serialLog||'') + text;
  if(p.serialLog.length>4000) p.serialLog = p.serialLog.slice(-4000);
}

function compileArduinoProgram(c, code){
  try{
    const jsBody = transpileArduino(code);
    const ctx = buildArduinoCtx(c);
    const factorySrc =
      'return function(ctx){\n'+
      '  const {HIGH,LOW,INPUT,OUTPUT,INPUT_PULLUP,LED_BUILTIN,A0,A1,A2,A3,A4,A5,'+
      '    pinMode,digitalWrite,digitalRead,analogRead,analogWrite,'+
      '    millis,micros,map,constrain,random,Serial,$delay,$delayMicros} = ctx;\n'+
      jsBody+'\n'+
      '  return { setupGen: (typeof setup==="function")?setup:function*(){}, loopGen: (typeof loop==="function")?loop:function*(){} };\n'+
      '};';
    const factory = new Function(factorySrc)();
    const built = factory(ctx);
    c.state.pins = defaultArdPins();
    c.state.program = {
      code, error:null, running:true, virtualMillis:0, phase:'setup',
      iterSetup:null, iterLoop:null, serialLog:'', compiled:built
    };
    return {ok:true};
  }catch(err){
    c.state.program = c.state.program||{};
    c.state.program.error = (err && err.message) || String(err);
    c.state.program.running = false;
    return {ok:false, error: c.state.program.error};
  }
}

function pumpArduinoProgram(c, dt){
  const p = c.state.program;
  if(!p || !p.compiled || p.error || !p.running) return;
  p.virtualMillis += dt*1000;
  let guard=0;
  while(guard++<2000){
    if(p.phase==='setup'){
      if(!p.iterSetup) p.iterSetup = p.compiled.setupGen();
      let r;
      try{ r = p.iterSetup.next(); }
      catch(err){ p.error=(err&&err.message)||String(err); p.running=false; return; }
      if(r.done){ p.phase='loop'; p.iterLoop=null; } else break;
    } else if(p.phase==='loop'){
      if(!p.iterLoop) p.iterLoop = p.compiled.loopGen();
      let r;
      try{ r = p.iterLoop.next(); }
      catch(err){ p.error=(err&&err.message)||String(err); p.running=false; return; }
      if(r.done){ p.iterLoop=null; } else break;
    } else break;
  }
}

const CATEGORIES = ['Fuentes','Pasivos','Control','Semiconductores','Salida','Sensores','Medición','Lógica','Módulos'];


// ============================================================
// engine.js — Motor eléctrico MNA
// ============================================================
const WIRE_R = 0.0008;

function solveGauss(A, b){
  const n = b.length;
  for(let i=0;i<n;i++){
    let piv=i, best=Math.abs(A[i][i]);
    for(let r=i+1;r<n;r++){ if(Math.abs(A[r][i])>best){ best=Math.abs(A[r][i]); piv=r; } }
    if(best < 1e-12) continue;
    if(piv!==i){ [A[i],A[piv]]=[A[piv],A[i]]; [b[i],b[piv]]=[b[piv],b[i]]; }
    for(let r=i+1;r<n;r++){
      const f = A[r][i]/A[i][i];
      if(f===0) continue;
      for(let c=i;c<n;c++) A[r][c]-=f*A[i][c];
      b[r]-=f*b[i];
    }
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let s=b[i];
    for(let c=i+1;c<n;c++) s-=A[i][c]*x[c];
    x[i]= Math.abs(A[i][i])<1e-12? 0 : s/A[i][i];
  }
  return x;
}

class CircuitSim{
  constructor(){ this.simTime=0; this.dt=1/30; this.powered=false; }

  buildTopology(comps, wires){
    const termId = (compId,ti)=> compId+'#'+ti;
    const ids = new Map(); let n=0;
    comps.forEach(c=> c.terminals.forEach((t,ti)=>{ ids.set(termId(c.id,ti), n++); }));
 let refKey = null;
    const gnd = comps.find(c=>DEF(c).isGround);
    if(gnd) refKey = termId(gnd.id,0);
    else { const bat = comps.find(c=>c.type==='battery'); if(bat) refKey = termId(bat.id,0); }
    const refNode = refKey!==null ? ids.get(refKey) : (n>0?0:null);
    return {ids, termId, refNode, totalTerminals:n};
  }

  collectEdges(comps, wires, topo){
    const edges=[];
    wires.forEach(w=>{
      const n1 = topo.ids.get(topo.termId(w.a.compId,w.a.term));
      const n2 = topo.ids.get(topo.termId(w.b.compId,w.b.term));
      if(n1!==undefined && n2!==undefined) edges.push({n1,n2,type:'R',value:WIRE_R,owner:null});
    });
    comps.forEach(c=>{
      const def = DEF(c);
      if(!def.edges) return;
      const local = def.edges(c, this) || [];
 local.forEach(e=>{
        const gA = e.n[0]==='GND'? topo.refNode : topo.ids.get(topo.termId(c.id,e.n[0]));
        const gB = e.n[1]==='GND'? topo.refNode : topo.ids.get(topo.termId(c.id,e.n[1]));
        if(gA===undefined||gB===undefined||gA===null||gB===null) return;
        edges.push({n1:gA, n2:gB, type:e.type, value:e.value, Vz:e.Vz, Ron:e.Ron, Rint:e.Rint, owner:c, tag:e.tag||'main', local:e.n});
      });
    });
    return edges;
  }

  solveOnce(edges, topo){
    const Nn = Math.max(0, topo.totalTerminals - (topo.refNode!==null?1:0));
    const map = new Array(topo.totalTerminals).fill(-1);
    let k=0;
    for(let i=0;i<topo.totalTerminals;i++){ if(i===topo.refNode) continue; map[i]=k++; }
    const vSrc = edges.filter(e=> e.type==='V' || e.type==='GATEOUT' || e.__forceV);
    const Nv = vSrc.length;
    const size = Nn+Nv;
    if(size===0) return {V:[], I:[], map};
    const A = Array.from({length:size},()=>new Array(size).fill(0));
    const b = new Array(size).fill(0);

    function stampR(n1,n2,R){
      if(R<=0) R=1e-6;
      const g=1/R;
      const a=map[n1], c=map[n2];
      if(a>=0) A[a][a]+=g;
      if(c>=0) A[c][c]+=g;
      if(a>=0 && c>=0){ A[a][c]-=g; A[c][a]-=g; }
    }
    edges.forEach(e=>{
      if(e.type==='R') stampR(e.n1,e.n2,e.value);
      else if(e.type==='I'){
        const a=map[e.n1], c=map[e.n2];
        if(a>=0) b[a]-=e.value;
        if(c>=0) b[c]+=e.value;
      }
      else if(e.type==='OPEN'){ /* nada */ }
    });
    vSrc.forEach((e,j)=>{
      const idx = Nn+j;
      const p = map[e.n2], m = map[e.n1];
 if(p>=0){ A[p][idx]+=1; A[idx][p]+=1; }
      if(m>=0){ A[m][idx]-=1; A[idx][m]-=1; }
 b[idx]+= e.value;
      const Rint = e.Rint !== undefined ? e.Rint : 0.5;
      A[idx][idx] -= Rint;
    });
    const x = solveGauss(A,b);
    const V = new Array(topo.totalTerminals).fill(0);
    for(let i=0;i<topo.totalTerminals;i++) V[i] = i===topo.refNode? 0 : (map[i]>=0? x[map[i]] : 0);
    const Icur = vSrc.map((e,j)=> x[Nn+j]);
    return {V, Isrc:Icur, vSrc};
  }

  step(comps, wires, dt){
    this.dt = dt;
    if(this.powered) this.simTime += dt;
    comps.forEach(c=>{ const def=DEF(c); c.state=c.state||{}; if(def.step) def.step(c,dt,this); });

    if(!this.powered){
      comps.forEach(c=>{ c.state=c.state||{}; c.state.I=0; c.state.V=0; c.state.diodeState='off'; });
      return;
    }
    const topo = this.buildTopology(comps, wires);
    if(topo.totalTerminals===0) return;

    let lastV=null, lastEdges=null, lastRes=null;
    for(let iter=0; iter<6; iter++){
      const edges = this.collectEdgesNonlinear(comps, wires, topo);
      const res = this.solveOnce(edges, topo);
      lastV = res.V; lastEdges = edges; lastRes = res;
      comps.forEach(c=>{
        const def=DEF(c);
 c.state=c.state||{};
 c.terminals.forEach((t,ti)=>{
 const gid = topo.ids.get(topo.termId(c.id,ti));
          if(gid!==undefined) c.state['Vt'+ti]=res.V[gid];
 });
        if(c.type==='transistor_npn') c.state.Vbe = (c.state.Vt0||0)-(c.state.Vt2||0);
        if(c.type==='transistor_pnp') c.state.Veb = (c.state.Vt0||0)-(c.state.Vt1||0);
 if(c.type==='gate_and'||c.type==='gate_or'||c.type==='gate_nand'||c.type==='gate_nor'||c.type==='gate_xor'||c.type==='gate_not'||
           c.type==='gate_xnor'||c.type==='gate_buffer'||c.type==='sr_latch'){
 c.state.Vin0 = c.state.Vt0; c.state.Vin1 = c.state.Vt1;
        }
      });
      edges.forEach(e=>{
        if(e.type!=='R' && e.type!=='OPEN') return;
        if(!e.owner || (e.__kind!=='DIODE' && e.__kind!=='ZENER')) return;
        const c=e.owner;
        const I=(lastV[e.n1]-lastV[e.n2])/Math.max(e.value,1e-9);
        const Va=c.state['Vt'+e.local[0]]||0, Vb=c.state['Vt'+e.local[1]]||0;
        if(c.state.diodeState===undefined) c.state.diodeState='off';
        const thr = e.thr!==undefined? e.thr : e.value;
        if(e.__kind==='DIODE'){
 if(c.state.diodeState==='on'){ if(I < -0.0003) c.state.diodeState='off'; }
          else if((Va-Vb) > thr) c.state.diodeState='on';
        } else {
          if(c.state.diodeState==='fwd'){ if(I < -0.0003) c.state.diodeState='off'; }
          else if(c.state.diodeState==='rev'){ if(I > 0.0003) c.state.diodeState='off'; }
          else { if((Va-Vb) > thr) c.state.diodeState='fwd'; else if((Vb-Va) > e.Vz) c.state.diodeState='rev'; }
        }
      });
    }
    comps.forEach(c=>{ c.state=c.state||{}; c.state.I=0; c.state.V=0; c.state.Icoil=0; });
    this.totalCurrent = 0;
    lastEdges.forEach(e=>{
      if(!e.owner) return;
      const c=e.owner;
      const Vn1=lastV[e.n1], Vn2=lastV[e.n2];
      let I=0, haveI=false;
      if(e.type==='R'){ I=(Vn1-Vn2)/Math.max(e.value,1e-9); haveI=true; }
      else if(e.type==='I'){ I = e.value; haveI=true; }
      else if(e.type==='V'||e.type==='GATEOUT'){
 const j = lastRes.vSrc.indexOf(e);
        if(j>=0){ I = lastRes.Isrc[j]; haveI=true; }
      }
 if(!haveI) return;
      if(e.tag==='coil') c.state.Icoil = Math.abs(I);
      else if(e.tag==='gatesense') c.state.Igate = Math.abs(I);
      else if(e.tag==='led') c.state.Iled = Math.abs(I);
      else if(e.tag==='main' || e.tag==='meter' || e.tag===undefined){ c.state.I = I; c.state.V = Vn1-Vn2; }
      else { c.state['I_'+e.tag] = I; c.state['V_'+e.tag] = Vn1-Vn2; }
 const FUENTES = ['battery','acsource','solar_panel','coin_cell','aa_battery','usb_port','current_source','thermocouple'];
        if(FUENTES.includes(c.type)) this.totalCurrent = Math.max(this.totalCurrent, Math.abs(I));
    });
    comps.forEach(c=>{ const def=DEF(c); if(def.postSolve) def.postSolve(c); });
  }

  collectEdgesNonlinear(comps, wires, topo){
    const raw = this.collectEdges(comps, wires, topo);
    return raw.map(e=>{
      if(e.type==='DIODE'){
        const st = e.owner.state?.diodeState || 'off';
        const on = st==='on';
        return {...e, type: on? 'R':'OPEN', value: on? (e.Ron||10) : 1e9, thr:e.value, __kind:'DIODE'};
      }
      if(e.type==='ZENER'){
        const st = e.owner.state?.diodeState || 'off';
        const on = st==='fwd' || st==='rev';
        return {...e, type: on? 'R':'OPEN', value: on? (e.Ron||10) : 1e9, thr:e.value, __kind:'ZENER'};
      }
      return e;
    });
  }
}

function rotPt(x,y,deg){ const r=deg*Math.PI/180; return {x:x*Math.cos(r)-y*Math.sin(r), y:x*Math.sin(r)+y*Math.cos(r)}; }
function termAbs(c, idx){
  const t = c.terminals[idx]; const p = rotPt(t.x,t.y,c.rot);
  return {x:c.x+p.x, y:c.y+p.y};
}
function snap(v){ return Math.round(v/GRID)*GRID; }

function compHalfExtent(c){
  let w=44,h=38;
  if(c.terminals && c.terminals.length){
    w = Math.max(w, Math.max(...c.terminals.map(t=>Math.abs(t.x)))+8);
    h = Math.max(h, Math.max(...c.terminals.map(t=>Math.abs(t.y)))+8);
  }
  return {w,h};
}
function hitComponent(x,y){
  for(let i=comps.length-1;i>=0;i--){
    const c=comps[i]; const dx=x-c.x, dy=y-c.y;
    const rr = rotPt(dx,dy,-c.rot);
    const ext = compHalfExtent(c);
    if(Math.abs(rr.x)<ext.w && Math.abs(rr.y)<ext.h) return c;
  }
  return null;
}
function hitTerminal(x,y){
  for(let i=comps.length-1;i>=0;i--){
    const c=comps[i];
    for(let ti=0; ti<c.terminals.length; ti++){
      const p = termAbs(c,ti);
      if(Math.hypot(p.x-x,p.y-y) < 14) return {compId:c.id, term:ti, x:p.x, y:p.y};
    }
  }
  return null;
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
  t = Math.max(0,Math.min(1,t));
  const cx=x1+t*dx, cy=y1+t*dy;
  return Math.hypot(px-cx,py-cy);
}
function hitWire(x,y){
  for(let i=wires.length-1;i>=0;i--){
    const w=wires[i];
    const ca=comps.find(c=>c.id===w.a.compId), cb=comps.find(c=>c.id===w.b.compId);
    if(!ca||!cb) continue;
    const pa=termAbs(ca,w.a.term), pb=termAbs(cb,w.b.term);
    const pts = pathForWire(pa,pb);
    for(let s=1;s<pts.length;s++){
      if(distToSeg(x,y,pts[s-1][0],pts[s-1][1],pts[s][0],pts[s][1]) < 10) return w;
    }
  }
  return null;
}

function getPos(ev){
  const r=canvas.getBoundingClientRect();
  const t = ev.touches? ev.touches[0] : ev;
 return {x:t.clientX-r.left, y:t.clientY-r.top};
}
let downInfo=null;
function onDown(ev){
  ev.preventDefault();
  const sp=getPos(ev);
  const p=toWorld(sp);
  downInfo={p, sp, t:performance.now(), moved:false, hitTermOnDown:false};

  if(cutMode){
    const hitW = hitWire(p.x,p.y);
    if(hitW){
      wires.splice(wires.indexOf(hitW),1);
    } else {
      panning = {startSp:sp, startPan:{x:panX,y:panY}};
    }
    return;
  }

  if(wireMode){
    const term = hitTerminal(p.x,p.y);
    if(term){
      downInfo.hitTermOnDown = true;
      if(!wireStart) wireStart = term;
      else{
        if(!(wireStart.compId===term.compId && wireStart.term===term.term)){
          wires.push({a:{compId:wireStart.compId, term:wireStart.term}, b:{compId:term.compId, term:term.term}});
        }
        wireStart = null;
      }
    } else {
      panning = {startSp:sp, startPan:{x:panX,y:panY}};
    }
    return;
  }

  if(selectedType){
    const c = newComponent(selectedType, snap(p.x), snap(p.y));
    comps.push(c);
    selectedComp = c; selectComponent(c);
    updateModeUI();
    return;
  }

  const hitC = hitComponent(p.x,p.y);
  if(hitC){ dragging = hitC; dragOffset={x:p.x-hitC.x, y:p.y-hitC.y}; selectComponent(hitC); }
  else {
    selectComponent(null);
    panning = {startSp:sp, startPan:{x:panX,y:panY}};
  }
}
function onMove(ev){
  if(!downInfo) return;
  const sp=getPos(ev);
  const p=toWorld(sp);
  if(Math.hypot(sp.x-downInfo.sp.x,sp.y-downInfo.sp.y)>4) downInfo.moved=true;
 if(dragging){ ev.preventDefault(); dragging.x = snap(p.x-dragOffset.x); dragging.y = snap(p.y-dragOffset.y); return; }
 if(panning){
    ev.preventDefault();
    panX = panning.startPan.x + (sp.x-panning.startSp.x);
    panY = panning.startPan.y + (sp.y-panning.startSp.y);
    clampPan();
    return;
  }
}
function onUp(ev){
  const p = downInfo? downInfo.p : null;
 const wasDragging = !!dragging, wasPanning = !!panning;
 const wasMoved = downInfo ? downInfo.moved : false;
 dragging = null; panning = null;
  if(!downInfo){ return; }

  if(cutMode){ downInfo=null; return; }

  if(wireMode){
    if(!downInfo.hitTermOnDown && !downInfo.moved) wireStart = null;
    downInfo=null;
    return;
  }
  if((wasDragging || wasPanning) && wasMoved){ downInfo=null; return; }

  if(!wasMoved && !selectedType){
    const hitC = hitComponent(p.x,p.y);
    if(hitC){
      const def = COMPONENTS[hitC.type];
      if(def.interactive && def.onTap){ def.onTap(hitC); }
    }
  }
  downInfo=null;
}
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp);

function isDamaged(c){
  if(c.type==='fuse') return !!c.props.blown;
  if(c.type==='electrolytic_capacitor') return !!c.props.failed;
  if(c.type==='led') return !!c.props.burned;
  return false;
}
function resetDamage(c){
  if(c.type==='fuse') c.props.blown=false;
  if(c.type==='electrolytic_capacitor'){ c.props.failed=false; c.state.charge=0; }
  if(c.type==='led') c.props.burned=false;
}

  const def = COMPONENTS[c.type];
  propPanel.style.display='block';
  let html = `<h4>${def.label}</h4>`;
  const fields = propFieldsFor(c.type);
  fields.forEach(f=>{
    if(f.type==='range'){
      html += `<label>${f.label}: <b id="val_${f.key}">${(c.props[f.key]*100|0)}%</b></label>
        <input type="range" min="0" max="1" step="0.01" value="${c.props[f.key]}" data-key="${f.key}">`;
    } else if(f.type==='select'){
      const cur = c.props[f.key];
      html += `<label>${f.label}</label><select data-key="${f.key}" data-select="1">`
        + f.options.map(o=>`<option value="${o.value}" ${o.value===cur?'selected':''}>${o.label}</option>`).join('')
        + `</select>`;
    } else {
      html += `<label>${f.label}</label><input type="number" step="${f.step||1}" value="${c.props[f.key]}" data-key="${f.key}">`;
    }
  });
 if(c.type==='arduino'){
    html += `<button class="tbtn on" id="btnArdProgram" style="width:100%;margin-top:10px;">💻 Programar Arduino</button>`;
  }
  if(isDamaged(c)){
    html += `<button class="tbtn danger" id="btnResetDamage" style="width:100%;margin-top:10px;">🔧 Reestablecer</button>`;
  }
  propPanel.innerHTML = html;
  if(c.type==='arduino'){
    const btn = document.getElementById('btnArdProgram');
    if(btn) btn.addEventListener('click', ()=> openArduinoEditor(c));
  }
  if(isDamaged(c)){

    if(btnR) btnR.addEventListener('click', ()=>{ resetDamage(c); renderProps(c); });
  }
  propPanel.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const key=inp.dataset.key; const val=parseFloat(inp.value);
      c.props[key]=val;

 renderProps(c);

// SAVE / LOAD / STORAGE
// ============================================================
const storage = {
  _mem:{},
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ this._mem[k]=v; } },
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return this._mem[k]??null; } },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){ delete this._mem[k]; } },
 keys(){
    try{
      const out=[];
      for(let i=0;i<localStorage.length;i++) out.push(localStorage.key(i));
      return out;
    }catch(e){ return Object.keys(this._mem); }
  }
};
function getSaves(){
  const list=[];
  storage.keys().forEach(k=>{
    if(k.startsWith('circuitlab_circuit_')){
      try{ const data=JSON.parse(storage.get(k)); list.push({name:data.name||k.replace('circuitlab_circuit_',''), key:k, time:data.time||0}); }catch(_){}
    }
  });
  return list.sort((a,b)=>b.time-a.time);
}
function saveCircuit(name){
  if(!name) return;
  const payload = {
    version:1, name, time:Date.now(),
    comps: comps.map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,props:c.props,state:{}})),
    wires
  };
  storage.set('circuitlab_circuit_'+name, JSON.stringify(payload));
}
function loadCircuit(keyOrName){
 const key = keyOrName.startsWith('circuitlab_circuit_')? keyOrName : 'circuitlab_circuit_'+keyOrName;
  const raw = storage.get(key);
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    comps = (data.comps||[]).map(c=>{
      const def = COMPONENTS[c.type];
      if(!def) return null;
      return { ...c, terminals: JSON.parse(JSON.stringify(def.terminals)), state:{} };
    }).filter(Boolean);
    wires = (data.wires||[]).map(w=>({a:{...w.a},b:{...w.b}}));
    nextId = comps.length? Math.max(...comps.map(c=>parseInt(c.id.replace('c','')||0)))+1 : 1;
    return true;
  }catch(e){ return false; }

let scopeActive = false;

document.getElementById('btnScope').addEventListener('click', () => {

      <div style="margin-top:10px;">
        <label style="font-size:11px; color:var(--text-dim);">Ventana de tiempo: <b id="scopeWinVal">2.0s</b></label>
        <input type="range" id="scopeWinSlider" min="0.2" max="5" step="0.1" value="2" style="width:100%;">
      </div>
    </div>
  `, false); // false = no backdrop, permite interactuar con el lienzo
});

function drawScope() {
  const sc = document.getElementById('scopeCanvas');
  if(!sc) return;
  const sctx = sc.getContext('2d');
  const rect = sc.getBoundingClientRect();
  if (sc.width !== rect.width * window.devicePixelRatio) {
    sc.width = rect.width * window.devicePixelRatio;
    sc.height = 200 * window.devicePixelRatio;
    sctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  const W = rect.width, H = 200;
  
  sctx.fillStyle = '#04140c'; sctx.fillRect(0,0,W,H);
  sctx.strokeStyle = 'rgba(57,211,168,.1)'; sctx.lineWidth = 1;
  for(let i=0; i<10; i++) {
    sctx.beginPath(); sctx.moveTo(i*W/10, 0); sctx.lineTo(i*W/10, H); sctx.stroke();
    sctx.beginPath(); sctx.moveTo(0, i*H/10); sctx.lineTo(W, i*H/10); sctx.stroke();
  }
  sctx.strokeStyle = 'rgba(57,211,168,.3)';
  sctx.beginPath(); sctx.moveTo(0, H/2); sctx.lineTo(W, H/2); sctx.stroke();
  
  const win = parseFloat(document.getElementById('scopeWinSlider')?.value || 2);
  const tNow = sim.simTime;
  const tStart = tNow - win;
  
  let maxV = 0.1;
  scopeData.forEach(d => {
     if(d.v1 !== null) maxV = Math.max(maxV, Math.abs(d.v1));
     if(d.v2 !== null) maxV = Math.max(maxV, Math.abs(d.v2));
  });
  maxV *= 1.15;
  
  function drawTrace(valKey, color) {
     sctx.strokeStyle = color; sctx.lineWidth = 1.5;
     sctx.beginPath();
     let started = false;
     scopeData.forEach(d => {
        if (d[valKey] === null) return;
        const x = ((d.t - tStart) / win) * W;
        const y = H/2 - (d[valKey] / maxV) * (H/2 - 10);
        if (!started) { sctx.moveTo(x, y); started = true; }
        else sctx.lineTo(x, y);
     });
     sctx.stroke();
  }
  
  drawTrace('v1', '#39d3a8');
  drawTrace('v2', '#ffb02e');
  
  sctx.fillStyle = '#39d3a8'; sctx.font = '10px sans-serif'; sctx.textAlign='left';
  sctx.fillText('CH1: ' + (document.getElementById('scopeCh1Comp')?.value || '--'), 5, 12);
  sctx.fillStyle = '#ffb02e';
  sctx.fillText('CH2: ' + (document.getElementById('scopeCh2Comp')?.value || '--'), 5, 24);
  sctx.fillStyle = '#8a97a8';
  sctx.textAlign='right';
  sctx.fillText('±' + maxV.toFixed(2) + 'V/A', W-5, 12);
  sctx.fillText(win.toFixed(1) + 's', W-5, H-5);
}

// ============================================================
// RENDER
// ============================================================
function drawGrid(){
  const r = wrap.getBoundingClientRect();
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle = '#1c2530';
  let startX = panX % GRID; if(startX<0) startX+=GRID;
  let startY = panY % GRID; if(startY<0) startY+=GRID;
  for(let x=startX;x<r.width;x+=GRID) for(let y=startY;y<r.height;y+=GRID) ctx.fillRect(x,y,1,1);
}

function pathForWire(a,b){
  const midX = (a.x+b.x)/2;
  return [[a.x,a.y],[midX,a.y],[midX,b.y],[b.x,b.y]];
}

function drawWires(){
  wires.forEach(w=>{
 const ca=comps.find(c=>c.id===w.a.compId), cb=comps.find(c=>c.id===w.b.compId);
    if(!ca||!cb) return;
    const pa=termAbs(ca,w.a.term), pb=termAbs(cb,w.b.term);
    const pts = pathForWire(pa,pb);
    const I = Math.max(Math.abs(ca.state?.I||0), Math.abs(cb.state?.I||0));
    const on = sim.powered && I>0.0008;
    ctx.strokeStyle = on? COL_WIRE_ON : COL_WIRE_OFF;
    ctx.lineWidth = on? 3 : 2.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.stroke();
    if(on){
      const totalLen = segLen(pts);
      const speed = Math.min(220, 40+Math.abs(I)*4000);
      const nDots = Math.max(1, Math.floor(totalLen/26));
      for(let i=0;i<nDots;i++){
        let d = ( (particlePhase*speed) + i*(totalLen/nDots) ) % totalLen;
        if(I<0) d = totalLen-d;
        const pt = pointAtLen(pts,d);
        ctx.beginPath(); ctx.arc(pt.x,pt.y,2.6,0,Math.PI*2);
        ctx.fillStyle='#fff3d6'; ctx.fill();
 }
    }
    drawTerminalDot(ctx,pa.x,pa.y, true); drawTerminalDot(ctx,pb.x,pb.y, true);
  });
}
function segLen(pts){ let l=0; for(let i=1;i<pts.length;i++) l+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return l; }
function pointAtLen(pts,d){
  for(let i=1;i<pts.length;i++){
 const segL = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    if(d<=segL || i===pts.length-1){
      const t = segL? d/segL : 0;
      return {x:pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t, y:pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t};
    }
    d-=segL;
  }
  return {x:pts[0][0],y:pts[0][1]};
}

function drawComponents(){
  comps.forEach(c=>{
    const def = COMPONENTS[c.type];
    ctx.save();
    ctx.translate(c.x,c.y); ctx.rotate(c.rot*Math.PI/180);
    const rotRad = c.rot*Math.PI/180;
    const origFillText = ctx.fillText;
    if(rotRad!==0){
      ctx.fillText = function(text,x,y,maxWidth){
        ctx.save(); ctx.translate(x,y); ctx.rotate(-rotRad);
        origFillText.call(ctx,text,0,0,maxWidth);
        ctx.restore();
      };
    }
    def.draw(ctx,c,sim);
    ctx.fillText = origFillText;
    ctx.restore();
    if(c===selectedComp){
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot*Math.PI/180);
      ctx.strokeStyle='#ffb02e'; ctx.setLineDash([4,3]); ctx.lineWidth=1.4;
      ctx.strokeRect(-42,-36,84,72); ctx.restore();
    }
    c.terminals.forEach((t,ti)=>{
      const p = termAbs(c,ti);
      const connected = wires.some(w=> (w.a.compId===c.id&&w.a.term===ti)||(w.b.compId===c.id&&w.b.term===ti));
 drawTerminalDot(ctx,p.x,p.y, connected || wireMode);
    });
  });
  if(wireMode && wireStart){
    ctx.strokeStyle='#ffb02e'; ctx.setLineDash([5,4]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(wireStart.x,wireStart.y,10,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  }
}

function updateStatus(){
  const bar = document.getElementById('statusbar');
  const battery = comps.find(c=>c.type==='battery');
  const nComps = comps.length, nWires = wires.length;
  let html = `<div class="chip">Componentes: <b>${nComps}</b></div><div class="chip">Cables: <b>${nWires}</b></div>`;
  html += `<div class="chip">Estado: <b>${sim.powered? 'ENCENDIDO':'apagado'}</b></div>`;
  if(cutMode) html += `<div class="chip" style="color:var(--danger);border-color:var(--danger);">✂ Toca un cable para eliminarlo</div>`;
  if(sim.powered) html += `<div class="chip">Corriente total: <b>${fmtAmp(sim.totalCurrent||0)}</b></div>`;
  bar.innerHTML = html;
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  particlePhase += dt;
  sim.step(comps, wires, dt);
  comps.forEach(c=>{
    if(COMPONENTS[c.type] && COMPONENTS[c.type].momentary && c.props.pressed){
      c.state._momT = (c.state._momT||0) + dt;
      if(c.state._momT > 0.25){ c.props.pressed = false; c.state._momT = 0; }
    }
  });
  
  if (scopeActive) {
     const ch1CompId = document.getElementById('scopeCh1Comp')?.value;
     const ch1Type = document.getElementById('scopeCh1Type')?.value;
     const ch2CompId = document.getElementById('scopeCh2Comp')?.value;
     const ch2Type = document.getElementById('scopeCh2Type')?.value;
     
     const v1 = ch1CompId ? (comps.find(c=>c.id===ch1CompId)?.state?.[ch1Type] || 0) : null;
     const v2 = ch2CompId ? (comps.find(c=>c.id===ch2CompId)?.state?.[ch2Type] || 0) : null;
     
     scopeData.push({ t: sim.simTime, v1, v2 });
     
     const win = parseFloat(document.getElementById('scopeWinSlider')?.value || 2);
     while (scopeData.length > 0 && scopeData[0].t < sim.simTime - win - 0.2) {
         scopeData.shift();
     }
     drawScope();
  }
  
  drawGrid();
  ctx.save();
  ctx.translate(panX, panY);
  drawWires(); drawComponents();
  ctx.restore();
  updateStatus();
  requestAnimationFrame(loop);
}

resize();
updateModeUI();
updatePlacingChip();
requestAnimationFrame(loop);

</script>

current_sensor_acs712: { label:'Sensor de Corriente (ACS712)', cat:'Medición', icon:'A~V', props:{sensitivity:0.185, Vcc:5},
  terminals:[T(-40,0,'IN'),T(40,0,'OUT'),T(0,-30,'VCC'),T(-18,30,'GND'),T(18,30,'VOUT')],
  edges(c){
    const path = {n:[0,1], type:'R', value:0.0015, tag:'meter'};
    const vcc = (c.state.Vt2||0)-(c.state.Vt3||0);
    if(vcc < 3.0) return [path, {n:[4,3], type:'OPEN', value:1e9}];
    const I = c.state.I||0;
    const vout = clamp01((vcc/2 + I*c.props.sensitivity)/Math.max(vcc,0.001)) * vcc;
    const sig = {n:[4,3], type:'V', value: vout, Rint:5, tag:'vout'};
    return [path, sig];
  },
  step(c, dt){
    const target = c.state.I||0;
    c.state.needle = lerp(c.state.needle||0, target, Math.min(1, dt*6));
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-16,0]]); leadLines(ctx,[[16,0],[40,0]]);
    leadLines(ctx,[[0,-30],[0,-14]]); leadLines(ctx,[[-18,30],[-6,14]]); leadLines(ctx,[[18,30],[6,14]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,14,Math.PI,0); ctx.stroke();
    const powered = ((c.state.Vt2||0)-(c.state.Vt3||0)) >= 3.0;
    const ang = Math.PI + Math.PI*clamp01(0.5 + (c.state.needle||0)/4);
    ctx.strokeStyle= powered? '#ffb02e' : '#556274'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ang)*12, Math.sin(ang)*12); ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText('ACS712',0,-4);
    ctx.fillText(powered? fmtAmp(c.state.needle||0) : 'sin VCC',0,26);
  }
},

stepper_motor: { label:'Motor Paso a Paso', cat:'Salida', icon:'⚙⚙', props:{Rcoil:30, stepsPerRev:24},
  terminals:[T(-40,-20,'A+'),T(-40,20,'A-'),T(40,-20,'B+'),T(40,20,'B-')],
  edges(c){
    return [
      {n:[0,1], type:'R', value:c.props.Rcoil, tag:'a'},
      {n:[2,3], type:'R', value:c.props.Rcoil, tag:'b'}
    ];
  },
  step(c, dt, sim){
    const I = Math.abs(c.state.I_a||0) + Math.abs(c.state.I_b||0);
    const target = (c.state.rawAngle||0) + I*dt*220;
    c.state.rawAngle = target;
    const stepSize = (Math.PI*2)/Math.max(4,c.props.stepsPerRev);
    c.state.angle = Math.round(target/stepSize)*stepSize; // efecto de "paso" discreto
  },
  draw(ctx,c){
    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+16:t.x-16, t.y]]));
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
    const moving = (Math.abs(c.state.I_a||0)+Math.abs(c.state.I_b||0)) > 0.01;
    ctx.save(); ctx.rotate(c.state.angle||0);
    ctx.strokeStyle = moving? COL_WIRE_ON:COL_BODY;
    for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i*Math.PI/4); ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(18,0); ctx.stroke(); ctx.restore(); }
    ctx.restore();
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center'; ctx.fillText('STEPPER',0,32);
  }
},

if(COMPONENTS.led){
  const origLedDraw = COMPONENTS.led.draw;
  COMPONENTS.led.draw = function(ctx,c,sim){
    origLedDraw(ctx,c,sim);
    if(!c.props.burned){
      const I = Math.abs(c.state?.I||0);
      if(I>0.001){
        const flick = 0.85 + 0.15*Math.sin(sim.simTime*40 + (c.x||0));
        ctx.save(); ctx.globalAlpha = 0.18*flick;
        ctx.fillStyle = c.props.color;
        ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  };
}
// Ventilador/motor: agrega estela de movimiento (motion blur) en las aspas.
['fan','fan_12v','motor'].forEach(type=>{
  if(!COMPONENTS[type]) return;
  const origDraw = COMPONENTS[type].draw;
  COMPONENTS[type].draw = function(ctx,c,sim){
    const spinBefore = c.state?.spin||0;
    origDraw(ctx,c,sim);
    const I = Math.abs(c.state?.I||0);
    if(I>0.01){
      ctx.save(); ctx.globalAlpha=0.18; ctx.strokeStyle=COL_WIRE_ON; ctx.lineWidth=3;
      ctx.rotate(spinBefore-0.3);
      ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.stroke();
      ctx.restore();
    }
  };
});
// Relé: transición animada del inducido en vez de cambio instantáneo.
if(COMPONENTS.relay){
  const origRelayDraw = COMPONENTS.relay.draw;
  COMPONENTS.relay.step = function(c, dt){
    const pulled = Math.abs(c.state?.Icoil||0) >= c.props.Ipull;
    c.state.armPos = lerp(c.state.armPos||0, pulled?1:0, Math.min(1,dt*8));
  };
  COMPONENTS.relay.draw = function(ctx,c,sim){
    origRelayDraw(ctx,c,sim);
    const a = c.state.armPos||0;
    if(a>0.02){
      ctx.save(); ctx.globalAlpha = a*0.5;
      ctx.strokeStyle='#ffb02e'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(-14+a*4,-20); ctx.lineTo(-14+a*4,20); ctx.stroke();
      ctx.restore();
    }
  };
}

    lcd_1602:[{key:'R',label:'Resistencia (Ω)'}]
  };
  propFieldsFor = function(type){

  };
}

<script>
// ============================================================

(function(){

function clamp01(v){ return Math.max(0,Math.min(1,v)); }

const NUEVOS2 = {

// ---------------------------------------------------------------
// 1) REGULADOR LM7805 — Control — 3 pines reales: IN, GND, OUT
// ---------------------------------------------------------------
lm7805_regulator: { label:'Regulador LM7805 (5V)', cat:'Control', icon:'7805', props:{Vout:5, dropout:2},

  },

},

// 2) SENSOR DHT11 — Sensores — 3 pines: VCC, DATA, GND

dht11_sensor: { label:'Sensor DHT11 (Temp/Humedad)', cat:'Sensores', icon:'DHT', props:{temp:0.4, humidity:0.5, Vcc:5},

relay_module: { label:'Módulo de Relé (activo en bajo)', cat:'Control', icon:'⛭◇', props:{Vth:2.5},
  terminals:[T(-40,-24,'VCC'),T(-40,0,'GND'),T(-40,24,'IN'),T(40,-24,'COM'),T(40,0,'NO'),T(40,24,'NC')],
  edges(c){
    const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
    if(vccV < 3.0) return [{n:[3,4], type:'OPEN', value:1e9},{n:[3,5], type:'R', value:0.05}];
    const vin = (c.state.Vt2||0)-(c.state.Vt1||0);

    leadLines(ctx,[[40,-24],[16,-24]]); leadLines(ctx,[[40,0],[16,0]]); leadLines(ctx,[[40,24],[16,24]]);
    const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
    const energized = vccV>=3.0 && ((c.state.Vt2||0)-(c.state.Vt1||0)) < c.props.Vth;
    ctx.strokeStyle= energized? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-16,-30,32,60);

// ---------------------------------------------------------------
// 4) ZUMBADOR PIEZOELÉCTRICO PASIVO — Salida — 2 pines
// A diferencia del zumbador activo, necesita una señal alterna
// (PWM/AC) para sonar; con DC fijo solo hace un "clic" y calla.
// ---------------------------------------------------------------
passive_buzzer: { label:'Zumbador Piezo. Pasivo', cat:'Salida', icon:'🔔≈', props:{R:1000},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'R', value:c.props.R}]; },
  step(c, dt){
    const v = c.state?.V||0;
    const prevSign = c.state._prevSign ?? 0;
    const sign = v>0.05? 1 : (v<-0.05? -1 : 0);
    if(sign !== 0 && prevSign !== 0 && sign !== prevSign) c.state._flipTimer = 1; // detecta cambio de polaridad = señal AC
    else c.state._flipTimer = Math.max(0,(c.state._flipTimer||0)-dt*3);
    c.state._prevSign = sign || prevSign;
  },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-16,0]]); leadLines(ctx,[[16,0],[40,0]]);
    const sounding = (c.state._flipTimer||0) > 0.05;
    ctx.strokeStyle= sounding? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.stroke();
    if(sounding){ for(let i=0;i<2;i++){ ctx.beginPath(); ctx.arc(0,0,20+i*5,0,Math.PI*2); ctx.strokeStyle='rgba(255,176,46,.4)'; ctx.stroke(); } }
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText(sounding?'sonando (AC)':'requiere señal AC/PWM',0,28);
  }
},

thermal_fuse: { label:'Fusible Térmico (un solo uso)', cat:'Control', icon:'🌡⎓', props:{temp:0.3, threshold:0.75, blown:false},

    ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='7.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.blown?'FUNDIDO (permanente)':'temp '+Math.round(c.props.temp*100)+'%', 0, 22);

lm386_amplifier: { label:'Amplificador de Audio LM386', cat:'Módulos', icon:'🔊OP', props:{gain:20, Vcc_min:4},
  terminals:[T(-30,-16,'in-'),T(-30,16,'in+'),T(0,-30,'VCC'),T(0,30,'GND'),T(40,0,'OUT')],
  edges(c){
    const vcc = (c.state.Vt2||0)-(c.state.Vt3||0);

// ---------------------------------------------------------------
// 10) TRIAC — Semiconductores — 3 pines: MT1, MT2, GATE

triac: { label:'TRIAC (interruptor bidireccional)', cat:'Semiconductores', icon:'⇹⚡', props:{Igt:0.003, Ih:0.001},
  terminals:[T(-40,0,'MT1'),T(40,0,'MT2'),T(0,34,'gate')],

    return [
      {n:[0,1], type: latched? 'R':'OPEN', value:8},
      {n:[2,0], type:'R', value:180, tag:'gatesense'}

  },
  postSolve(c){
    const Iload = Math.abs(c.state?.I||0);

    if(!c.state.latched){
      if(gateI >= c.props.Igt) c.state.latched = true; // dispara en cualquier semiciclo

  },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-13,0]]); leadLines(ctx,[[13,0],[40,0]]); leadLines(ctx,[[0,34],[0,10]]);

    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';

<script>
// ============================================================
// pin-labels.js — Muestra el nombre de cada pin de cada componente
// Pegar al final, después de todos los demás <script>.
// ============================================================
(function(){

  // Guarda la función original de dibujo de componentes
  const origDrawComponents = drawComponents;
  let showPinLabels = true;

  drawComponents = function(){
    origDrawComponents();
    if(!showPinLabels) return;

    comps.forEach(c=>{
      c.terminals.forEach((t,ti)=>{
        const p = termAbs(c, ti);
        const label = t.name ? t.name : ('P'+ti);

        // Vector desde el centro del componente hacia el terminal,
        // extendido un poco más para que la etiqueta no tape el pin.
        const dx = p.x - c.x, dy = p.y - c.y;
        const dist = Math.hypot(dx,dy) || 1;
        const ext = 15;
        const lx = p.x + (dx/dist)*ext;
        const ly = p.y + (dy/dist)*ext;

        ctx.save();
        ctx.font = '8px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const textW = ctx.measureText(label).width;

        // Pastilla de fondo para que se lea sobre cualquier color
        ctx.fillStyle = 'rgba(11,15,20,0.88)';
        ctx.strokeStyle = 'rgba(255,176,46,0.45)';
        ctx.lineWidth = 1;
        const padX = 4, padY = 2.5;
        const bx = lx - textW/2 - padX, by = ly - 6 - padY;
        const bw = textW + padX*2, bh = 12 + padY;
        if(ctx.roundRect){
          ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4);
          ctx.fill(); ctx.stroke();
        } else {
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeRect(bx, by, bw, bh);
        }

        ctx.fillStyle = '#ffe9c2';
        ctx.fillText(label, lx, ly);
        ctx.restore();
      });
    });
  };

  // Botón en la barra superior para mostrar/ocultar las etiquetas
  const topbar = document.getElementById('topbar');
  if(topbar){
    const btn = document.createElement('button');
    btn.className = 'tbtn on';
    btn.id = 'btnPinLabels';
    btn.title = 'Mostrar/ocultar nombres de pines';
    btn.textContent = '🏷️ Pines';
    topbar.appendChild(btn);
    btn.addEventListener('click', ()=>{
      showPinLabels = !showPinLabels;
      btn.classList.toggle('on', showPinLabels);
    });
  }

})();
</script>
<script>
// ============================================================
// zoom-y-nuevos-componentes-3.js — Zoom del lienzo + 15 componentes reales
// Pegar al final, después de todos los demás <script>.
// ============================================================
(function(){

// ---------------- ZOOM ----------------
window.zoomScale = window.zoomScale || 1;

toWorld = function(p){ return {x:(p.x-panX)/zoomScale, y:(p.y-panY)/zoomScale}; };

hitTerminal = function(x,y){
  const thr = 14/zoomScale;
  for(let i=comps.length-1;i>=0;i--){
    const c=comps[i];
    for(let ti=0; ti<c.terminals.length; ti++){
      const p = termAbs(c,ti);
      if(Math.hypot(p.x-x,p.y-y) < thr) return {compId:c.id, term:ti, x:p.x, y:p.y};
    }
  }
  return null;
};

hitWire = function(x,y){
  const thr = 10/zoomScale;
  for(let i=wires.length-1;i>=0;i--){
    const w=wires[i];
    const ca=comps.find(c=>c.id===w.a.compId), cb=comps.find(c=>c.id===w.b.compId);
    if(!ca||!cb) continue;
    const pa=termAbs(ca,w.a.term), pb=termAbs(cb,w.b.term);
    const pts = pathForWire(pa,pb);
    for(let s=1;s<pts.length;s++){
      if(distToSeg(x,y,pts[s-1][0],pts[s-1][1],pts[s][0],pts[s][1]) < thr) return w;
    }
  }
  return null;
};

drawGrid = function(){
  const r = wrap.getBoundingClientRect();
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle = '#1c2530';
  const g = GRID*zoomScale;
  if(g<3) return;
  let startX = panX % g; if(startX<0) startX+=g;
  let startY = panY % g; if(startY<0) startY+=g;
  for(let x=startX;x<r.width;x+=g) for(let y=startY;y<r.height;y+=g) ctx.fillRect(x,y,1,1);
};

loop = function(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  particlePhase += dt;
  sim.step(comps, wires, dt);
  comps.forEach(c=>{
    if(COMPONENTS[c.type] && COMPONENTS[c.type].momentary && c.props.pressed){
      c.state._momT = (c.state._momT||0) + dt;
      if(c.state._momT > 0.25){ c.props.pressed = false; c.state._momT = 0; }
    }
  });

  if (scopeActive) {
     const ch1CompId = document.getElementById('scopeCh1Comp')?.value;
     const ch1Type = document.getElementById('scopeCh1Type')?.value;
     const ch2CompId = document.getElementById('scopeCh2Comp')?.value;
     const ch2Type = document.getElementById('scopeCh2Type')?.value;
     const v1 = ch1CompId ? (comps.find(c=>c.id===ch1CompId)?.state?.[ch1Type] || 0) : null;
     const v2 = ch2CompId ? (comps.find(c=>c.id===ch2CompId)?.state?.[ch2Type] || 0) : null;
     scopeData.push({ t: sim.simTime, v1, v2 });
     const win = parseFloat(document.getElementById('scopeWinSlider')?.value || 2);
     while (scopeData.length > 0 && scopeData[0].t < sim.simTime - win - 0.2) scopeData.shift();
     drawScope();
  }

  drawGrid();
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoomScale, zoomScale);
  drawWires(); drawComponents();
  ctx.restore();
  updateStatus();
  requestAnimationFrame(loop);
};

function updateZoomLabel(){
  const lbl = document.getElementById('btnZoomReset');
  if(lbl) lbl.textContent = Math.round(zoomScale*100)+'%';
}
function zoomAt(sp, factor){
  const world = toWorld(sp);
  zoomScale = Math.max(0.3, Math.min(3, zoomScale*factor));
  panX = sp.x - world.x*zoomScale;
  panY = sp.y - world.y*zoomScale;
  clampPan();
  updateZoomLabel();
}

canvas.addEventListener('wheel', function(ev){
  ev.preventDefault();
  zoomAt(getPos(ev), ev.deltaY<0? 1.1 : 1/1.1);
}, {passive:false});

const topbarZ = document.getElementById('topbar');
if(topbarZ){
  const zin = document.createElement('button'); zin.className='tbtn'; zin.id='btnZoomIn'; zin.textContent='🔍+';
  const zout = document.createElement('button'); zout.className='tbtn'; zout.id='btnZoomOut'; zout.textContent='🔍−';
  const zreset = document.createElement('button'); zreset.className='tbtn'; zreset.id='btnZoomReset'; zreset.textContent='100%';
  topbarZ.appendChild(zin); topbarZ.appendChild(zout); topbarZ.appendChild(zreset);
  zin.addEventListener('click', ()=>{ const r=wrap.getBoundingClientRect(); zoomAt({x:r.width/2,y:r.height/2}, 1.2); });
  zout.addEventListener('click', ()=>{ const r=wrap.getBoundingClientRect(); zoomAt({x:r.width/2,y:r.height/2}, 1/1.2); });
  zreset.addEventListener('click', ()=>{ zoomScale=1; updateZoomLabel(); });
}

// Pellizco (2 dedos) — se intercepta en fase de captura sobre el contenedor
// para no interferir con el arrastre/colocación de un solo dedo del lienzo.
let pinchState = null;
function touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
function touchMid(t){ return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2}; }
wrap.addEventListener('touchstart', function(ev){
  if(ev.touches.length===2){
    ev.preventDefault(); ev.stopPropagation();
    const r = canvas.getBoundingClientRect();
    const mid = touchMid(ev.touches);
    const sp = {x:mid.x-r.left, y:mid.y-r.top};
    pinchState = { dist: touchDist(ev.touches), scale0: zoomScale, world: toWorld(sp) };
  }
}, {capture:true, passive:false});
wrap.addEventListener('touchmove', function(ev){
  if(pinchState && ev.touches.length===2){
    ev.preventDefault(); ev.stopPropagation();
    const r = canvas.getBoundingClientRect();
    const mid = touchMid(ev.touches);
    const sp = {x:mid.x-r.left, y:mid.y-r.top};
    const d = touchDist(ev.touches);
    zoomScale = Math.max(0.3, Math.min(3, pinchState.scale0*(d/pinchState.dist)));
    panX = sp.x - pinchState.world.x*zoomScale;
    panY = sp.y - pinchState.world.y*zoomScale;
    clampPan();
    updateZoomLabel();
  }
}, {capture:true, passive:false});
wrap.addEventListener('touchend', function(ev){ if(ev.touches.length<2) pinchState=null; }, {capture:true});
