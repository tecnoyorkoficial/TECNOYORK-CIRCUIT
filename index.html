<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tecnoyork Electrónica</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tecnoyork">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#161e2a; --grid:#1c2530;
    --accent:#ffb02e; --accent2:#39d3a8; --wire-off:#3a4756; --wire-on:#ffb02e;
    --text:#e7edf5; --text-dim:#8a97a8; --danger:#ff5c5c; --border:#232d3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* TOP BAR */
  #topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--border);flex-shrink:0;z-index:20;
    overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:none; -ms-overflow-style:none;}
  #topbar::-webkit-scrollbar{height:0; display:none;}
  #topbar .logo{margin-right:4px;display:flex;align-items:center;flex-shrink:0;height:100%;}
  #topbar .logo-img{height:44px !important;max-height:44px !important;width:auto !important;
    max-width:190px;object-fit:contain;display:block;}
  .tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;}
  .tbtn:active{transform:scale(.95);}
  .tbtn.on{background:var(--accent2);color:#03291f;border-color:var(--accent2);font-weight:700;}
  .tbtn.danger{color:var(--danger);}

  /* MAIN LAYOUT */
  #main{flex:1;display:flex;min-height:0;position:relative;}

  /* PICKER & OVERLAY (shared base) */
  .pickerBackdrop{position:fixed;inset:0;background:rgba(4,6,9,.6);backdrop-filter:blur(2px);
    display:none;z-index:40;}
  .pickerBackdrop.open{display:block;}
  .pickerModal{position:fixed;left:0;right:0;bottom:0;max-height:86vh;background:var(--panel);
    border-radius:18px 18px 0 0;z-index:41;display:none;flex-direction:column;
    box-shadow:0 -8px 30px rgba(0,0,0,.5);border-top:1px solid var(--border);}
  .pickerModal.open{display:flex;}
  .pickerHandle{width:38px;height:4px;background:#2a3542;border-radius:3px;margin:8px auto 2px;}
  .pickerHeader{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;flex-shrink:0;
    border-bottom:1px solid var(--border);}
  .pickerHeader h3{margin:0;font-size:14px;flex:1;}
  .pickerClose{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;}
  .picker-search-row{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;flex-shrink:0;
    border-bottom:1px solid var(--border);}
  .pickerSearch{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 12px;font-size:13px;}
  .pickerBody{overflow-y:auto;padding:6px 12px 22px;-webkit-overflow-scrolling:touch;}
  .cat-title{font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;
    font-weight:700;padding:14px 2px 8px;}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;}
  .comp-btn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;
    background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 5px 8px;
    cursor:pointer;text-align:center;}
  .comp-btn:active{transform:scale(.96);}
  .comp-btn.active{border-color:var(--accent);background:#2a2210;}
  .comp-btn .icon-wrap{width:60px;height:42px;display:flex;align-items:center;justify-content:center;
    background:#0d1219;border-radius:8px;}
  .comp-btn .icon-wrap img{width:56px;height:38px;}
  .comp-btn .lbl{font-size:9.5px;color:var(--text-dim);line-height:1.2;}
  #noResults{color:var(--text-dim);font-size:12px;text-align:center;padding:30px 10px;}

  /* OVERLAY BODY VARIANTS */
  .save-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .save-row input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 12px;font-size:13px;}
  .slist{display:flex;flex-direction:column;gap:6px;}
  .sitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;cursor:pointer;}
  .sitem:active{transform:scale(.98);}
  .sitem .name{flex:1;font-size:13px;}
  .sitem .date{font-size:10px;color:var(--text-dim);}
  .sitem .del{color:var(--danger);font-size:12px;background:none;border:none;cursor:pointer;width:28px;text-align:center;}
  .empty{color:var(--text-dim);font-size:12px;text-align:center;padding:20px 10px;}

  /* ENVIRONMENT PANEL */
  .env-group { margin-bottom: 18px; }
  .env-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text); margin-bottom:6px; }
  .env-label b { color:var(--accent); }
  .env-slider { width:100%; -webkit-appearance:none; height:6px; background:var(--panel2); border-radius:3px; outline:none; }
  .env-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:var(--accent); border-radius:50%; cursor:pointer; }
  .env-slider::-moz-range-thumb { width:18px; height:18px; background:var(--accent); border-radius:50%; cursor:pointer; border:none; }

  /* SCOPE PANEL */
  .scope-row { display:flex; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .scope-col { flex:1; min-width:140px; display:flex; flex-direction:column; gap:6px; }
  .scope-col select { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px; font-size:12px; }
  .scope-col label { font-size:11px; color:var(--text-dim); }

  /* Chip "colocando componente" flotante sobre el lienzo */
  #placingChip{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;
    align-items:center;gap:8px;background:rgba(255,176,46,.14);border:1px solid var(--accent);
    color:var(--accent);border-radius:20px;padding:6px 8px 6px 14px;font-size:12px;font-weight:600;
    z-index:15;}
  #placingChip button{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;
    width:22px;height:22px;line-height:1;}

  /* CANVAS */
  #canvasWrap{flex:1;position:relative;overflow:hidden;background:var(--bg);}
  #canvas{position:absolute;top:0;left:0;touch-action:none;}

  /* STATUS BAR */
  #statusbar{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;
    pointer-events:none;}
  .chip{background:rgba(18,24,33,.92);border:1px solid var(--border);border-radius:20px;
    padding:5px 10px;font-size:11px;color:var(--text-dim);}
  .chip b{color:var(--text);}

  /* PROPERTIES PANEL */
  #propPanel{position:absolute;right:8px;top:8px;width:190px;background:rgba(18,24,33,.97);
    border:1px solid var(--border);border-radius:12px;padding:10px;display:none;}
  #propPanel h4{margin:0 0 8px;font-size:12px;color:var(--accent);}
  #propPanel label{font-size:10.5px;color:var(--text-dim);display:block;margin-top:6px;}
  #propPanel input[type=number],#propPanel select{width:100%;background:var(--panel2);
    border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px;font-size:12px;}
  #propPanel input[type=range]{width:100%;}
  #propPanel .row{display:flex;gap:6px;margin-top:8px;}
  #propPanel .row .tbtn{flex:1;justify-content:center;font-size:11px;padding:6px;}

  /* BOTTOM sheet for mobile: rotate/delete quick actions */
  #quickActions{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;display:none;
    gap:8px;}
  #quickActions .tbtn{padding:10px 14px;border-radius:24px;}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:#2a3542;border-radius:3px;}

  #hint{position:absolute;top:8px;left:8px;background:rgba(18,24,33,.9);border:1px solid var(--border);
    border-radius:10px;padding:6px 10px;font-size:11px;color:var(--text-dim);max-width:60%;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><img src="logo.png" alt="Tecnoyork Electrónica" class="logo-img"></div>
    <button class="tbtn" id="btnAddComp">➕ Componentes</button>
    <button class="tbtn" id="btnWire">🔌 Cable</button>
    <button class="tbtn" id="btnEnv">🌡️ Entorno</button>
    <button class="tbtn" id="btnScope">📊 Osciloscopio</button>
    <button class="tbtn" id="btnPower">▶ Encender</button>
    <button class="tbtn" id="btnSave" title="Guardar circuito">💾</button>
    <button class="tbtn" id="btnLoad" title="Cargar / Recientes">📂</button>
    <button class="tbtn" id="btnCenter" title="Centrar vista">⌖</button>
    <button class="tbtn danger" id="btnClear">🗑</button>
  </div>
  <div id="main">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="hint">Toca "➕ Componentes" para elegir una pieza, luego toca el lienzo para colocarla. Arrastra el fondo vacío para mover el lienzo.</div>
      <div id="placingChip"></div>
      <div id="statusbar"></div>
      <div id="propPanel"></div>
      <div id="quickActions">
        <button class="tbtn" id="btnRotate">⟳ Girar</button>
        <button class="tbtn danger" id="btnDelete">🗑 Borrar</button>
      </div>
    </div>
  </div>
</div>

<div id="pickerBackdrop" class="pickerBackdrop"></div>
<div id="pickerModal" class="pickerModal">
  <div class="pickerHandle"></div>
  <div class="pickerHeader">
    <h3>Componentes</h3>
    <button class="pickerClose" id="pickerClose">✕</button>
  </div>
  <div class="picker-search-row">
    <input id="pickerSearch" class="pickerSearch" type="text" placeholder="🔍 Buscar componente (ej. led, resistencia...)">
  </div>
  <div id="pickerBody" class="pickerBody"></div>
</div>

<div id="overlayBackdrop" class="pickerBackdrop"></div>
<div id="overlayModal" class="pickerModal">
  <div class="pickerHandle"></div>
  <div class="pickerHeader">
    <h3 id="overlayTitle">Archivo</h3>
    <button class="pickerClose" id="overlayClose">✕</button>
  </div>
  <div id="overlayBody" class="pickerBody"></div>
</div>

<script>
// ============================================================
// components.js — Catálogo de componentes electrónicos
// ============================================================
const GRID = 20;
const COL_WIRE_OFF = '#3a4756';
const COL_WIRE_ON  = '#ffb02e';
const COL_BODY     = '#c7d2de';
const COL_BODY2    = '#8a97a8';

function T(x,y,name){ return {x,y,name}; }

function drawTerminalDot(ctx,x,y,active){
  ctx.beginPath();
  ctx.arc(x,y,3.3,0,Math.PI*2);
  ctx.fillStyle = active? COL_WIRE_ON : '#556274';
  ctx.fill();
}
function leadLines(ctx, pts){
  ctx.strokeStyle = COL_BODY; ctx.lineWidth = 2.4; ctx.lineCap='round';
  ctx.beginPath();
  pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
  ctx.stroke();
}

const COMPONENTS = {

resistor: { label:'Resistencia', cat:'Pasivos', icon:'▭',
  terminals:[T(-40,0),T(40,0)], props:{R:220},
  edges(c){ return [{n:[0,1], type:'R', value:Math.max(0.01,c.props.R)}]; },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-22,0]]); leadLines(ctx,[[22,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.4;
    ctx.strokeRect(-22,-9,44,18);
    const bands = resistorColorBands(c.props.R);
    bands.forEach((col,i)=>{ ctx.fillStyle=col; ctx.fillRect(-16+i*9,-9,5,18); });
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(fmtOhm(c.props.R), 0, 24);
  }
},

battery: { label:'Pila / Batería (DC)', cat:'Fuentes', icon:'🔋',
  terminals:[T(-40,0,'-'),T(40,0,'+')], props:{V:9},
  edges(c){ return [{n:[0,1], type:'V', value:c.props.V, Rint:0.2}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-14,0]]); leadLines(ctx,[[14,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-14,-16); ctx.lineTo(-14,16); ctx.stroke();
    ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(14,-9); ctx.lineTo(14,9); ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('−', -22, 4); ctx.fillText('+', 22, 4);
    ctx.font='9px sans-serif'; ctx.fillText(c.props.V+' V', 0, 26);
  }
},

acsource: { label:'Fuente AC', cat:'Fuentes', icon:'∿', props:{Vp:9, f:1},
  terminals:[T(-40,0),T(40,0)],
  edges(c,sim){ const v=c.props.Vp*Math.sin(2*Math.PI*c.props.f*sim.simTime); return [{n:[0,1],type:'V',value:v, Rint:0.2}]; },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-18,0]]); leadLines(ctx,[[18,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for(let x=-11;x<=11;x++){ const y=-Math.sin(x/11*Math.PI*2)*7; x===-11?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.Vp+'Vp '+c.props.f+'Hz', 0, 32);
  }
},

ground: { label:'Tierra (GND)', cat:'Fuentes', icon:'⏚',
  terminals:[T(0,-20)], props:{}, isGround:true,
  edges(c){ return []; },
  draw(ctx){
    leadLines(ctx,[[0,-20],[0,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.2;
    [12,8,4].forEach((w,i)=>{ ctx.beginPath(); ctx.moveTo(-w,4+i*5); ctx.lineTo(w,4+i*5); ctx.stroke(); });
  }
},

switch_sw: { label:'Interruptor', cat:'Control', icon:'⏻', props:{closed:false},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:c.props.closed?'R':'OPEN', value:0.02}]; },
  interactive:true,
  onTap(c){ c.props.closed = !c.props.closed; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-24,0]]); leadLines(ctx,[[24,0],[40,0]]);
    drawTerminalDot(ctx,-24,0,true); drawTerminalDot(ctx,24,0,true);
    ctx.strokeStyle= c.props.closed? COL_WIRE_ON: COL_BODY; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(-24,0);
    if(c.props.closed) ctx.lineTo(24,0); else ctx.lineTo(18,-16);
    ctx.stroke();
    ctx.fillStyle='#aab6c4'; ctx.font='8.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.closed?'CERRADO':'ABIERTO',0,24);
  }
},

pushbutton: { label:'Pulsador', cat:'Control', icon:'⏺', props:{pressed:false},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:c.props.pressed?'R':'OPEN', value:0.02}]; },
  interactive:true, momentary:true,
  onTap(c){ c.props.pressed = !c.props.pressed; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-14,0]]); leadLines(ctx,[[14,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(-14,10); ctx.lineTo(-14,-10); ctx.moveTo(14,10); ctx.lineTo(14,-10); ctx.stroke();
    ctx.fillStyle= c.props.pressed? COL_WIRE_ON:'#586576';
    ctx.fillRect(-16,-16,32,7);
    ctx.fillStyle='#aab6c4'; ctx.font='8.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.pressed?'PULSADO':'toca',0,24);
  }
},

led: { label:'LED', cat:'Salida', icon:'💡', props:{Vf:2.0, color:'#ff3b3b'},
  terminals:[T(-40,0,'anodo'),T(40,0,'catodo')],
  edges(c){ return [{n:[0,1], type:'DIODE', value:c.props.Vf, Ron:12}]; },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-16,0]]); leadLines(ctx,[[16,0],[40,0]]);
    const I = Math.abs(c.state?.I||0);
    const glow = Math.min(1, I/0.02);
    if(glow>0.02){
      const g = ctx.createRadialGradient(0,0,2,0,0,26);
      g.addColorStop(0, hexA(c.props.color,glow)); g.addColorStop(1, hexA(c.props.color,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = glow>0.02? c.props.color : '#3a1414';
    ctx.beginPath(); ctx.moveTo(-14,-13); ctx.lineTo(14,0); ctx.lineTo(-14,13); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(14,-13); ctx.lineTo(14,13); ctx.stroke();
  }
},

diode: { label:'Diodo', cat:'Semiconductores', icon:'▷|', props:{Vf:0.7, modelo:'Genérico'},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'DIODE', value:c.props.Vf, Ron:2}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-13,0]]); leadLines(ctx,[[13,0],[40,0]]);
    ctx.fillStyle= Math.abs(c.state?.I||0)>0.001? '#ffb02e':COL_BODY2;
    ctx.beginPath(); ctx.moveTo(-13,-11); ctx.lineTo(13,0); ctx.lineTo(-13,11); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(13,-11); ctx.lineTo(13,11); ctx.stroke();
  }
},

zener: { label:'Diodo Zener', cat:'Semiconductores', icon:'▷Z', props:{Vf:0.7, Vz:5.1, modelo:'Genérico'},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'ZENER', value:c.props.Vf, Vz:c.props.Vz, Ron:2}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-13,0]]); leadLines(ctx,[[13,0],[40,0]]);
    ctx.fillStyle= Math.abs(c.state?.I||0)>0.001? '#39d3a8':COL_BODY2;
    ctx.beginPath(); ctx.moveTo(-13,-11); ctx.lineTo(13,0); ctx.lineTo(-13,11); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(13,-11); ctx.lineTo(13,0); ctx.lineTo(18,-5); ctx.moveTo(13,0); ctx.lineTo(13,11); ctx.lineTo(8,16); ctx.stroke();
  }
},

bulb: { label:'Bombilla', cat:'Salida', icon:'⭘', props:{R:48},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'R', value:c.props.R}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-16,0]]); leadLines(ctx,[[16,0],[40,0]]);
    const P = Math.abs((c.state?.I||0)*(c.state?.V||0));
    const glow = Math.min(1,P/0.6);
    if(glow>0.03){
      const g=ctx.createRadialGradient(0,0,2,0,0,28);
      g.addColorStop(0,`rgba(255,214,110,${glow})`); g.addColorStop(1,'rgba(255,214,110,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle= glow>0.03? '#ffd66e' : COL_BODY; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,-6); ctx.quadraticCurveTo(0,8,8,-6); ctx.stroke();
  }
},

buzzer: { label:'Zumbador', cat:'Salida', icon:'🔔', props:{R:40},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'R', value:c.props.R}]; },
  draw(ctx,c,sim){
    leadLines(ctx,[[-40,0],[-18,0]]); leadLines(ctx,[[18,0],[40,0]]);
    const on = Math.abs(c.state?.I||0)>0.01;
    const wob = on? Math.sin(sim.simTime*40)*2 : 0;
    ctx.strokeStyle= on? COL_WIRE_ON: COL_BODY; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(wob*0.3,0,17,0,Math.PI*2); ctx.stroke();
    if(on){ ctx.beginPath(); ctx.arc(0,0,22+wob,0,Math.PI*2); ctx.strokeStyle='rgba(255,176,46,.4)'; ctx.stroke(); }
  }
},

fuse: { label:'Fusible', cat:'Control', icon:'⎓', props:{Imax:1.0, blown:false},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type: c.props.blown?'OPEN':'R', value:0.15}]; },

capacitor: { label:'Condensador', cat:'Pasivos', icon:'⊣⊢', props:{C:100, chargeR: 1e6},
  terminals:[T(-40,0),T(40,0)],
  edges(c){
    const q = c.state?.charge ?? 0;
    const Reff = 0.5 + (1e7 * q);
    return [{n:[0,1], type:'R', value:Reff}];
  },
  step(c, dt, sim){
    const on = sim.powered;
    const targetTau = Math.max(0.08, Math.min(4.5, c.props.C/140));
    let q = c.state.charge ?? 0;
    if(on) q += dt/targetTau*(1-q); else q -= dt/targetTau*q;
    c.state.charge = Math.max(0,Math.min(0.999,q));
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-8,0]]); leadLines([[8,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-8,-15); ctx.lineTo(-8,15); ctx.moveTo(8,-15); ctx.lineTo(8,15); ctx.stroke();
    const q=c.state?.charge||0;
    ctx.fillStyle='rgba(57,211,168,.55)'; ctx.fillRect(-8,-15,16*q,30);
    ctx.fillStyle='#aab6c4'; ctx.font='8px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.props.C+' µF', 0, 26);
  }
},

  step(c, dt, sim){
    const on = sim.powered;
    const tau = Math.max(0.05, Math.min(3, c.props.L/35));
    let s = c.state.ramp ?? 0;
    if(on) s += dt/tau*(1-s); else s -= dt/tau*s;
    c.state.ramp = Math.max(0, Math.min(0.999, s));

  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'R', value: c.props.tripped? 3500 : 0.2}]; },
  postSolve(c){
    const I = Math.abs(c.state?.I||0);
    if(!c.props.tripped && I > c.props.Imax) c.props.tripped = true;

  step(c, dt){
    if(c.props.tripped){
      const I = Math.abs(c.state?.I||0);

        if(c.props.coolTimer > 1.2){ c.props.tripped=false; c.props.coolTimer=0; }
      } else c.props.coolTimer = 0;
    }
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-18,0]]); leadLines([[18,0],[40,0]]);

    if(c.props.failed) return;
    const on = sim.powered;
    const targetTau = Math.max(0.08, Math.min(4.5, c.props.C/140));
    let q = c.state.charge ?? 0;
    if(on) q += dt/targetTau*(1-q); else q -= dt/targetTau*q;
    c.state.charge = Math.max(0,Math.min(0.999,q));
  },
  postSolve(c){
    if(c.props.failed) return;
    const V = c.state?.V||0;
    if(V < -0.5 || V > c.props.Vmax) c.props.failed = true;
  },

    if(c.props.failed){ ctx.fillStyle='#ff5c5c'; ctx.font='8px sans-serif'; ctx.fillText('¡DAÑADO!',0,28); }
    else {
      const q=c.state?.charge||0;
      ctx.fillStyle='rgba(57,211,168,.55)'; ctx.fillRect(-8,-15,16*q,30);
 ctx.fillStyle='#aab6c4'; ctx.font='8px sans-serif'; ctx.fillText(c.props.C+' µF',0,28);
    }
  }
},

timer555: { label:'Timer 555', cat:'Módulos', icon:'555', props:{mode:'astable', Vcc:5, R1:1000, R2:1000, C:1},
  terminals:[T(-30,-20,'VCC'), T(-30,0,'TRIG'), T(-30,20,'RESET'), T(30,-20,'THRES'), T(30,0,'OUT'), T(30,20,'GND')],
  step(c, dt, sim){
    const Vcc_actual = c.state.Vt0 || 0;
    if(Vcc_actual < 3.0) { c.state.outHigh = false; return; }
    const Vcc = c.props.Vcc;
    c.state.Vtrig = c.state.Vt1||0;
    c.state.Vreset = c.state.Vt2||0;
    if(c.props.mode==='monostable'){
      const nowTrig = c.state.Vtrig < Vcc*0.35;
      if(nowTrig && !c.state._lastTrig && !c.state._monoOn){ c.state._monoOn=true; c.state._monoT = 1.1*c.props.R1*c.props.C*1e-6; }
      c.state._lastTrig = nowTrig;
      if(c.state._monoOn){ c.state._monoT -= dt; if(c.state._monoT<=0) c.state._monoOn=false; }
      c.state.outHigh = c.state._monoOn && (c.state.Vreset > 0.5);
    } else {
      const f = 1.44 / ((c.props.R1 + 2*c.props.R2) * c.props.C * 1e-6 + 1e-9);
 const duty = (c.props.R1 + c.props.R2) / (c.props.R1 + 2*c.props.R2);
      const period = 1/Math.max(f,0.001);
      const t = sim.simTime % period;
      c.state.outHigh = (t < duty*period) && (c.state.Vreset > 0.5);
      c.state.freq = f;
    }
  },
  edges(c,sim){
    const Vcc_actual = c.state.Vt0 || 0;
    if(Vcc_actual < 3.0) return [{n:[4,'GND'], type:'OPEN', value:1e9}];
    const V = c.state.outHigh? c.props.Vcc : 0;
    return [{n:[4,'GND'], type:'V', value:V, Rint:5}];
  },
  draw(ctx,c){
    leadLines(ctx,[[-30,-20],[-14,-20]]); leadLines([[-30,0],[-14,0]]); leadLines([[-30,20],[-14,20]]);
    leadLines([[30,-20],[14,-20]]); leadLines([[30,0],[14,0]]); leadLines([[30,20],[14,20]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-14,-24,28,48);
    ctx.fillStyle='#aab6c4'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('555',0,3);
    ctx.font='7.5px sans-serif';
    ctx.fillText(c.props.mode==='astable'?'ASTABLE':'MONOSTABLE',0,28);
    if(c.props.mode==='astable') ctx.fillText((c.state?.freq||0).toFixed(1)+' Hz',0,38);
    if(c.state?.outHigh){
      ctx.fillStyle='rgba(255,176,46,.4)'; ctx.fillRect(-14,-24,28,48);
    }
  }
},

function resistorColorBands(R){

// engine.js — Motor eléctrico MNA
// ============================================================
const WIRE_R = 0.0008;

function solveGauss(A, b){
  const n = b.length;
  for(let i=0;i<n;i++){
    let piv=i, best=Math.abs(A[i][i]);
    for(let r=i+1;r<n;r++){ if(Math.abs(A[r][i])>best){ best=Math.abs(A[r][i]); piv=r; } }
    if(best < 1e-12) continue;
    if(piv!==i){ [A[i],A[piv]]=[A[piv],A[i]]; [b[i],b[piv]]=[b[piv],b[i]]; }
    for(let r=i+1;r<n;r++){
      const f = A[r][i]/A[i][i];
      if(f===0) continue;
      for(let c=i;c<n;c++) A[r][c]-=f*A[i][c];
      b[r]-=f*b[i];
    }
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let s=b[i];
    for(let c=i+1;c<n;c++) s-=A[i][c]*x[c];
    x[i]= Math.abs(A[i][i])<1e-12? 0 : s/A[i][i];
  }
  return x;
}

class CircuitSim{
  constructor(){ this.simTime=0; this.dt=1/30; this.powered=false; }

  buildTopology(comps, wires){
    const termId = (compId,ti)=> compId+'#'+ti;
    const ids = new Map(); let n=0;
    comps.forEach(c=> c.terminals.forEach((t,ti)=>{ ids.set(termId(c.id,ti), n++); }));
 let refKey = null;
    const gnd = comps.find(c=>DEF(c).isGround);
    if(gnd) refKey = termId(gnd.id,0);
    else { const bat = comps.find(c=>c.type==='battery'); if(bat) refKey = termId(bat.id,0); }
    const refNode = refKey!==null ? ids.get(refKey) : (n>0?0:null);
    return {ids, termId, refNode, totalTerminals:n};
  }

  collectEdges(comps, wires, topo){
    const edges=[];
    wires.forEach(w=>{
      const n1 = topo.ids.get(topo.termId(w.a.compId,w.a.term));
      const n2 = topo.ids.get(topo.termId(w.b.compId,w.b.term));
      if(n1!==undefined && n2!==undefined) edges.push({n1,n2,type:'R',value:WIRE_R,owner:null});
    });
    comps.forEach(c=>{
      const def = DEF(c);
      if(!def.edges) return;
      const local = def.edges(c, this) || [];
 local.forEach(e=>{
        const gA = e.n[0]==='GND'? topo.refNode : topo.ids.get(topo.termId(c.id,e.n[0]));
        const gB = e.n[1]==='GND'? topo.refNode : topo.ids.get(topo.termId(c.id,e.n[1]));
        if(gA===undefined||gB===undefined||gA===null||gB===null) return;
        edges.push({n1:gA, n2:gB, type:e.type, value:e.value, Vz:e.Vz, Ron:e.Ron, Rint:e.Rint, owner:c, tag:e.tag||'main', local:e.n});
      });
    });
    return edges;
  }

  solveOnce(edges, topo){
    const Nn = Math.max(0, topo.totalTerminals - (topo.refNode!==null?1:0));
    const map = new Array(topo.totalTerminals).fill(-1);
    let k=0;
    for(let i=0;i<topo.totalTerminals;i++){ if(i===topo.refNode) continue; map[i]=k++; }
    const vSrc = edges.filter(e=> e.type==='V' || e.type==='GATEOUT' || e.__forceV);
    const Nv = vSrc.length;
    const size = Nn+Nv;
    if(size===0) return {V:[], I:[], map};
    const A = Array.from({length:size},()=>new Array(size).fill(0));
    const b = new Array(size).fill(0);

    function stampR(n1,n2,R){
      if(R<=0) R=1e-6;
      const g=1/R;
      const a=map[n1], c=map[n2];
      if(a>=0) A[a][a]+=g;
      if(c>=0) A[c][c]+=g;
      if(a>=0 && c>=0){ A[a][c]-=g; A[c][a]-=g; }
    }
    edges.forEach(e=>{
      if(e.type==='R') stampR(e.n1,e.n2,e.value);
      else if(e.type==='I'){
        const a=map[e.n1], c=map[e.n2];
        if(a>=0) b[a]-=e.value;
        if(c>=0) b[c]+=e.value;
      }
      else if(e.type==='OPEN'){ /* nada */ }
    });
    vSrc.forEach((e,j)=>{
      const idx = Nn+j;
      const p = map[e.n2], m = map[e.n1];
 if(p>=0){ A[p][idx]+=1; A[idx][p]+=1; }
      if(m>=0){ A[m][idx]-=1; A[idx][m]-=1; }
 b[idx]+= e.value;
      const Rint = e.Rint !== undefined ? e.Rint : 0.5;
      A[idx][idx] -= Rint;
    });
    const x = solveGauss(A,b);
    const V = new Array(topo.totalTerminals).fill(0);
    for(let i=0;i<topo.totalTerminals;i++) V[i] = i===topo.refNode? 0 : (map[i]>=0? x[map[i]] : 0);
    const Icur = vSrc.map((e,j)=> x[Nn+j]);
    return {V, Isrc:Icur, vSrc};
  }

  step(comps, wires, dt){
    this.dt = dt;
    if(this.powered) this.simTime += dt;
    comps.forEach(c=>{ const def=DEF(c); c.state=c.state||{}; if(def.step) def.step(c,dt,this); });

    if(!this.powered){
      comps.forEach(c=>{ c.state=c.state||{}; c.state.I=0; c.state.V=0; c.state.diodeState='off'; });
      return;
    }
    const topo = this.buildTopology(comps, wires);
    if(topo.totalTerminals===0) return;

    let lastV=null, lastEdges=null, lastRes=null;
    for(let iter=0; iter<6; iter++){
      const edges = this.collectEdgesNonlinear(comps, wires, topo);
      const res = this.solveOnce(edges, topo);
      lastV = res.V; lastEdges = edges; lastRes = res;
      comps.forEach(c=>{
        const def=DEF(c);
 c.state=c.state||{};
 c.terminals.forEach((t,ti)=>{
 const gid = topo.ids.get(topo.termId(c.id,ti));
          if(gid!==undefined) c.state['Vt'+ti]=res.V[gid];
 });
        if(c.type==='transistor_npn') c.state.Vbe = (c.state.Vt0||0)-(c.state.Vt2||0);
        if(c.type==='transistor_pnp') c.state.Veb = (c.state.Vt0||0)-(c.state.Vt1||0);
 if(c.type==='gate_and'||c.type==='gate_or'||c.type==='gate_nand'||c.type==='gate_nor'||c.type==='gate_xor'||c.type==='gate_not'||
           c.type==='gate_xnor'||c.type==='gate_buffer'||c.type==='sr_latch'){
 c.state.Vin0 = c.state.Vt0; c.state.Vin1 = c.state.Vt1;
        }
      });
      edges.forEach(e=>{
        if(e.type!=='R' && e.type!=='OPEN') return;
        if(!e.owner || (e.__kind!=='DIODE' && e.__kind!=='ZENER')) return;
        const c=e.owner;
        const I=(lastV[e.n1]-lastV[e.n2])/Math.max(e.value,1e-9);
        const Va=c.state['Vt'+e.local[0]]||0, Vb=c.state['Vt'+e.local[1]]||0;
        if(c.state.diodeState===undefined) c.state.diodeState='off';
        const thr = e.thr!==undefined? e.thr : e.value;
        if(e.__kind==='DIODE'){
 if(c.state.diodeState==='on'){ if(I < -0.0003) c.state.diodeState='off'; }
          else if((Va-Vb) > thr) c.state.diodeState='on';
        } else {
          if(c.state.diodeState==='fwd'){ if(I < -0.0003) c.state.diodeState='off'; }
          else if(c.state.diodeState==='rev'){ if(I > 0.0003) c.state.diodeState='off'; }
          else { if((Va-Vb) > thr) c.state.diodeState='fwd'; else if((Vb-Va) > e.Vz) c.state.diodeState='rev'; }
        }
      });
    }
    comps.forEach(c=>{ c.state=c.state||{}; c.state.I=0; c.state.V=0; c.state.Icoil=0; });
    this.totalCurrent = 0;
    lastEdges.forEach(e=>{
      if(!e.owner) return;
      const c=e.owner;
      const Vn1=lastV[e.n1], Vn2=lastV[e.n2];
      let I=0, haveI=false;
      if(e.type==='R'){ I=(Vn1-Vn2)/Math.max(e.value,1e-9); haveI=true; }
      else if(e.type==='I'){ I = e.value; haveI=true; }
      else if(e.type==='V'||e.type==='GATEOUT'){
 const j = lastRes.vSrc.indexOf(e);
        if(j>=0){ I = lastRes.Isrc[j]; haveI=true; }
      }
 if(!haveI) return;
      if(e.tag==='coil') c.state.Icoil = Math.abs(I);
      else if(e.tag==='gatesense') c.state.Igate = Math.abs(I);
      else if(e.tag==='led') c.state.Iled = Math.abs(I);
      else if(e.tag==='main' || e.tag==='meter' || e.tag===undefined){ c.state.I = I; c.state.V = Vn1-Vn2; }
      else { c.state['I_'+e.tag] = I; c.state['V_'+e.tag] = Vn1-Vn2; }
 if(c.type==='battery' || c.type==='acsource') this.totalCurrent = Math.max(this.totalCurrent, Math.abs(I));
    });
    comps.forEach(c=>{ const def=DEF(c); if(def.postSolve) def.postSolve(c); });
  }

  collectEdgesNonlinear(comps, wires, topo){
    const raw = this.collectEdges(comps, wires, topo);
    return raw.map(e=>{
      if(e.type==='DIODE'){
        const st = e.owner.state?.diodeState || 'off';
        const on = st==='on';
        return {...e, type: on? 'R':'OPEN', value: on? (e.Ron||10) : 1e9, thr:e.value, __kind:'DIODE'};
      }
      if(e.type==='ZENER'){
        const st = e.owner.state?.diodeState || 'off';
        const on = st==='fwd' || st==='rev';
        return {...e, type: on? 'R':'OPEN', value: on? (e.Ron||10) : 1e9, thr:e.value, __kind:'ZENER'};
      }
      return e;
    });
  }
}

function buildPalette(filter){

  let any=false;
  CATEGORIES.forEach(cat=>{
    const items = Object.keys(COMPONENTS).filter(k=>{

      if(!q) return true;
      return def.label.toLowerCase().includes(q) || k.toLowerCase().includes(q);
    });
    if(!items.length) return;
    any=true;
    const h=document.createElement('div'); h.className='cat-title'; h.textContent=cat; pickerBody.appendChild(h);
    const grid=document.createElement('div'); grid.className='cat-grid';
    items.forEach(key=>{

      const btn=document.createElement('div'); btn.className='comp-btn'; btn.dataset.type=key;

 selectedType = key; selectedComp=null; wireMode=false;

  return c;

function rotPt(x,y,deg){ const r=deg*Math.PI/180; return {x:x*Math.cos(r)-y*Math.sin(r), y:x*Math.sin(r)+y*Math.cos(r)}; }
function termAbs(c, idx){
  const t = c.terminals[idx]; const p = rotPt(t.x,t.y,c.rot);
  return {x:c.x+p.x, y:c.y+p.y};
}
function snap(v){ return Math.round(v/GRID)*GRID; }

function hitComponent(x,y){
  for(let i=comps.length-1;i>=0;i--){
    const c=comps[i]; const dx=x-c.x, dy=y-c.y;
    const rr = rotPt(dx,dy,-c.rot);
    if(Math.abs(rr.x)<44 && Math.abs(rr.y)<38) return c;
  }
  return null;
}
function hitTerminal(x,y){
  for(let i=comps.length-1;i>=0;i--){
    const c=comps[i];
    for(let ti=0; ti<c.terminals.length; ti++){
      const p = termAbs(c,ti);
      if(Math.hypot(p.x-x,p.y-y) < 14) return {compId:c.id, term:ti, x:p.x, y:p.y};
    }
  }
  return null;
}

function getPos(ev){
  const r=canvas.getBoundingClientRect();
  const t = ev.touches? ev.touches[0] : ev;
 return {x:t.clientX-r.left, y:t.clientY-r.top};
}
let downInfo=null;
function onDown(ev){
  ev.preventDefault();
  const sp=getPos(ev);
  const p=toWorld(sp);
  downInfo={p, sp, t:performance.now(), moved:false, hitTermOnDown:false};

  if(wireMode){
    const term = hitTerminal(p.x,p.y);
    if(term){
      downInfo.hitTermOnDown = true;
      if(!wireStart) wireStart = term;
      else{
        if(!(wireStart.compId===term.compId && wireStart.term===term.term)){
          wires.push({a:{compId:wireStart.compId, term:wireStart.term}, b:{compId:term.compId, term:term.term}});
        }
        wireStart = null;
      }
    } else {
      panning = {startSp:sp, startPan:{x:panX,y:panY}};
    }
    return;
  }

  if(selectedType){
    const c = newComponent(selectedType, snap(p.x), snap(p.y));
    comps.push(c);
    selectedComp = c; selectComponent(c);
    updateModeUI();
    return;
  }

  const hitC = hitComponent(p.x,p.y);
  if(hitC){ dragging = hitC; dragOffset={x:p.x-hitC.x, y:p.y-hitC.y}; selectComponent(hitC); }
  else {
    selectComponent(null);
    panning = {startSp:sp, startPan:{x:panX,y:panY}};
  }
}
function onMove(ev){
  if(!downInfo) return;
  const sp=getPos(ev);
  const p=toWorld(sp);
  if(Math.hypot(sp.x-downInfo.sp.x,sp.y-downInfo.sp.y)>4) downInfo.moved=true;
 if(dragging){ ev.preventDefault(); dragging.x = snap(p.x-dragOffset.x); dragging.y = snap(p.y-dragOffset.y); return; }
 if(panning){
    ev.preventDefault();
    panX = panning.startPan.x + (sp.x-panning.startSp.x);
    panY = panning.startPan.y + (sp.y-panning.startSp.y);
    clampPan();
    return;
  }
}
function onUp(ev){
  const p = downInfo? downInfo.p : null;
 const wasDragging = !!dragging, wasPanning = !!panning;
 dragging = null; panning = null;
  if(!downInfo){ return; }

  if(wireMode){
    if(!downInfo.hitTermOnDown && !downInfo.moved) wireStart = null;
    downInfo=null;
    return;
  }
  if(wasDragging || wasPanning){ downInfo=null; return; }

  if(!downInfo.moved && !selectedType){
    const hitC = hitComponent(p.x,p.y);
    if(hitC){
      const def = COMPONENTS[hitC.type];
      if(def.interactive && def.onTap){ def.onTap(hitC); }
    }
  }
  downInfo=null;
}
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp);

const storage = {
  _mem:{},
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ this._mem[k]=v; } },
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return this._mem[k]??null; } },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){ delete this._mem[k]; } },
 keys(){
    try{
      const out=[];
      for(let i=0;i<localStorage.length;i++) out.push(localStorage.key(i));
      return out;
    }catch(e){ return Object.keys(this._mem); }
  }
};
function getSaves(){
  const list=[];
  storage.keys().forEach(k=>{
    if(k.startsWith('circuitlab_circuit_')){
      try{ const data=JSON.parse(storage.get(k)); list.push({name:data.name||k.replace('circuitlab_circuit_',''), key:k, time:data.time||0}); }catch(_){}
    }
  });
  return list.sort((a,b)=>b.time-a.time);
}
function saveCircuit(name){
  if(!name) return;
  const payload = {
    version:1, name, time:Date.now(),
    comps: comps.map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,props:c.props,state:{}})),
    wires
  };
  storage.set('circuitlab_circuit_'+name, JSON.stringify(payload));
}
function loadCircuit(keyOrName){
 const key = keyOrName.startsWith('circuitlab_circuit_')? keyOrName : 'circuitlab_circuit_'+keyOrName;
  const raw = storage.get(key);
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    comps = (data.comps||[]).map(c=>{
      const def = COMPONENTS[c.type];
      if(!def) return null;
      return { ...c, terminals: JSON.parse(JSON.stringify(def.terminals)), state:{} };
    }).filter(Boolean);
    wires = (data.wires||[]).map(w=>({a:{...w.a},b:{...w.b}}));
    nextId = comps.length? Math.max(...comps.map(c=>parseInt(c.id.replace('c','')||0)))+1 : 1;
    return true;
  }catch(e){ return false; }
}
function deleteCircuit(keyOrName){
  const key = keyOrName.startsWith('circuitlab_circuit_')? keyOrName : 'circuitlab_circuit_'+keyOrName;
 storage.remove(key);
}

// ============================================================
// OSCILLOSCOPE TOOL
// ============================================================
let scopeActive = false;
let scopeData = [];

document.getElementById('btnScope').addEventListener('click', () => {
  scopeActive = true; scopeData = [];
  const options = comps.map(c => `<option value="${c.id}">${COMPONENTS[c.type].label} (${c.id})</option>`).join('');
  openOverlay('Osciloscopio', `
    <div style="padding:10px;">
      <div class="scope-row">
        <div class="scope-col">
          <label>Canal 1 (Verde)</label>
          <select id="scopeCh1Comp"><option value="">- Ninguno -</option>${options}</select>
          <select id="scopeCh1Type"><option value="V">Voltaje (V)</option><option value="I">Corriente (A)</option></select>
        </div>
        <div class="scope-col">
          <label>Canal 2 (Naranja)</label>
          <select id="scopeCh2Comp"><option value="">- Ninguno -</option>${options}</select>
          <select id="scopeCh2Type"><option value="V">Voltaje (V)</option><option value="I">Corriente (A)</option></select>
        </div>
      </div>
      <canvas id="scopeCanvas" width="300" height="200" style="width:100%; background:#04140c; border-radius:8px; border:1px solid var(--border);"></canvas>
      <div style="margin-top:10px;">
        <label style="font-size:11px; color:var(--text-dim);">Ventana de tiempo: <b id="scopeWinVal">2.0s</b></label>
        <input type="range" id="scopeWinSlider" min="0.2" max="5" step="0.1" value="2" style="width:100%;">
      </div>
    </div>
  `, false); // false = no backdrop, permite interactuar con el lienzo
});

function drawScope() {
  const sc = document.getElementById('scopeCanvas');
  if(!sc) return;
  const sctx = sc.getContext('2d');
  const rect = sc.getBoundingClientRect();
  if (sc.width !== rect.width * window.devicePixelRatio) {
    sc.width = rect.width * window.devicePixelRatio;
    sc.height = 200 * window.devicePixelRatio;
    sctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  const W = rect.width, H = 200;
  
  sctx.fillStyle = '#04140c'; sctx.fillRect(0,0,W,H);
  sctx.strokeStyle = 'rgba(57,211,168,.1)'; sctx.lineWidth = 1;
  for(let i=0; i<10; i++) {
    sctx.beginPath(); sctx.moveTo(i*W/10, 0); sctx.lineTo(i*W/10, H); sctx.stroke();
    sctx.beginPath(); sctx.moveTo(0, i*H/10); sctx.lineTo(W, i*H/10); sctx.stroke();
  }
  sctx.strokeStyle = 'rgba(57,211,168,.3)';
  sctx.beginPath(); sctx.moveTo(0, H/2); sctx.lineTo(W, H/2); sctx.stroke();
  
  const win = parseFloat(document.getElementById('scopeWinSlider')?.value || 2);
  const tNow = sim.simTime;
  const tStart = tNow - win;
  
  let maxV = 0.1;
  scopeData.forEach(d => {
     if(d.v1 !== null) maxV = Math.max(maxV, Math.abs(d.v1));
     if(d.v2 !== null) maxV = Math.max(maxV, Math.abs(d.v2));
  });
  maxV *= 1.15;
  
  function drawTrace(valKey, color) {
     sctx.strokeStyle = color; sctx.lineWidth = 1.5;
     sctx.beginPath();
     let started = false;
     scopeData.forEach(d => {
        if (d[valKey] === null) return;
        const x = ((d.t - tStart) / win) * W;
        const y = H/2 - (d[valKey] / maxV) * (H/2 - 10);
        if (!started) { sctx.moveTo(x, y); started = true; }
        else sctx.lineTo(x, y);
     });
     sctx.stroke();
  }
  
  drawTrace('v1', '#39d3a8');
  drawTrace('v2', '#ffb02e');
  
  sctx.fillStyle = '#39d3a8'; sctx.font = '10px sans-serif'; sctx.textAlign='left';
  sctx.fillText('CH1: ' + (document.getElementById('scopeCh1Comp')?.value || '--'), 5, 12);
  sctx.fillStyle = '#ffb02e';
  sctx.fillText('CH2: ' + (document.getElementById('scopeCh2Comp')?.value || '--'), 5, 24);
  sctx.fillStyle = '#8a97a8';
  sctx.textAlign='right';
  sctx.fillText('±' + maxV.toFixed(2) + 'V/A', W-5, 12);
  sctx.fillText(win.toFixed(1) + 's', W-5, H-5);
}

// ============================================================
// RENDER
// ============================================================
function drawGrid(){
  const r = wrap.getBoundingClientRect();
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle = '#1c2530';
  let startX = panX % GRID; if(startX<0) startX+=GRID;
  let startY = panY % GRID; if(startY<0) startY+=GRID;
  for(let x=startX;x<r.width;x+=GRID) for(let y=startY;y<r.height;y+=GRID) ctx.fillRect(x,y,1,1);
}

function pathForWire(a,b){
  const midX = (a.x+b.x)/2;
  return [[a.x,a.y],[midX,a.y],[midX,b.y],[b.x,b.y]];
}

function drawWires(){
  wires.forEach(w=>{
 const ca=comps.find(c=>c.id===w.a.compId), cb=comps.find(c=>c.id===w.b.compId);
    if(!ca||!cb) return;
    const pa=termAbs(ca,w.a.term), pb=termAbs(cb,w.b.term);
    const pts = pathForWire(pa,pb);
    const I = Math.max(Math.abs(ca.state?.I||0), Math.abs(cb.state?.I||0));
    const on = sim.powered && I>0.0008;
    ctx.strokeStyle = on? COL_WIRE_ON : COL_WIRE_OFF;
    ctx.lineWidth = on? 3 : 2.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.stroke();
    if(on){
      const totalLen = segLen(pts);
      const speed = Math.min(220, 40+Math.abs(I)*4000);
      const nDots = Math.max(1, Math.floor(totalLen/26));
      for(let i=0;i<nDots;i++){
        let d = ( (particlePhase*speed) + i*(totalLen/nDots) ) % totalLen;
        if(I<0) d = totalLen-d;
        const pt = pointAtLen(pts,d);
        ctx.beginPath(); ctx.arc(pt.x,pt.y,2.6,0,Math.PI*2);
        ctx.fillStyle='#fff3d6'; ctx.fill();
 }
    }
    drawTerminalDot(ctx,pa.x,pa.y, true); drawTerminalDot(ctx,pb.x,pb.y, true);
  });
}
function segLen(pts){ let l=0; for(let i=1;i<pts.length;i++) l+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return l; }
function pointAtLen(pts,d){
  for(let i=1;i<pts.length;i++){
 const segL = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    if(d<=segL || i===pts.length-1){
      const t = segL? d/segL : 0;
      return {x:pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t, y:pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t};
    }
    d-=segL;
  }
  return {x:pts[0][0],y:pts[0][1]};
}

function drawComponents(){
  comps.forEach(c=>{
    const def = COMPONENTS[c.type];
    ctx.save();
    ctx.translate(c.x,c.y); ctx.rotate(c.rot*Math.PI/180);
    const rotRad = c.rot*Math.PI/180;
    const origFillText = ctx.fillText;
    if(rotRad!==0){
      ctx.fillText = function(text,x,y,maxWidth){
        ctx.save(); ctx.translate(x,y); ctx.rotate(-rotRad);
        origFillText.call(ctx,text,0,0,maxWidth);
        ctx.restore();
      };
    }
    def.draw(ctx,c,sim);
    ctx.fillText = origFillText;
    ctx.restore();
    if(c===selectedComp){
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot*Math.PI/180);
      ctx.strokeStyle='#ffb02e'; ctx.setLineDash([4,3]); ctx.lineWidth=1.4;
      ctx.strokeRect(-42,-36,84,72); ctx.restore();
    }
    c.terminals.forEach((t,ti)=>{
      const p = termAbs(c,ti);
      const connected = wires.some(w=> (w.a.compId===c.id&&w.a.term===ti)||(w.b.compId===c.id&&w.b.term===ti));
 drawTerminalDot(ctx,p.x,p.y, connected || wireMode);
    });
  });
  if(wireMode && wireStart){
    ctx.strokeStyle='#ffb02e'; ctx.setLineDash([5,4]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(wireStart.x,wireStart.y,10,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  }
}

function updateStatus(){
  const bar = document.getElementById('statusbar');
  const battery = comps.find(c=>c.type==='battery');
  const nComps = comps.length, nWires = wires.length;
  let html = `<div class="chip">Componentes: <b>${nComps}</b></div><div class="chip">Cables: <b>${nWires}</b></div>`;
  html += `<div class="chip">Estado: <b>${sim.powered? 'ENCENDIDO':'apagado'}</b></div>`;
  if(sim.powered) html += `<div class="chip">Corriente total: <b>${fmtAmp(sim.totalCurrent||0)}</b></div>`;
  bar.innerHTML = html;
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  particlePhase += dt;
  sim.step(comps, wires, dt);
  
  if (scopeActive) {
     const ch1CompId = document.getElementById('scopeCh1Comp')?.value;
     const ch1Type = document.getElementById('scopeCh1Type')?.value;
     const ch2CompId = document.getElementById('scopeCh2Comp')?.value;
     const ch2Type = document.getElementById('scopeCh2Type')?.value;
     
     const v1 = ch1CompId ? (comps.find(c=>c.id===ch1CompId)?.state?.[ch1Type] || 0) : null;
     const v2 = ch2CompId ? (comps.find(c=>c.id===ch2CompId)?.state?.[ch2Type] || 0) : null;
     
     scopeData.push({ t: sim.simTime, v1, v2 });
     
     const win = parseFloat(document.getElementById('scopeWinSlider')?.value || 2);
     while (scopeData.length > 0 && scopeData[0].t < sim.simTime - win - 0.2) {
         scopeData.shift();
     }
     drawScope();
  }
  
  drawGrid();
  ctx.save();
  ctx.translate(panX, panY);
  drawWires(); drawComponents();
  ctx.restore();
  updateStatus();
  requestAnimationFrame(loop);
}

resize();
updateModeUI();
updatePlacingChip();
requestAnimationFrame(loop);

</script>
