    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+16:t.x-16, t.y]]));
    ctx.strokeStyle= c.state?.enabled? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-24,-30,48,60);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center'; ctx.fillText('A4988',0,-2);
    ctx.font='6.5px sans-serif'; ctx.fillText(c.state?.enabled?'fase '+(c.state.phase||0):'deshabilitado',0,10);
  }
},

l298n_hbridge: { label:'Puente H (L298N)', cat:'Módulos', icon:'⇄⚙', props:{Vdrop:1.5},
  terminals:[T(-40,-24,'VS'),T(-40,-8,'GND'),T(-40,8,'IN1'),T(-40,24,'IN2'),T(0,-34,'ENA'),T(40,-12,'OUT1'),T(40,12,'OUT2')],
  edges(c){
    const vs = (c.state.Vt0||0)-(c.state.Vt1||0);
    const en = (c.state.Vt4||0) > 2.0;
    if(vs<1 || !en) return [{n:[5,1],type:'OPEN',value:1e9},{n:[6,1],type:'OPEN',value:1e9}];
    const in1 = (c.state.Vt2||0) > vs/2;
    const in2 = (c.state.Vt3||0) > vs/2;
    const vout = Math.max(0, vs - c.props.Vdrop);
    if(in1 && !in2) return [{n:[5,1],type:'V',value:vout,Rint:1},{n:[6,1],type:'V',value:0,Rint:1}];
    if(in2 && !in1) return [{n:[5,1],type:'V',value:0,Rint:1},{n:[6,1],type:'V',value:vout,Rint:1}];
    return [{n:[5,1],type:'V',value:0,Rint:1},{n:[6,1],type:'V',value:0,Rint:1}];
  },
  draw(ctx,c){
    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+16:t.x-16, t.y]]));
    const vs=(c.state.Vt0||0)-(c.state.Vt1||0), en=(c.state.Vt4||0)>2.0;
    ctx.strokeStyle= (vs>=1 && en)? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-24,-30,48,60);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center'; ctx.fillText('L298N',0,-2);
    ctx.font='6.5px sans-serif'; ctx.fillText(!en?'ENA=0':(vs<1?'sin VS':'activo'),0,10);
  }
},

battery_18650: { label:'Batería Li-ion 18650 (3.7V)', cat:'Fuentes', icon:'🔋', props:{V:3.7},
  terminals:[T(-40,0,'-'),T(40,0,'+')],
  edges(c){ return [{n:[0,1], type:'V', value:c.props.V, Rint:0.15}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-18,0]]); leadLines(ctx,[[18,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-18,-11,36,22);
    ctx.fillStyle='#586576'; ctx.fillRect(15,-5,5,10);
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText('−',-9,4); ctx.fillText('+',9,4);
    ctx.font='7.5px sans-serif'; ctx.fillText(c.props.V+'V',0,24);
  }
},

lipo_3s_battery: { label:'Batería LiPo 3S (11.1V)', cat:'Fuentes', icon:'🔋3S', props:{V:11.1},
  terminals:[T(-40,0,'-'),T(40,0,'+')],
  edges(c){ return [{n:[0,1], type:'V', value:c.props.V, Rint:0.3}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-20,0]]); leadLines(ctx,[[20,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-20,-13,40,26);
    ctx.fillStyle='#aab6c4'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText('−',-10,4); ctx.fillText('+',10,4);
    ctx.font='7.5px sans-serif'; ctx.fillText(c.props.V+'V (3S)',0,26);
  }
},

shunt_resistor: { label:'Resistencia Shunt (medición)', cat:'Medición', icon:'▭mΩ', props:{R:0.01},
  terminals:[T(-40,0),T(40,0)],
  edges(c){ return [{n:[0,1], type:'R', value:Math.max(0.001,c.props.R), tag:'meter'}]; },
  draw(ctx,c){
    leadLines(ctx,[[-40,0],[-20,0]]); leadLines(ctx,[[20,0],[40,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2.4; ctx.strokeRect(-20,-8,40,16);
    ctx.fillStyle='#aab6c4'; ctx.font='7.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText((c.props.R*1000).toFixed(1)+' mΩ', 0, 22);
    ctx.font='7px sans-serif'; ctx.fillText(fmtVolt(c.state?.V||0)+' caída', 0, 32);
  }
},

buck_boost_converter: { label:'Convertidor Buck-Boost', cat:'Módulos', icon:'⇅5V', props:{Vset:12, eta:0.9},
  terminals:[T(-40,-16,'VIN+'),T(-40,16,'VIN-'),T(40,-16,'VOUT+'),T(40,16,'VOUT-')],
  edges(c){
    const vin = (c.state.Vt0||0)-(c.state.Vt1||0);
    if(vin <= 1) return [{n:[2,3], type:'OPEN', value:1e9}];
    const vout = c.props.Vset*c.props.eta;
    return [{n:[2,3], type:'V', value:vout, Rint:0.5}];
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,-16],[-16,-16]]); leadLines(ctx,[[-40,16],[-16,16]]);
    leadLines(ctx,[[16,-16],[40,-16]]); leadLines(ctx,[[16,16],[40,16]]);
    ctx.strokeStyle='#b366ff'; ctx.lineWidth=2; ctx.strokeRect(-16,-20,32,40);
    ctx.fillStyle='rgba(179,102,255,.15)'; ctx.fillRect(-16,-20,32,40);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText('B-BOOST',0,-2); ctx.font='7px sans-serif'; ctx.fillText((c.props.Vset*c.props.eta).toFixed(1)+'V',0,10);
  }
},

hall_linear_sensor: { label:'Sensor Hall Lineal (analógico)', cat:'Sensores', icon:'⌘V', props:{field:0, sensitivity:1.0, Vcc:5},
  terminals:[T(-30,-16,'VCC'),T(-30,16,'GND'),T(30,0,'OUT')],
  edges(c){
    const vccV = c.state.Vt0||0;
    if(vccV < 3.0) return [{n:[2,'GND'], type:'OPEN', value:1e9}];
    const vout = clamp01(0.5 + c.props.field*0.5*c.props.sensitivity) * c.props.Vcc;
    return [{n:[2,'GND'], type:'V', value:vout, Rint:5}];
  },
  draw(ctx,c){
    leadLines(ctx,[[-30,-16],[-14,-16]]); leadLines(ctx,[[-30,16],[-14,16]]); leadLines(ctx,[[30,0],[14,0]]);
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=1.6; ctx.strokeRect(-14,-18,28,36);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center'; ctx.fillText('HALL',0,-2);
    ctx.font='6.5px sans-serif'; ctx.fillText('campo '+(c.props.field>=0?'+':'')+Math.round(c.props.field*100)+'%',0,10);
  }
}

};

Object.assign(COMPONENTS, NUEVOS3);

if(typeof propFieldsFor === 'function'){
  const _origPropFieldsFor3 = propFieldsFor;
  const EXTRA_FIELDS3 = {
    tl431_shunt_regulator:[{key:'Vref',label:'Voltaje de referencia (V)',step:0.1}],
    bmp280_sensor:[{key:'pressure',label:'Presión simulada',type:'range'}],
    mpu6050_sensor:[{key:'tilt',label:'Inclinación simulada',type:'range'}],
    soil_moisture_sensor:[{key:'moisture',label:'Humedad del suelo',type:'range'}],
    uv_sensor:[{key:'uvIndex',label:'Índice UV simulado',type:'range'}],
    hx711_load_cell:[{key:'weight',label:'Peso simulado',type:'range'}],
    a4988_driver:[{key:'Vmot',label:'Voltaje de motor (V)',step:0.5}],
    l298n_hbridge:[{key:'Vdrop',label:'Caída de voltaje interna (V)',step:0.1}],
    battery_18650:[{key:'V',label:'Voltaje (V)',step:0.1}],
    lipo_3s_battery:[{key:'V',label:'Voltaje (V)',step:0.1}],
    shunt_resistor:[{key:'R',label:'Resistencia (Ω)',step:0.001}],
    buck_boost_converter:[{key:'Vset',label:'Vout objetivo (V)',step:0.5},{key:'eta',label:'Eficiencia η',type:'range'}],
    hall_linear_sensor:[{key:'field',label:'Campo magnético (-1 a 1)',step:0.05},{key:'sensitivity',label:'Sensibilidad',step:0.1}]
  };
  propFieldsFor = function(type){
    if(EXTRA_FIELDS3[type]) return EXTRA_FIELDS3[type];
    return _origPropFieldsFor3(type);
  };
}

})();

<script>
// ============================================================
// pantallas-realistas.js — Rediseña TFT, LCD 16x2 y Display 7 Seg.
// para que parezcan pantallas reales al colocarlas en el lienzo.
// Pegar al final, después de todos los demás <script>.
// ============================================================
(function(){

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------------- TFT SPI (ILI9341) ----------------
if(COMPONENTS.tft_display){
COMPONENTS.tft_display.draw = function(ctx,c,sim){
  const VccV = c.state.Vt0||0;
  const GndV = c.state.Vt1||0;
  const ledV = c.state.Vt7||0;
  const csV  = c.state.Vt2||0;
  const sckV = c.state.Vt6||0;
  const sdiV = c.state.Vt5||0;

  const powered   = (VccV - GndV) > 3.0;
  const backlight = powered || (ledV - GndV) > 2.0;
  const receiving = backlight && csV < 1.0 && sckV > 2.0;

  c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+6:t.x-6, t.y]]));

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  ctx.fillStyle='#12211a';
  roundRectPath(ctx,-24,-46,48,92,5);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#2a3a2c'; ctx.lineWidth=1.2;
  roundRectPath(ctx,-24,-46,48,92,5); ctx.stroke();

  ctx.fillStyle='#050807';
  [[-19,-40],[19,-40],[-19,40],[19,40]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
  });

  ctx.fillStyle='#050608';
  roundRectPath(ctx,-18,-38,36,76,3); ctx.fill();

  const gx=-14, gy=-34, gw=28, gh=68;
  ctx.save();
  roundRectPath(ctx,gx,gy,gw,gh,2); ctx.clip();

  if(!backlight){
    ctx.fillStyle='#04070a'; ctx.fillRect(gx,gy,gw,gh);
  } else {
    const grad = ctx.createLinearGradient(gx,gy,gx,gy+gh);
    grad.addColorStop(0,'#1c3a5e'); grad.addColorStop(1,'#0d1e33');
    ctx.fillStyle=grad; ctx.fillRect(gx,gy,gw,gh);

    if(receiving){
      const lineH = 3, nLines = Math.floor(gh/lineH);
      for(let i=0;i<nLines;i++){
        const phase = (sim.simTime*6 + i*0.15) % 1;
        const hue = (i*37 + sim.simTime*120) % 360;
        ctx.fillStyle = sdiV>2.0 ? `hsl(${hue},70%,55%)` : `hsl(${hue},20%,30%)`;
        ctx.globalAlpha = 0.55 + 0.45*Math.sin(phase*Math.PI);
        ctx.fillRect(gx, gy+i*lineH, gw, lineH-0.4);
      }
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(gx,gy+gh-9,gw,9);
      ctx.fillStyle='#e7edf5'; ctx.font='5px sans-serif'; ctx.textAlign='center';
      ctx.fillText('SPI RX', gx+gw/2, gy+gh-3);
    } else {
      ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(gx,gy,gw,6);
      ctx.fillStyle='#cfe8ff'; ctx.font='4.5px sans-serif'; ctx.textAlign='left';
      ctx.fillText('12:30', gx+1.5, gy+4.5);
      ctx.textAlign='right'; ctx.fillText('▮▮▮', gx+gw-1.5, gy+4.5);

      ctx.fillStyle='#e7edf5'; ctx.font='bold 5.5px sans-serif'; ctx.textAlign='center';
      ctx.fillText('TFT 2.4"', gx+gw/2, gy+gh/2-3);
      ctx.fillStyle='#7fb8ff'; ctx.font='4.5px sans-serif';
      ctx.fillText('ILI9341', gx+gw/2, gy+gh/2+5);

      const icoY = gy+gh-13;
      [['#ff5c5c',-8],['#39d3a8',0],['#ffb02e',8]].forEach(([col,dx])=>{
        ctx.fillStyle=col; roundRectPath(ctx,gx+gw/2+dx-2.6,icoY,5.2,5.2,1.2); ctx.fill();
      });
    }
  }
  ctx.restore();

  ctx.save();
  roundRectPath(ctx,gx,gy,gw,gh,2); ctx.clip();
  const shine = ctx.createLinearGradient(gx,gy,gx+gw*0.6,gy+gh*0.6);
  shine.addColorStop(0,'rgba(255,255,255,.18)');
  shine.addColorStop(0.4,'rgba(255,255,255,.03)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=shine;
  ctx.beginPath();
  ctx.moveTo(gx,gy); ctx.lineTo(gx+gw*0.55,gy); ctx.lineTo(gx,gy+gh*0.7); ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.beginPath(); ctx.arc(0,42,1.6,0,Math.PI*2);
  ctx.fillStyle = powered? '#39d3a8' : '#2a2f28';
  ctx.fill();

  ctx.fillStyle='#8a97a8'; ctx.font='6px sans-serif';
  ctx.textAlign='right';
  ctx.fillText('VCC', -26, -28);
  ctx.fillText('GND', -26, -8);
  ctx.fillText('CS', -26, 12);
  ctx.fillText('RST', -26, 32);

  ctx.textAlign='left';
  ctx.fillText('DC', 26, -28);
  ctx.fillText('SDI', 26, -8);
  ctx.fillText('SCK', 26, 12);
  ctx.fillText('LED', 26, 32);
};
}

// ---------------- LCD 16x2 (HD44780) ----------------
if(COMPONENTS.lcd_1602){
COMPONENTS.lcd_1602.draw = function(ctx,c,sim){
  const on = Math.abs(c.state?.I||0) > 0.003;
  leadLines(ctx,[[-40,0],[-24,0]]); leadLines(ctx,[[24,0],[40,0]]);

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=5; ctx.shadowOffsetY=2;
  ctx.fillStyle='#123018';
  roundRectPath(ctx,-24,-16,48,32,3); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#1c4530'; ctx.lineWidth=1; roundRectPath(ctx,-24,-16,48,32,3); ctx.stroke();

  // header de pines a lo largo del borde inferior
  ctx.fillStyle='#c7b26a';
  for(let i=0;i<16;i++){ ctx.fillRect(-21.5+i*2.7,13,1.5,2.6); }

  // potenciómetro de contraste (esquina)
  ctx.fillStyle='#2a3a44'; ctx.beginPath(); ctx.arc(19,-12,3.2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#556274'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(19,-12); ctx.lineTo(21.5,-13.5); ctx.stroke();

  // vidrio / pantalla
  const gx=-20, gy=-13, gw=40, gh=22;
  ctx.fillStyle = on ? '#2a5a22' : '#132a1a';
  roundRectPath(ctx,gx,gy,gw,gh,1); ctx.fill();

  if(on){
    const cols=16, cw=gw/cols;
    // renglón de caracteres simulado (bloques de puntos por carácter)
    for(let col=0; col<cols; col++){
      const cx = gx+col*cw+cw/2;
      ctx.fillStyle='rgba(200,255,180,.35)';
      for(let px=-1;px<=1;px++) for(let py=-2;py<=2;py++){
        ctx.fillRect(cx+px*1.1-0.4, gy+7+py*1.4-0.4, 0.8,0.8);
      }
    }
    // cursor parpadeante en el primer carácter
    if((sim.simTime%1)<0.5){
      ctx.fillStyle='rgba(210,255,190,.85)';
      ctx.fillRect(gx+1, gy+gh-4, cw-2, 2);
    }
    ctx.fillStyle='#d7ffbe'; ctx.font='bold 6px monospace'; ctx.textAlign='left';
    ctx.fillText('LCD 16x2', gx+2, gy+8);
  }

  // brillo sutil del vidrio
  ctx.save();
  roundRectPath(ctx,gx,gy,gw,gh,1); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.06)';
  ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+gw*0.35,gy); ctx.lineTo(gx,gy+gh*0.7); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.fillStyle='#aab6c4'; ctx.font='6.5px sans-serif'; ctx.textAlign='center';
  ctx.fillText(on?'LCD 16x2 ON':'LCD 16x2', 0, 26);
};
}

// ---------------- Display 7 Segmentos ----------------
if(COMPONENTS.sevenseg){
COMPONENTS.sevenseg.draw = function(ctx,c){
  const on = Math.abs(c.state?.I||0) > 0.005;

  leadLines(ctx,[[-40,0],[-20,0]]); leadLines(ctx,[[20,0],[40,0]]);

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=4; ctx.shadowOffsetY=1;
  ctx.fillStyle='#0a0a0a';
  roundRectPath(ctx,-20,-20,40,40,3); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#222'; ctx.lineWidth=1; roundRectPath(ctx,-20,-20,40,40,3); ctx.stroke();

  // ventana difusora gris oscura
  ctx.fillStyle='#161616';
  roundRectPath(ctx,-16,-17,32,34,2); ctx.fill();

  const off = 'rgba(120,20,20,.28)';
  const onCol = '#ff2b2b';
  function seg(x1,y1,x2,y2){
    ctx.strokeStyle = on? onCol : off;
    ctx.lineWidth=3.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  if(on){ ctx.save(); ctx.shadowColor='rgba(255,40,40,.85)'; ctx.shadowBlur=6; }
  seg(-11,-14,10,-14);   // a — arriba
  seg(11,-13,11,-1);     // b — arriba derecha
  seg(11,1,11,13);       // c — abajo derecha
  seg(-11,15,10,15);     // d — abajo
  seg(-12,1,-12,13);     // e — abajo izquierda
  seg(-12,-13,-12,-1);   // f — arriba izquierda
  seg(-9,0,9,0);         // g — centro
  if(on) ctx.restore();

  // punto decimal
  ctx.beginPath(); ctx.arc(15,15,1.6,0,Math.PI*2);
  ctx.fillStyle = on? onCol : off; ctx.fill();

  ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
  ctx.fillText(on?'ENCENDIDO':'display 7 seg.', 0, 30);
};
}

})();
</script>
<script>
// ============================================================
// pines-7seg-y-panel-info.js — Corrige los pines del display de
// 7 segmentos y añade un botón "ℹ️ Info" que explica el
// funcionamiento del componente seleccionado.
// Pegar al final, después de todos los demás <script>.
// ============================================================
(function(){

// ------------------------------------------------------------
// PARTE 1 — Display de 7 segmentos con pines reales
// (cátodo común: a,b,c,d,e,f,g,dp + 2 pines COM internos)
// ------------------------------------------------------------
COMPONENTS.sevenseg = {
  label:'Display 7 Segmentos (cátodo común)', cat:'Salida', icon:'8',
  props:{ R:150 },
  terminals:[
    T(-40,-32,'a'), T(-40,-16,'f'), T(-40,0,'COM'), T(-40,16,'e'), T(-40,32,'d'),
    T(40,-32,'b'),  T(40,-16,'COM2'), T(40,0,'g'), T(40,16,'c'), T(40,32,'dp')
  ],
  edges(c){
    const R = Math.max(1, c.props.R);
    return [
      {n:[2,6], type:'R', value:0.01},          // une los dos pines COM internamente
      {n:[0,2], type:'R', value:R, tag:'a'},
      {n:[1,2], type:'R', value:R, tag:'f'},
      {n:[3,2], type:'R', value:R, tag:'e'},
      {n:[4,2], type:'R', value:R, tag:'d'},
      {n:[5,6], type:'R', value:R, tag:'b'},
      {n:[7,6], type:'R', value:R, tag:'g'},
      {n:[8,6], type:'R', value:R, tag:'c'},
      {n:[9,6], type:'R', value:R, tag:'dp'}
    ];
  },
  draw(ctx,c){
    const on = seg => Math.abs(c.state?.['I_'+seg]||0) > 0.0008;
    c.terminals.forEach(t=>{
      const bx = t.x<0? -18 : 18;
      leadLines(ctx,[[t.x,t.y],[bx,t.y]]);
    });
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=1.6;
    ctx.strokeRect(-18,-36,36,72);
    ctx.fillStyle='#0d1219'; ctx.fillRect(-14,-30,28,56);
    function seg(onFlag,x1,y1,x2,y2){
      ctx.strokeStyle = onFlag? '#ff3b3b':'#3a1414';
      ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    seg(on('a'), -9,-20, 9,-20);
    seg(on('b'), 10,-19, 10,-1);
    seg(on('c'), 10, 1, 10,19);
    seg(on('d'), -9, 20, 9, 20);
    seg(on('e'), -10, 1,-10,19);
    seg(on('f'), -10,-19,-10,-1);
    seg(on('g'), -8, 0, 8, 0);
    ctx.beginPath(); ctx.arc(14,20,1.8,0,Math.PI*2);
    ctx.fillStyle = on('dp')? '#ff3b3b':'#3a1414'; ctx.fill();
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText('7-SEG', 0, 44);
  }
};

if(typeof propFieldsFor === 'function'){
  const _origPropFieldsFor4 = propFieldsFor;
  propFieldsFor = function(type){
    if(type==='sevenseg') return [{key:'R', label:'Resistencia por segmento (Ω)'}];
    return _origPropFieldsFor4(type);
  };
}

// ------------------------------------------------------------

const PIN_MEANINGS = [
  [/^VCC$|^VDD$|^5V$|^VIN$/i, 'Alimentación positiva'],
  [/^GND$|^COM2?$|^-$/i, 'Tierra / referencia negativa (0V)'],
  [/^\+$/, 'Terminal positivo'],
  [/^OUT(PUT)?\d?$/i, 'Salida de la señal'],
  [/^IN\d?$/i, 'Entrada de control'],
  [/^TRIG$/i, 'Pulso de disparo (trigger)'],
  [/^ECHO$/i, 'Retorno del pulso (eco)'],
  [/^SDA$/i, 'Datos del bus I2C (necesita pull-up)'],
  [/^SCL$/i, 'Reloj del bus I2C (necesita pull-up)'],
  [/^TX$/i, 'Transmisión de datos serie'],
  [/^RX$/i, 'Recepción de datos serie'],
  [/^EN(ABLE)?$/i, 'Habilitación del módulo/driver'],
  [/^DATA$/i, 'Línea de datos (a veces requiere pull-up)'],
  [/^CLK$|^SCK$/i, 'Señal de reloj'],
  [/^DIR$/i, 'Define el sentido de giro'],
  [/^STEP$/i, 'Pulso que avanza un paso del motor'],
  [/^MISO$/i, 'Datos del esclavo al maestro (SPI)'],
  [/^MOSI$|^SDI$/i, 'Datos del maestro al esclavo (SPI)'],
  [/^CS$/i, 'Selección de chip (SPI)'],
  [/^RST$/i, 'Reinicio (reset)'],
  [/^gate$/i, 'Control del transistor/tiristor'],
  [/^base$/i, 'Controla el paso de corriente colector-emisor'],
  [/^colector$/i, 'Terminal de mayor voltaje del transistor'],
  [/^emisor$/i, 'Terminal de menor voltaje del transistor'],
  [/^anodo$/i, 'Terminal positivo del diodo/LED'],
  [/^catodo$/i, 'Terminal negativo del diodo/LED'],
  [/^wiper$/i, 'Cursor variable del potenciómetro']
];
function inferPinMeaning(name){
  if(!name) return '';
  for(const [re,txt] of PIN_MEANINGS){ if(re.test(name)) return txt; }
  return '';
}

function buildComponentInfoHtml(c){
  const def = COMPONENTS[c.type];
  const desc = COMPONENT_INFO[c.type] || (CATEGORY_INFO[def.cat] || 'Componente electrónico.');
  let html = `<p style="font-size:13px;line-height:1.5;color:var(--text);margin:0 0 12px;">${desc}</p>`;
  html += `<div class="cat-title" style="padding-top:0;">Categoría</div><p style="font-size:12px;color:var(--text-dim);margin:0 0 10px;">${def.cat}</p>`;
  if(c.terminals && c.terminals.length){
    html += `<div class="cat-title" style="padding-top:0;">Pines (${c.terminals.length})</div><div class="slist">`;
    c.terminals.forEach((t,i)=>{
      const nm = t.name || ('Pin '+i);
      const meaning = inferPinMeaning(t.name) || 'Terminal de conexión';
      html += `<div class="sitem" style="cursor:default;"><div class="name"><b>${nm}</b> — <span style="color:var(--text-dim);">${meaning}</span></div></div>`;
    });
    html += `</div>`;
  }
  return html;
}
function showComponentInfo(c){
  const def = COMPONENTS[c.type];
  openOverlay('ℹ️ '+def.label, buildComponentInfoHtml(c));
}

// añadir el botón "Info" al panel de acciones rápidas
const quickActionsEl = document.getElementById('quickActions');
if(quickActionsEl && !document.getElementById('btnInfo')){
  const infoBtn = document.createElement('button');
  infoBtn.className = 'tbtn';
  infoBtn.id = 'btnInfo';
  infoBtn.textContent = 'ℹ️ Info';
  quickActionsEl.insertBefore(infoBtn, quickActionsEl.firstChild);
  infoBtn.addEventListener('click', ()=>{
    if(selectedComp) showComponentInfo(selectedComp);
  });
}

<script>
// ============================================================
// correccion-pines-faltantes.js — Añade pines reales que faltaban
// en varios componentes (VCC/GND en lógica, NC en relé, etc.)
// Pegar al final, después de todos los demás <script>.
// ============================================================
(function(){

// ------------------------------------------------------------
// 1) RELÉ — le faltaba el contacto NC (la mayoría de relés reales
// son SPDT: común, normalmente abierto y normalmente cerrado)
// ------------------------------------------------------------
{
  const def = COMPONENTS.relay;
  def.terminals = [T(-40,-24,'bobA'),T(-40,24,'bobB'),T(40,-24,'com'),T(40,0,'no'),T(40,24,'nc')];
  def.edges = function(c){
    const pulled = Math.abs(c.state?.Icoil||0) >= c.props.Ipull;
    return [
      {n:[0,1], type:'R', value:c.props.Rcoil, tag:'coil'},
      {n:[2,3], type: pulled? 'R':'OPEN', value:0.05},
      {n:[2,4], type: pulled? 'OPEN':'R', value:0.05}
    ];
  };
  def.draw = function(ctx,c){
    leadLines(ctx,[[-40,-24],[-14,-24]]); leadLines(ctx,[[-40,24],[-14,24]]);
    leadLines(ctx,[[40,-24],[14,-24]]); leadLines(ctx,[[40,0],[14,0]]); leadLines(ctx,[[40,24],[14,24]]);
    const pulled = Math.abs(c.state?.Icoil||0) >= c.props.Ipull;
    ctx.strokeStyle= pulled? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-14,-28,28,56);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText('RELÉ',0,-2); ctx.font='6.5px sans-serif';
    ctx.fillText(pulled?'com→NO':'com→NC',0,10);
  };
}

// ------------------------------------------------------------
// 2) COMPUERTAS LÓGICAS, LATCH SR, COMPARADOR Y SCHMITT TRIGGER
// — todos son circuitos integrados reales: NO pueden funcionar
// sin sus pines de alimentación (VCC/GND). Antes "funcionaban"
// usando una propiedad interna aunque no tuvieran corriente real.
// ------------------------------------------------------------
const GATE_FN = {
  gate_and:(a,b)=>a&&b, gate_or:(a,b)=>a||b, gate_nand:(a,b)=>!(a&&b),
  gate_nor:(a,b)=>!(a||b), gate_xor:(a,b)=>a!==b, gate_xnor:(a,b)=>a===b
};
Object.keys(GATE_FN).forEach(type=>{
  const def = COMPONENTS[type]; if(!def) return;
  const fn = GATE_FN[type];
  const vI = def.terminals.length, gI = vI+1; // out=2 sigue igual, se agregan VCC/GND al final
  def.terminals.push(T(0,-30,'VCC'), T(0,30,'GND'));
  def.edges = function(c){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return [{n:[2,gI], type:'OPEN', value:1e9}];
    const a=(c.state?.Vin0||0) > vcc/2, b=(c.state?.Vin1||0) > vcc/2;
    const out = fn(a,b);
    return [{n:[2,gI], type:'GATEOUT', value: out? vcc:0, tag:'gate', Rint:10}];
  };
  const origDraw = def.draw;
  def.draw = function(ctx,c,sim){
    origDraw(ctx,c,sim);
    leadLines(ctx,[[0,-30],[0,-18]]); leadLines(ctx,[[0,30],[0,18]]);
    const powered = ((c.state?.['Vt'+vI]||0)-(c.state?.['Vt'+gI]||0)) >= 3.0;
    if(!powered){ ctx.fillStyle='#ff5c5c'; ctx.font='6.5px sans-serif'; ctx.textAlign='center'; ctx.fillText('sin VCC',0,26); }
  };
});

['gate_not','gate_buffer'].forEach(type=>{
  const def = COMPONENTS[type]; if(!def) return;
  const isNot = type==='gate_not';
  const vI = def.terminals.length, gI = vI+1; // in=0, out=1
  def.terminals.push(T(0,-30,'VCC'), T(0,30,'GND'));
  def.edges = function(c){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return [{n:[1,gI], type:'OPEN', value:1e9}];
    const a=(c.state?.Vin0||0) > vcc/2;
    const out = isNot? !a : a;
    return [{n:[1,gI], type:'GATEOUT', value: out? vcc:0, tag:'gate', Rint:10}];
  };
  const origDraw = def.draw;
  def.draw = function(ctx,c,sim){
    origDraw(ctx,c,sim);
    leadLines(ctx,[[0,-30],[0,-18]]); leadLines(ctx,[[0,30],[0,18]]);
  };
});

{ // SR Latch
  const def = COMPONENTS.sr_latch;
  const vI = def.terminals.length, gI = vI+1; // S=0,R=1,Q=2,Q̄=3
  def.terminals.push(T(0,-34,'VCC'), T(0,34,'GND'));
  def.step = function(c, dt, sim){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return; // sin alimentación: conserva el último estado, no responde
    const S = (c.state?.Vin0||0) > vcc/2;
    const R = (c.state?.Vin1||0) > vcc/2;
    let q = c.state.Q ?? false;
    if(S && !R) q = true;
    else if(R && !S) q = false;
    else if(S && R) q = false;
    c.state.Q = q;
  };
  def.edges = function(c){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return [{n:[2,gI],type:'OPEN',value:1e9},{n:[3,gI],type:'OPEN',value:1e9}];
    const q = c.state?.Q ?? false;
    return [
      {n:[2,gI], type:'GATEOUT', value: q? vcc:0, tag:'gate', Rint:10},
      {n:[3,gI], type:'GATEOUT', value: q? 0:vcc, tag:'gate', Rint:10}
    ];
  };
  const origDraw = def.draw;
  def.draw = function(ctx,c,sim){
    origDraw(ctx,c,sim);
    leadLines(ctx,[[0,-34],[0,-22]]); leadLines(ctx,[[0,34],[0,22]]);
  };
}

{ // Comparador LM393
  const def = COMPONENTS.comparator;
  const vI = def.terminals.length, gI = vI+1; // in+=0,in-=1,out=2
  def.terminals.push(T(0,-30,'VCC'), T(0,30,'GND'));
  def.edges = function(c){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return [{n:[2,gI], type:'OPEN', value:1e9}];
    const highSide = (c.state?.Vt0||0) > (c.state?.Vt1||0);
    return [{n:[2,gI], type: highSide? 'OPEN':'R', value: highSide? 1e9 : 15}];
  };
  const origDraw = def.draw;
  def.draw = function(ctx,c,sim){
    origDraw(ctx,c,sim);
    leadLines(ctx,[[0,-30],[0,-20]]); leadLines(ctx,[[0,30],[0,20]]);
  };
}

{ // Disparador Schmitt
  const def = COMPONENTS.schmitt_trigger;
  const vI = def.terminals.length, gI = vI+1; // in=0,out=1
  def.terminals.push(T(0,-30,'VCC'), T(0,30,'GND'));
  def.edges = function(c){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return [{n:[1,gI], type:'OPEN', value:1e9}];
    const hi = c.state?.hi ?? false;
    return [{n:[1,gI], type:'GATEOUT', value: !hi? vcc:0, tag:'gate', Rint:10}];
  };
  def.postSolve = function(c){
    const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
    if(vcc < 3.0) return;
    const Vin = c.state?.Vt0||0;
    let hi = c.state?.hi ?? false;
    if(!hi && Vin > c.props.Vhigh) hi = true;
    else if(hi && Vin < c.props.Vlow) hi = false;
    c.state.hi = hi;
  };
  const origDraw = def.draw;
  def.draw = function(ctx,c,sim){
    origDraw(ctx,c,sim);
    leadLines(ctx,[[0,-30],[0,-18]]); leadLines(ctx,[[0,30],[0,18]]);
  };
}

// ------------------------------------------------------------
// 3) JOYSTICK — le faltaba el pulsador (SW) que traen casi todos
// los módulos de joystick reales al presionar la palanca.
// ------------------------------------------------------------
{
  const def = COMPONENTS.joystick;
  const swIdx = def.terminals.length; // índice del pin GND ya existente = 0
  def.terminals.push(T(0,34,'SW'));
  def.props.pressed = false;
  def.interactive = true;
  def.momentary = true;
  def.onTap = function(c){ c.props.pressed = !c.props.pressed; };
  const origEdges = def.edges;
  def.edges = function(c){
    const base = origEdges(c);
    base.push({n:[swIdx,0], type: c.props.pressed? 'R':'OPEN', value:0.03});
    return base;
  };
  const origDraw = def.draw;
  def.draw = function(ctx,c){
    origDraw(ctx,c);
    leadLines(ctx,[[0,34],[0,18]]);
    ctx.fillStyle = c.props.pressed? COL_WIRE_ON : '#556274';
    ctx.beginPath(); ctx.arc(0,18,2.4,0,Math.PI*2); ctx.fill();
  };
}

// ------------------------------------------------------------
// 4) MÓDULO DC-DC BUCK genérico — tenía GND compartido entre
// entrada y salida (3 pines); los módulos reales normalmente
// aíslan entrada/salida con 4 pines, igual que XL4015/LM2596.
// ------------------------------------------------------------
COMPONENTS.dcdc = {
  label:'Módulo DC-DC Buck', cat:'Módulos', icon:'⇲5V', props:{Vset:5.0, eta:0.92},
  terminals:[T(-40,-16,'VIN+'), T(-40,16,'VIN-'), T(40,-16,'VOUT+'), T(40,16,'VOUT-')],
  edges(c){
    const vin = (c.state.Vt0||0)-(c.state.Vt1||0);
    if(vin <= 1) return [{n:[2,3], type:'OPEN', value:1e9}];
    let vout = Math.min(c.props.Vset, Math.max(0, vin*c.props.eta));
    c.state.Vin = vin; c.state.Vout = vout;
    return [{n:[2,3], type:'V', value:vout, Rint:0.5}];
  },
  draw(ctx,c){
    leadLines(ctx,[[-40,-16],[-16,-16]]); leadLines(ctx,[[-40,16],[-16,16]]);
    leadLines(ctx,[[16,-16],[40,-16]]); leadLines(ctx,[[16,16],[40,16]]);
    ctx.strokeStyle='#7de37d'; ctx.lineWidth=2; ctx.strokeRect(-16,-20,32,40);
    ctx.fillStyle='rgba(125,227,125,.15)'; ctx.fillRect(-16,-20,32,40);
    ctx.fillStyle='#aab6c4'; ctx.font='8px sans-serif'; ctx.textAlign='center';
    ctx.fillText('BUCK',0,-4);
    ctx.font='7px sans-serif'; ctx.fillText((c.state?.Vout||0).toFixed(2)+'V',0,8);
  }
};

// ------------------------------------------------------------
// 5) ARDUINO — le faltaban AREF, RESET y 3V3 (pines reales de la
// placa que muchos proyectos necesitan conectar).
// ------------------------------------------------------------
{
  const def = COMPONENTS.arduino;
  const arefIdx = def.terminals.length;
  const resetIdx = arefIdx+1;
  const v33Idx = arefIdx+2;
  def.terminals.push(T(-70,105,'AREF'), T(-70,-105,'RESET'), T(70,-100,'3V3'));
  ARD_PIN_INDEX.AREF = arefIdx;
  ARD_PIN_INDEX.RESET = resetIdx;
  ARD_PIN_INDEX['3V3'] = v33Idx;
  const origEdges = def.edges;
  def.edges = function(c){
    const e = origEdges(c);
    e.push({n:[ARD_PIN_INDEX['3V3'], ARD_PIN_INDEX.GND], type:'V', value:3.3, Rint:15});
    return e;
  };
}

// ------------------------------------------------------------
// 6) LECTOR RFID RC522 — solo tenía 4 pines; el módulo SPI real
// tiene 8: VCC, RST, GND, IRQ, MISO, MOSI, SCK, SDA(SS).
// ------------------------------------------------------------
COMPONENTS.rfid_rc522 = {
  label:'Lector RFID (RC522)', cat:'Módulos', icon:'📶ID', props:{cardPresent:false},
  terminals:[
    T(-30,-32,'VCC'), T(-30,-16,'RST'), T(-30,0,'GND'), T(-30,16,'IRQ'),
    T(30,-32,'MISO'), T(30,-16,'MOSI'), T(30,0,'SCK'), T(30,16,'SDA')
  ],
  interactive:true,
  onTap(c){ c.props.cardPresent = !c.props.cardPresent; },
  edges(c){ return [{n:[4,2], type:'OPEN', value:1e9}]; },
  draw(ctx,c){
    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+14:t.x-14, t.y]]));
    const powered = ((c.state.Vt0||0)-(c.state.Vt2||0)) >= 3.0;
    ctx.strokeStyle= (powered && c.props.cardPresent)? COL_WIRE_ON:COL_BODY; ctx.lineWidth=1.6; ctx.strokeRect(-14,-36,28,72);
    ctx.fillStyle='#aab6c4'; ctx.font='6.5px sans-serif'; ctx.textAlign='center'; ctx.fillText('RC522',0,-2);
    ctx.fillText(!powered? 'sin VCC' : (c.props.cardPresent?'tarjeta (toca)':'sin tarjeta'),0,10);
  }
};

// ------------------------------------------------------------
// 7) DRIVER A4988 — solo tenía 2 pines de salida (OUT_A, OUT_B),
// pero un motor paso a paso real necesita 2 bobinas completas
// (4 hilos: 1A,1B,2A,2B). Con solo 2 pines nunca podía girar bien.
// ------------------------------------------------------------
COMPONENTS.a4988_driver = {
  label:'Driver de Motor Paso a Paso (A4988)', cat:'Módulos', icon:'⇉⚙', props:{Vmot:12},
  terminals:[
    T(-40,-32,'VDD'), T(-40,-16,'GND'), T(-40,0,'STEP'), T(-40,16,'DIR'), T(-40,32,'ENABLE'),
    T(40,-32,'VMOT'), T(40,-16,'1A'), T(40,0,'1B'), T(40,16,'2A'), T(40,32,'2B')
  ],
  step(c, dt){
    const vdd = (c.state.Vt0||0)-(c.state.Vt1||0);
    const enV = c.state.Vt4||0;
    const enabled = vdd>=2.7 && enV < 2.0;
    const stepV = c.state.Vt2||0;
    const dirV = c.state.Vt3||0;
    const stepHigh = stepV > vdd/2;
    if(enabled && stepHigh && !c.state._lastStep) c.state.phase = ((c.state.phase||0) + (dirV>vdd/2? 1:-1) + 4) % 4;
    c.state._lastStep = stepHigh;
    c.state.enabled = enabled;
  },
  edges(c){
    const vmot = c.state.Vt5||0;
    if(!c.state.enabled) return [
      {n:[6,1],type:'OPEN',value:1e9},{n:[7,1],type:'OPEN',value:1e9},
      {n:[8,1],type:'OPEN',value:1e9},{n:[9,1],type:'OPEN',value:1e9}
    ];
    const seq = [[1,-1],[1,1],[-1,1],[-1,-1]];
    const ph = c.state.phase||0;
    const [a,b] = seq[ph];
    const [cc,dd] = seq[(ph+1)%4];
    return [
      {n:[6,1], type:'V', value:a*vmot*0.5, Rint:2},
      {n:[7,1], type:'V', value:b*vmot*0.5, Rint:2},
      {n:[8,1], type:'V', value:cc*vmot*0.5, Rint:2},
      {n:[9,1], type:'V', value:dd*vmot*0.5, Rint:2}
    ];
  },
  draw(ctx,c){
    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+16:t.x-16, t.y]]));
    ctx.strokeStyle= c.state?.enabled? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-24,-38,48,76);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center'; ctx.fillText('A4988',0,-2);
    ctx.font='6.5px sans-serif'; ctx.fillText(c.state?.enabled?'fase '+(c.state.phase||0):'deshabilitado',0,10);
  }
};

})();
</script>
<script>
// ============================================================
// correccion-pines-lcd-y-mas.js — Completa los pines reales de:
// LCD 16x2, sensores de nivel de agua/lluvia/humedad de suelo,
// sensor de gas, módulo Bluetooth HC-05 y puente H L298N.
// Pegar al final, después de todos los demás <script>.
// ============================================================
(function(){

// ------------------------------------------------------------
// 1) LCD 16x2 (HD44780) — antes solo tenía 2 pines genéricos.
// Ahora tiene los 16 pines reales: VSS,VDD,V0,RS,RW,E,D0-D7,A,K
// ------------------------------------------------------------
COMPONENTS.lcd_1602 = {
  label:'Pantalla LCD 16x2 (HD44780)', cat:'Salida', icon:'▭▭', props:{R:220},
  terminals:[
    T(-40,-56,'VSS'), T(-40,-40,'VDD'), T(-40,-24,'V0'),
    T(-40,-8,'RS'), T(-40,8,'RW'), T(-40,24,'E'),
    T(-40,40,'D0'), T(-40,56,'D1'),
    T(40,-56,'D2'), T(40,-40,'D3'), T(40,-24,'D4'), T(40,-8,'D5'),
    T(40,8,'D6'), T(40,24,'D7'), T(40,40,'A'), T(40,56,'K')
  ],
  edges(c){
    return [
      {n:[1,0], type:'R', value:1e7, tag:'logic'},        // VDD-VSS: solo para poder medir el estado de alimentación
      {n:[14,15], type:'R', value:c.props.R, tag:'main'}   // A-K: circuito de retroiluminación (con su resistencia)
    ];
  },
  draw(ctx,c,sim){
    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+20:t.x-20, t.y]]));
    const powered = ((c.state?.Vt1||0)-(c.state?.Vt0||0)) >= 3.0;
    const on = Math.abs(c.state?.I||0) > 0.003; // retroiluminación encendida

    ctx.strokeStyle=COL_BODY; ctx.lineWidth=1.6; ctx.strokeRect(-20,-60,40,120);
    const gx=-16, gy=-30, gw=32, gh=44;
    ctx.fillStyle = on ? '#2a5a22' : '#132a1a';
    ctx.fillRect(gx,gy,gw,gh);

    if(on){
      for(let col=0; col<8; col++){
        const cx = gx+col*(gw/8)+(gw/16);
        ctx.fillStyle='rgba(200,255,180,.35)';
        for(let px=-1;px<=1;px++) for(let py=-2;py<=2;py++){
          ctx.fillRect(cx+px*0.8-0.3, gy+18+py*1.1-0.3, 0.6,0.6);
        }
      }
      if((sim.simTime%1)<0.5){ ctx.fillStyle='rgba(210,255,190,.85)'; ctx.fillRect(gx+1, gy+gh-6, gw/8-2, 3); }
    }
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText('LCD 16x2', 0, 24);
    ctx.font='6px sans-serif';
    ctx.fillText(!powered? 'sin VDD lógico' : (on? 'backlight ON':'backlight off'), 0, 34);
  }
};
if(typeof propFieldsFor === 'function'){
  const _prevPF1 = propFieldsFor;
  propFieldsFor = function(type){
    if(type==='lcd_1602') return [{key:'R', label:'Resistencia backlight (Ω)'}];
    return _prevPF1(type);
  };
}

// ------------------------------------------------------------
// 2) SENSOR DE NIVEL DE AGUA — antes era solo 2 pines resistivos.
// El módulo real trae VCC, GND y AOUT (salida analógica).
// ------------------------------------------------------------
COMPONENTS.water_level_sensor = {
  label:'Sensor de Nivel de Agua', cat:'Sensores', icon:'≈R', props:{level:0.4, Vcc:5},
  terminals:[T(-30,0,'GND'),T(30,0,'AOUT'),T(0,-20,'VCC')],
  edges(c){
    const vccV = (c.state.Vt2||0)-(c.state.Vt0||0);
    if(vccV < 2.5) return [{n:[0,1], type:'OPEN', value:1e9}];
    return [{n:[0,1], type:'V', value: c.props.level*Math.min(vccV,c.props.Vcc), Rint:150}];
  },
  draw(ctx,c,sim){
    leadLines(ctx,[[-30,0],[-20,0]]); leadLines(ctx,[[30,0],[20,0]]); leadLines(ctx,[[0,-20],[0,-12]]);
    const powered = ((c.state.Vt2||0)-(c.state.Vt0||0)) >= 2.5;
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-20,-12,40,24);
    const waterY = 10 - 24*c.props.level;
    ctx.save(); ctx.beginPath(); ctx.rect(-20,-12,40,24); ctx.clip();
    ctx.fillStyle='rgba(77,166,255,.45)';
    ctx.beginPath(); ctx.moveTo(-20,12);
    for(let x=-20;x<=20;x+=4){ ctx.lineTo(x, waterY + Math.sin(sim.simTime*3+x*0.4)*1.4); }
    ctx.lineTo(20,12); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText(powered? 'nivel '+Math.round(c.props.level*100)+'%' : 'sin VCC', 0, 22);
  }
};

// ------------------------------------------------------------
// 3) SENSOR DE LLUVIA — antes 2 pines resistivos. El módulo
// real (placa comparadora) trae VCC, GND y AOUT.
// ------------------------------------------------------------
COMPONENTS.rain_sensor = {
  label:'Sensor de Lluvia (módulo)', cat:'Sensores', icon:'☔R', props:{rain:0.2, Vcc:5},
  terminals:[T(-30,0,'GND'),T(30,0,'AOUT'),T(0,-20,'VCC')],
  edges(c){
    const vccV = (c.state.Vt2||0)-(c.state.Vt0||0);
    if(vccV < 2.5) return [{n:[0,1], type:'OPEN', value:1e9}];
    return [{n:[0,1], type:'V', value: (1-c.props.rain)*Math.min(vccV,c.props.Vcc), Rint:150}];
  },
  draw(ctx,c,sim){
    leadLines(ctx,[[-30,0],[-22,0]]); leadLines(ctx,[[30,0],[22,0]]); leadLines(ctx,[[0,-20],[0,-11]]);
    const powered = ((c.state.Vt2||0)-(c.state.Vt0||0)) >= 2.5;
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=1.6; ctx.strokeRect(-22,-11,44,22);
    ctx.strokeStyle='#3a4756'; ctx.lineWidth=1;
    for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(i*6,-11); ctx.lineTo(i*6,11); ctx.stroke(); }
    if(powered){
      const n = Math.round(2+c.props.rain*8);
      for(let i=0;i<n;i++){
        const ph = (sim.simTime*1.4 + i*0.37) % 1;
        const dx = -18 + ((i*53)%40);
        const dy = -20 + ph*30;
        if(dy < 11){ ctx.strokeStyle='rgba(77,166,255,.8)'; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.moveTo(dx,dy); ctx.lineTo(dx-1.5,dy+5); ctx.stroke(); }
      }
    }
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText(powered? 'lluvia '+Math.round(c.props.rain*100)+'%' : 'sin VCC', 0, 22);
  }
};

// ------------------------------------------------------------
// 4) SENSOR DE HUMEDAD DE SUELO — antes 2 pines resistivos.
// El módulo capacitivo real trae VCC, GND y AOUT.
// ------------------------------------------------------------
COMPONENTS.soil_moisture_sensor = {
  label:'Sensor de Humedad de Suelo (módulo)', cat:'Sensores', icon:'🌱R', props:{moisture:0.3, Vcc:5},
  terminals:[T(-30,0,'GND'),T(30,0,'AOUT'),T(0,-20,'VCC')],
  edges(c){
    const vccV = (c.state.Vt2||0)-(c.state.Vt0||0);
    if(vccV < 3.0) return [{n:[0,1], type:'OPEN', value:1e9}];
    return [{n:[0,1], type:'V', value: (1-c.props.moisture)*Math.min(vccV,c.props.Vcc), Rint:150}];
  },
  draw(ctx,c){
    leadLines(ctx,[[-30,0],[-22,0]]); leadLines(ctx,[[30,0],[22,0]]); leadLines(ctx,[[0,-20],[0,-10]]);
    const powered = ((c.state.Vt2||0)-(c.state.Vt0||0)) >= 3.0;
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-22,-10); ctx.lineTo(-22,10); ctx.moveTo(22,-10); ctx.lineTo(22,10); ctx.stroke();
    ctx.fillStyle=`rgba(120,80,40,${0.15+c.props.moisture*0.5})`; ctx.fillRect(-22,-10,44,20);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText(powered? 'humedad '+Math.round(c.props.moisture*100)+'%' : 'sin VCC', 0, 24);
  }
};

// ------------------------------------------------------------
// 5) SENSOR DE GAS (MQ) — antes 2 pines resistivos sin
// alimentación. El módulo real (con comparador) trae VCC, GND,
// DOUT (digital) y AOUT (analógico).
// ------------------------------------------------------------
COMPONENTS.gas_sensor = {
  label:'Sensor de Gas (módulo MQ)', cat:'Sensores', icon:'☁R', props:{gas:0.2, threshold:0.4, Vcc:5},
  terminals:[T(-30,-16,'VCC'),T(-30,16,'GND'),T(30,-16,'DOUT'),T(30,16,'AOUT')],
  edges(c){
    const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
    if(vccV < 3.0) return [{n:[2,1], type:'OPEN', value:1e9},{n:[3,1], type:'OPEN', value:1e9}];
    const analogV = c.props.gas*Math.min(vccV,c.props.Vcc);
    const digital = c.props.gas >= c.props.threshold;
    return [
      {n:[3,1], type:'V', value:analogV, Rint:150, tag:'aout'},
      {n:[2,1], type:'V', value: digital? c.props.Vcc:0, Rint:10, tag:'dout'}
    ];
  },
  draw(ctx,c){
    leadLines(ctx,[[-30,-16],[-16,-16]]); leadLines(ctx,[[-30,16],[-16,16]]);
    leadLines(ctx,[[30,-16],[16,-16]]); leadLines(ctx,[[30,16],[16,16]]);
    const powered = ((c.state.Vt0||0)-(c.state.Vt1||0)) >= 3.0;
    ctx.strokeStyle=COL_BODY; ctx.lineWidth=1.6; ctx.strokeRect(-16,-20,32,40);
    if(powered){ ctx.fillStyle=`rgba(150,255,150,${0.1+c.props.gas*0.55})`; ctx.fillRect(-14,-18,28,36); }
    ctx.fillStyle='#aab6c4'; ctx.font='6.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText('MQ', 0, -2);
    ctx.fillText(powered? 'gas '+Math.round(c.props.gas*100)+'%':'sin VCC', 0, 24);
  }
};

// ------------------------------------------------------------
// 6) MÓDULO BLUETOOTH HC-05 — le faltaban EN(KEY) y STATE,
// pines reales del módulo (EN tiene pull-up interno: si no se
// conecta, el módulo funciona normal, igual que en la vida real).
// ------------------------------------------------------------
COMPONENTS.bluetooth_module = {
  label:'Módulo Bluetooth (HC-05)', cat:'Módulos', icon:'🔷', props:{paired:false},
  terminals:[T(-30,-24,'VCC'),T(-30,24,'GND'),T(30,-24,'TX'),T(30,-8,'RX'),T(30,8,'STATE'),T(30,24,'EN')],
  interactive:true,
  onTap(c){ c.props.paired = !c.props.paired; },
  edges(c){
    const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
    const e = [
      {n:[0,1], type:'R', value:1200},
      {n:[5,0], type:'R', value:100000} // pull-up interno de EN hacia VCC
    ];
    const enV = c.state.Vt5||0;
    const enabled = vccV >= 3.0 && enV > vccV/2;
    e.push({n:[4,1], type: enabled && c.props.paired? 'V':'OPEN', value: enabled? vccV:0, Rint:1000});
    return e;
  },
  draw(ctx,c,sim){
    leadLines(ctx,[[-30,-24],[-14,-24]]); leadLines(ctx,[[-30,24],[-14,24]]);
    leadLines(ctx,[[30,-24],[14,-24]]); leadLines(ctx,[[30,-8],[14,-8]]);
    leadLines(ctx,[[30,8],[14,8]]); leadLines(ctx,[[30,24],[14,24]]);
    const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
    const enabled = vccV>=3.0 && (c.state.Vt5||0) > vccV/2;
    ctx.strokeStyle='#4da6ff'; ctx.lineWidth=1.6; ctx.strokeRect(-14,-28,28,56);
    const period = c.props.paired? 1.0 : 0.25;
    const on = enabled && (sim.simTime % period) < period*0.5;
    ctx.beginPath(); ctx.arc(0,-2,4,0,Math.PI*2);
    ctx.fillStyle = on? '#4da6ff' : '#1c2530'; ctx.fill();
    ctx.fillStyle='#aab6c4'; ctx.font='6.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText('HC-05',0,14);
    ctx.fillText(!enabled? 'EN bajo':(c.props.paired?'vinculado':'buscando'),0,26);
  }
};

// ------------------------------------------------------------
// 7) PUENTE H L298N — solo controlaba UN motor (canal A). El
// chip real trae 2 canales completos (A y B). Se agrega IN3,
// IN4, ENB, OUT3, OUT4.
// ------------------------------------------------------------
COMPONENTS.l298n_hbridge = {
  label:'Puente H (L298N, doble canal)', cat:'Módulos', icon:'⇄⚙', props:{Vdrop:1.5},
  terminals:[
    T(-40,-32,'VS'), T(-40,-16,'GND'), T(-40,0,'IN1'), T(-40,16,'IN2'), T(0,-40,'ENA'),
    T(-40,32,'IN3'), T(0,40,'ENB'), T(40,-24,'OUT1'), T(40,-8,'OUT2'),
    T(40,8,'OUT3'), T(40,24,'OUT4'), T(0,-24,'IN4')
  ],
  edges(c){
    const vs = (c.state.Vt0||0)-(c.state.Vt1||0);
    const enA = (c.state.Vt4||0) > 2.0;
    const enB = (c.state.Vt6||0) > 2.0;
    const vout = Math.max(0, vs - c.props.Vdrop);
    const e = [];
    if(vs<1 || !enA){ e.push({n:[7,1],type:'OPEN',value:1e9},{n:[8,1],type:'OPEN',value:1e9}); }
    else{
      const in1=(c.state.Vt2||0)>vs/2, in2=(c.state.Vt3||0)>vs/2;
      e.push({n:[7,1], type:'V', value:(in1&&!in2)?vout:0, Rint:1});
      e.push({n:[8,1], type:'V', value:(in2&&!in1)?vout:0, Rint:1});
    }
    if(vs<1 || !enB){ e.push({n:[9,1],type:'OPEN',value:1e9},{n:[10,1],type:'OPEN',value:1e9}); }
    else{
      const in3=(c.state.Vt5||0)>vs/2, in4=(c.state.Vt11||0)>vs/2;
      e.push({n:[9,1], type:'V', value:(in3&&!in4)?vout:0, Rint:1});
      e.push({n:[10,1], type:'V', value:(in4&&!in3)?vout:0, Rint:1});
    }
    return e;
  },
  draw(ctx,c){
    c.terminals.forEach(t=> leadLines(ctx,[[t.x,t.y],[t.x<0? t.x+16:(t.y===-40||t.y===40? t.x:t.x-16), t.y]]));
    const vs=(c.state.Vt0||0)-(c.state.Vt1||0);
    const enA=(c.state.Vt4||0)>2.0, enB=(c.state.Vt6||0)>2.0;
    ctx.strokeStyle= (vs>=1 && (enA||enB))? COL_WIRE_ON:COL_BODY; ctx.lineWidth=2; ctx.strokeRect(-24,-36,48,72);
    ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center'; ctx.fillText('L298N',0,-2);
    ctx.font='6px sans-serif';
    ctx.fillText('A:'+(enA?'ON':'off')+' B:'+(enB?'ON':'off'), 0, 10);
    ctx.fillText(vs<1?'sin VS':'', 0, 20);
  }
};

})();
</script>

(function(){
  const tooltip = document.createElement('div');
  tooltip.id='wireTooltip';
  tooltip.style.cssText = 'position:absolute;pointer-events:none;display:none;z-index:30;'+
    'background:rgba(16,21,29,.95);border:1px solid var(--accent,#ffab2e);border-radius:8px;'+
    'padding:6px 10px;font-size:11px;font-family:monospace;color:#ffe9c2;'+
    'box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;line-height:1.5;';
  wrap.appendChild(tooltip);

  canvas.addEventListener('mousemove', function(ev){
    if(dragging || panning || wireMode || cutMode || selectedType){ tooltip.style.display='none'; return; }
    const r = canvas.getBoundingClientRect();
    const sp = {x:ev.clientX-r.left, y:ev.clientY-r.top};
    const p = toWorld(sp);
    const w = hitWire(p.x, p.y);
    if(!w){ tooltip.style.display='none'; return; }
    const ca = comps.find(c=>c.id===w.a.compId), cb = comps.find(c=>c.id===w.b.compId);
    if(!ca||!cb){ tooltip.style.display='none'; return; }
    const I = Math.max(Math.abs(ca.state?.I||0), Math.abs(cb.state?.I||0));
    const nodeV = ca.state?.['Vt'+w.a.term] ?? 0;
    tooltip.innerHTML = `<b style="color:#39d3a8">⚡ ${fmtAmp(I)}</b><br><span style="color:#8a97a8">≈ ${fmtVolt(nodeV)}</span>`;
    tooltip.style.left = (sp.x+14)+'px';
    tooltip.style.top = (sp.y-8)+'px';
    tooltip.style.display='block';
  });
  canvas.addEventListener('mouseleave', ()=> tooltip.style.display='none');
})();

// PARTE C — Mejora #15: LED Infrarrojo + Receptor IR
// ------------------------------------------------------------
(function(){
  const IR_COMPONENTS = {
    ir_led: { label:'LED Infrarrojo (emisor IR)', cat:'Semiconductores', icon:'📡IR',
      props:{Vf:1.2, Imax:0.03, burned:false},
      terminals:[T(-40,0,'anodo'),T(40,0,'catodo')],
      edges(c){
        if(c.props.burned) return [{n:[0,1], type:'OPEN', value:1e9}];
        return [{n:[0,1], type:'DIODE', value:c.props.Vf, Ron:12}];
      },
      postSolve(c){ if(!c.props.burned && Math.abs(c.state?.I||0) > c.props.Imax) c.props.burned = true; },
      draw(ctx,c,sim){
        leadLines(ctx,[[-40,0],[-16,0]]); leadLines(ctx,[[16,0],[40,0]]);
        const I = Math.abs(c.state?.I||0);
        const emitting = !c.props.burned && I>0.001;
        ctx.fillStyle = c.props.burned? '#1a1010' : (emitting? '#4a1010':'#2a1414');
        ctx.beginPath(); ctx.moveTo(-14,-13); ctx.lineTo(14,0); ctx.lineTo(-14,13); ctx.closePath(); ctx.fill();
        ctx.strokeStyle=COL_BODY; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(14,-13); ctx.lineTo(14,13); ctx.stroke();
        if(emitting){
          for(let i=0;i<3;i++){
            const ph = ((sim.simTime*3 + i/3)%1);
            ctx.beginPath(); ctx.arc(16,0,6+ph*14,-0.5,0.5);
            ctx.strokeStyle=`rgba(255,60,60,${(1-ph)*0.5})`; ctx.lineWidth=1.4; ctx.stroke();
          }
        }
        ctx.fillStyle='#aab6c4'; ctx.font='7px sans-serif'; ctx.textAlign='center';
        ctx.fillText(c.props.burned?'QUEMADO':'IR TX', 0, 24);
      }
    },
    ir_receiver: { label:'Receptor Infrarrojo (TSOP)', cat:'Sensores', icon:'📡●', props:{Vcc:5},
      terminals:[T(-30,-16,'VCC'),T(-30,16,'GND'),T(30,0,'OUT')],
      edges(c){
        const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
        if(vccV < 2.7) return [{n:[2,1], type:'OPEN', value:1e9}];
        const receiving = comps.some(o=> o.type==='ir_led' && !o.props.burned && Math.abs(o.state?.I||0)>0.001);
        return [{n:[2,1], type:'V', value: receiving? 0 : c.props.Vcc, Rint:10}]; // activo en bajo, como TSOP real
      },
      draw(ctx,c){
        leadLines(ctx,[[-30,-16],[-14,-16]]); leadLines(ctx,[[-30,16],[-14,16]]); leadLines(ctx,[[30,0],[14,0]]);
        const vccV = (c.state.Vt0||0)-(c.state.Vt1||0);
        const powered = vccV>=2.7;
        const receiving = powered && comps.some(o=> o.type==='ir_led' && !o.props.burned && Math.abs(o.state?.I||0)>0.001);
        ctx.strokeStyle= receiving? COL_WIRE_ON:COL_BODY; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.arc(0,0,15,Math.PI*0.1,Math.PI*1.9); ctx.stroke();
        ctx.fillStyle= receiving? 'rgba(255,176,46,.25)':'rgba(120,130,145,.1)'; ctx.fill();
        ctx.fillStyle='#aab6c4'; ctx.font='6.5px sans-serif'; ctx.textAlign='center';
        ctx.fillText(!powered? 'sin VCC': (receiving?'recibiendo':'sin señal'),0,26);
      }
    }
  };
  Object.assign(COMPONENTS, IR_COMPONENTS);
  if(typeof propFieldsFor === 'function'){
    const _origPF = propFieldsFor;
    propFieldsFor = function(type){
      if(type==='ir_led') return [{key:'Vf',label:'Voltaje directo (V)',step:0.1},{key:'Imax',label:'Corriente máx. (A)',step:0.005}];
      if(type==='ir_receiver') return [{key:'Vcc',label:'Vcc (V)',step:0.5}];
      return _origPF(type);
    };
  }
})();

(function(){
  window.protoboardMode = false;
  window.simSpeed = window.simSpeed || 1;

  const topbarEl = document.getElementById('topbar');

  const btnProto = document.createElement('button');
  btnProto.className='tbtn'; btnProto.id='btnProtoboard'; btnProto.textContent='🧵 Protoboard';
  topbarEl.appendChild(btnProto);
  btnProto.addEventListener('click', ()=>{
    window.protoboardMode = !window.protoboardMode;
    btnProto.classList.toggle('on', window.protoboardMode);
  });

  const SPEEDS=[0.25,0.5,1,2,4];
  let speedIdx=2;
  const btnSpeed=document.createElement('button');
  btnSpeed.className='tbtn'; btnSpeed.id='btnSimSpeed'; btnSpeed.textContent='⏱ 1x';
  topbarEl.appendChild(btnSpeed);
  btnSpeed.addEventListener('click', ()=>{
    speedIdx=(speedIdx+1)%SPEEDS.length;
    window.simSpeed=SPEEDS[speedIdx];
    btnSpeed.textContent='⏱ '+SPEEDS[speedIdx]+'x';
    btnSpeed.classList.toggle('on', SPEEDS[speedIdx]!==1);
  });

  // Redefine drawGrid soportando protoboard + zoom (mismo criterio del script de zoom)
  drawGrid = function(){
    const r = wrap.getBoundingClientRect();
    if(!window.protoboardMode){
      ctx.fillStyle = '#0b0f14'; ctx.fillRect(0,0,r.width,r.height);
      ctx.fillStyle = '#1c2530';
      const g = GRID*zoomScale;
      if(g<3) return;
      let startX = panX % g; if(startX<0) startX+=g;
      let startY = panY % g; if(startY<0) startY+=g;
      for(let x=startX;x<r.width;x+=g) for(let y=startY;y<r.height;y+=g) ctx.fillRect(x,y,1,1);
      return;
    }
    // ---- modo protoboard ----
    ctx.fillStyle = '#d8cba8'; ctx.fillRect(0,0,r.width,r.height);
    const g = GRID*zoomScale;
    if(g<4) return;
    let startX = panX % g; if(startX<0) startX+=g;
    let startY = panY % g; if(startY<0) startY+=g;

    ctx.strokeStyle='rgba(200,40,40,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(r.width,18); ctx.stroke();
    ctx.strokeStyle='rgba(40,80,200,.5)';
    ctx.beginPath(); ctx.moveTo(0,r.height-18); ctx.lineTo(r.width,r.height-18); ctx.stroke();

    ctx.fillStyle='rgba(70,55,30,.55)';
    for(let x=startX;x<r.width;x+=g) for(let y=startY;y<r.height;y+=g){
      ctx.beginPath(); ctx.arc(x,y, Math.max(1,g*0.08), 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='rgba(0,0,0,.06)';
    ctx.fillRect(0, r.height/2-g*1.5, r.width, g*3);
  };
})();


// ------------------------------------------------------------
// PARTE E — Mejora #8: chispas al dañarse un componente
//           + Mejora #7 (velocidad) aplicada al motor físico
//           + loop() final integrando todo
// ------------------------------------------------------------
(function(){
  // Escala el paso de tiempo físico según window.simSpeed sin tocar el resto del motor
  const _origStep = CircuitSim.prototype.step;
  CircuitSim.prototype.step = function(comps, wires, dt){
    return _origStep.call(this, comps, wires, dt*(window.simSpeed||1));
  };

  const sparks = [];
  const prevDamaged = new Map();
  function extendedDamaged(c){
    if(c.props.blown) return true;
    if(c.props.failed) return true;
    if(c.props.burned) return true;
    if(c.type==='circuit_breaker' && c.props.tripped) return true;
    return false;
  }
  function checkSparkTriggers(){
    comps.forEach(c=>{
      const now = extendedDamaged(c);
      const before = prevDamaged.get(c.id) || false;
      if(now && !before){ sparks.push({x:c.x,y:c.y,t0:performance.now()}); }
      prevDamaged.set(c.id, now);
    });
  }
  function drawSparks(){
    const now = performance.now();
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      const age=(now-s.t0)/1000;
      if(age>0.6){ sparks.splice(i,1); continue; }
      const p = 1-age/0.6;
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.globalAlpha = p;
      for(let k=0;k<6;k++){
        const ang = (k/6)*Math.PI*2 + age*8;
        const len = 8+age*40;
        ctx.strokeStyle = k%2? '#ffe14d':'#ff5c5c';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ang)*len, Math.sin(ang)*len); ctx.stroke();
      }
      ctx.fillStyle='rgba(255,200,80,'+(p*0.5)+')';
      ctx.beginPath(); ctx.arc(0,0,14*p,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  loop = function(now){
    const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
    particlePhase += dt*(window.simSpeed||1);
    sim.step(comps, wires, dt);
    comps.forEach(c=>{
      if(COMPONENTS[c.type] && COMPONENTS[c.type].momentary && c.props.pressed){
        c.state._momT = (c.state._momT||0) + dt;
        if(c.state._momT > 0.25){ c.props.pressed = false; c.state._momT = 0; }
      }
    });

    checkSparkTriggers();

    if (scopeActive) {
       const ch1CompId = document.getElementById('scopeCh1Comp')?.value;
       const ch1Type = document.getElementById('scopeCh1Type')?.value;
       const ch2CompId = document.getElementById('scopeCh2Comp')?.value;
       const ch2Type = document.getElementById('scopeCh2Type')?.value;
       const v1 = ch1CompId ? (comps.find(c=>c.id===ch1CompId)?.state?.[ch1Type] || 0) : null;
       const v2 = ch2CompId ? (comps.find(c=>c.id===ch2CompId)?.state?.[ch2Type] || 0) : null;
       scopeData.push({ t: sim.simTime, v1, v2 });
       const win = parseFloat(document.getElementById('scopeWinSlider')?.value || 2);
       while (scopeData.length > 0 && scopeData[0].t < sim.simTime - win - 0.2) scopeData.shift();
       drawScope();
    }

    drawGrid();
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoomScale, zoomScale);
    drawWires(); drawComponents();
    drawSparks();
    ctx.restore();
    updateStatus();
    requestAnimationFrame(loop);
  };
})();

// ------------------------------------------------------------
(function(){
  const TUTORIAL_STEPS = [
    {title:'👋 Bienvenido a Tecnoyork Electrónica', text:'Este simulador te permite armar circuitos electrónicos reales y ver cómo funcionan en tiempo real. Vamos a ver lo básico en unos pasos rápidos.'},
    {title:'➕ Agregar componentes', text:'Toca "➕ Componentes" para abrir el catálogo. Busca la pieza que necesitas y tócala: quedará "en mano" lista para colocar. Luego toca el lienzo donde quieras ubicarla.'},
    {title:'🔌 Conectar cables', text:'Activa "🔌 Cable", toca un terminal (círculo) de un componente y luego el terminal del otro que quieres unir. Así quedan conectados eléctricamente.'},
    {title:'✂ Cortar cables', text:'Activa "✂ Cortar" y toca cualquier cable para eliminarlo del circuito.'},
    {title:'▶ Encender el circuito', text:'Cuando termines de armar, toca "▶ Encender" para iniciar la simulación. Verás partículas moviéndose por los cables con corriente y los componentes reaccionando.'},
    {title:'🌡️ Panel de Entorno', text:'Usa "🌡️ Entorno" para simular condiciones físicas: luz, temperatura, humedad, movimiento, etc. Así puedes probar sensores sin necesitar el mundo real.'},
    {title:'⏱ Velocidad y 🧵 Protoboard', text:'Con "⏱" controlas la velocidad de la simulación (cámara lenta o rápida) y con "🧵 Protoboard" cambias el fondo del lienzo a estilo placa de pruebas.'},
    {title:'📋 Lista de Materiales', text:'Toca "📋 Lista" para ver y descargar la lista de todos los componentes usados en tu circuito, con sus cantidades.'},
    {title:'✅ ¡Listo!', text:'Toca cualquier componente colocado para ver sus propiedades editables, girarlo o borrarlo. ¡A experimentar!'}
  ];
  let tutStep = 0;

  function renderTutorialStep(){
    const s = TUTORIAL_STEPS[tutStep];
    const html = `
      <div style="padding:4px 2px;">
        <h3 style="margin:0 0 10px;color:var(--accent);font-size:16px;">${s.title}</h3>
        <p style="font-size:13px;line-height:1.6;color:var(--text);margin:0 0 18px;">${s.text}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span style="font-size:11px;color:var(--text-faint);font-family:monospace;">${tutStep+1} / ${TUTORIAL_STEPS.length}</span>
          <div style="display:flex;gap:8px;">
            <button class="tbtn" id="tutPrev" ${tutStep===0?'style="opacity:.35;pointer-events:none;"':''}>← Atrás</button>
            <button class="tbtn on" id="tutNext">${tutStep===TUTORIAL_STEPS.length-1?'Finalizar ✓':'Siguiente →'}</button>
          </div>
        </div>
      </div>`;
    overlayTitle.textContent = '🎓 Guía Rápida';
    overlayBody.innerHTML = html;
    document.getElementById('tutNext').addEventListener('click', ()=>{
      if(tutStep===TUTORIAL_STEPS.length-1){ closeOverlay(); storage.set('tecnoyork_tutorial_seen','1'); return; }
      tutStep++; renderTutorialStep();
    });
    const prevBtn = document.getElementById('tutPrev');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(tutStep>0){ tutStep--; renderTutorialStep(); } });
  }
  function openTutorial(){
    tutStep=0;
    overlayBackdrop.classList.add('open'); overlayModal.classList.add('open');
    renderTutorialStep();
  }

  const btnTut = document.createElement('button');
  btnTut.className='tbtn'; btnTut.id='btnTutorial'; btnTut.textContent='🎓 Guía';
  document.getElementById('topbar').appendChild(btnTut);
  btnTut.addEventListener('click', openTutorial);

  try{
    if(!storage.get('tecnoyork_tutorial_seen')) setTimeout(openTutorial, 600);
  }catch(e){}
})();

// PARTE G — Mejora #18: Exportar Lista de Materiales (BOM)
// ------------------------------------------------------------
(function(){
  function buildBOM(){
    const counts = {};
    comps.forEach(c=>{ counts[c.type] = (counts[c.type]||0)+1; });
    return Object.keys(counts)
      .sort((a,b)=> (COMPONENTS[a]?.label||a).localeCompare(COMPONENTS[b]?.label||b))
      .map(type=>({ type, label: COMPONENTS[type]?.label || type, qty: counts[type] }));
  }
  function openBOM(){
    const items = buildBOM();
    let html = '';
    if(!items.length){
      html = '<div class="empty">El lienzo está vacío. Agrega componentes para generar la lista de materiales.</div>';
    } else {
      html = '<div class="slist">' + items.map(it=>
        `<div class="sitem" style="cursor:default;">
          <div class="name">${it.label}</div>
          <div class="date" style="font-size:12px;color:var(--accent2,#39d3a8);font-weight:700;">x${it.qty}</div>
        </div>`
      ).join('') + '</div>';
      html += `<div style="margin-top:14px;display:flex;gap:8px;">
        <button class="tbtn on" id="bomDownload" style="flex:1;justify-content:center;">⬇ Descargar .txt</button>
      </div>`;
    }
    openOverlay('📋 Lista de Materiales (BOM)', html);
    const dlBtn = document.getElementById('bomDownload');
    if(dlBtn){
      dlBtn.addEventListener('click', ()=>{
        let text = 'LISTA DE MATERIALES — Tecnoyork Electrónica\n' + '='.repeat(44) + '\n\n';
        items.forEach(it=>{ text += `${String(it.qty).padStart(3,' ')}x  ${it.label}\n`; });
        text += `\nTotal de piezas: ${items.reduce((a,b)=>a+b.qty,0)}\n`;
        text += `Generado: ${new Date().toLocaleString()}\n`;
        const blob = new Blob([text], {type:'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'lista_materiales.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }
  }
  const btnBOM = document.createElement('button');
  btnBOM.className='tbtn'; btnBOM.id='btnBOM'; btnBOM.textContent='📋 Lista';
  document.getElementById('topbar').appendChild(btnBOM);
  btnBOM.addEventListener('click', openBOM);
})();
</script>
<script>
// ============================================================
// fix-referencia-tierra-logica.js — Corrige el bug real:
// la salida de la lógica quedaba referenciada al pin GND local
// (flotante si no se cablea), forzando su corriente a 0.
// Ahora la salida siempre referencia la tierra real del circuito;
// los pines VCC/GND locales solo se usan para saber si el chip
// está alimentado (con reserva a Vcc interno si no se cablean).
// ============================================================
(function(){

function findPin(def, name){ return def.terminals.findIndex(t=>t.name===name); }
function effVcc(c, vI, gI, fallback){
  if(vI<0 || gI<0) return fallback;
  const vcc = (c.state?.['Vt'+vI]||0) - (c.state?.['Vt'+gI]||0);
  return vcc >= 3.0 ? vcc : fallback;
}

const GATE_FN = {
  gate_and:(a,b)=>a&&b, gate_or:(a,b)=>a||b, gate_nand:(a,b)=>!(a&&b),
  gate_nor:(a,b)=>!(a||b), gate_xor:(a,b)=>a!==b, gate_xnor:(a,b)=>a===b
};
Object.keys(GATE_FN).forEach(type=>{
  const def = COMPONENTS[type]; if(!def) return;
  const fn = GATE_FN[type];
  const outI = findPin(def,'out');
  const vI = findPin(def,'VCC'), gI = findPin(def,'GND');
  def.edges = function(c){
    const vcc = effVcc(c, vI, gI, c.props.Vcc);
    const a = (c.state?.Vin0||0) > vcc/2;
    const b = (c.state?.Vin1||0) > vcc/2;
    return [{n:[outI,'GND'], type:'GATEOUT', value: fn(a,b)? vcc:0, tag:'gate', Rint:10}];
  };
});

['gate_not','gate_buffer'].forEach(type=>{
  const def = COMPONENTS[type]; if(!def) return;
  const isNot = type==='gate_not';
  const outI = findPin(def,'out');
  const vI = findPin(def,'VCC'), gI = findPin(def,'GND');
  def.edges = function(c){
    const vcc = effVcc(c, vI, gI, c.props.Vcc);
    const a = (c.state?.Vin0||0) > vcc/2;
    const out = isNot? !a : a;
    return [{n:[outI,'GND'], type:'GATEOUT', value: out? vcc:0, tag:'gate', Rint:10}];
  };
});

if(COMPONENTS.sr_latch){
  const def = COMPONENTS.sr_latch;
  const qI = findPin(def,'Q'), qbI = findPin(def,'Q̄');
  const vI = findPin(def,'VCC'), gI = findPin(def,'GND');
  def.step = function(c, dt){
    const vcc = effVcc(c, vI, gI, c.props.Vcc);
    const S = (c.state?.Vin0||0) > vcc/2;
    const R = (c.state?.Vin1||0) > vcc/2;
    let q = c.state.Q ?? false;
    if(S && !R) q = true;
    else if(R && !S) q = false;
    else if(S && R) q = false;
    c.state.Q = q;
  };
  def.edges = function(c){
    const vcc = effVcc(c, vI, gI, c.props.Vcc);
    const q = c.state?.Q ?? false;
    return [
      {n:[qI,'GND'],  type:'GATEOUT', value: q? vcc:0, tag:'gate', Rint:10},
      {n:[qbI,'GND'], type:'GATEOUT', value: q? 0:vcc, tag:'gate', Rint:10}
    ];
  };
}

if(COMPONENTS.schmitt_trigger){
  const def = COMPONENTS.schmitt_trigger;
  const outI = findPin(def,'out');
  const vI = findPin(def,'VCC'), gI = findPin(def,'GND');
  def.edges = function(c){
    const vcc = effVcc(c, vI, gI, c.props.Vcc);
    const hi = c.state?.hi ?? false;
    return [{n:[outI,'GND'], type:'GATEOUT', value: (!hi)? vcc:0, tag:'gate', Rint:10}];
  };
  def.postSolve = function(c){
    const Vin = c.state?.Vt0||0;
    let hi = c.state?.hi ?? false;
    if(!hi && Vin > c.props.Vhigh) hi = true;
    else if(hi && Vin < c.props.Vlow) hi = false;
    c.state.hi = hi;
  };
}

if(COMPONENTS.comparator){
  const def = COMPONENTS.comparator;
  const outI = findPin(def,'out');
  const vI = findPin(def,'VCC'), gI = findPin(def,'GND');
  def.edges = function(c){
    const vcc = effVcc(c, vI, gI, c.props.Vcc || 5);
    if(vcc < 1) return [{n:[outI,'GND'], type:'OPEN', value:1e9}];
    const highSide = (c.state?.Vt0||0) > (c.state?.Vt1||0);
    return [{n:[outI,'GND'], type: highSide? 'OPEN':'R', value: highSide? 1e9 : 15}];
  };
}

})();
</script>
  <script>
// ============================================================
// fix-referencia-tierra-global.js — Corrige la detección del
// nodo de tierra: ahora reconoce CUALQUIER fuente como ancla,
// no solo el tipo 'battery'.
// ============================================================
(function(){
  const FUENTES_TIPOS = [
    'battery','aa_battery','coin_cell','usb_port','solar_panel',
    'lipo_3s_battery','battery_18650','acsource','current_source',
    'thermocouple','piezo_sensor'
  ];

  CircuitSim.prototype.buildTopology = function(comps, wires){
    const termId = (compId,ti)=> compId+'#'+ti;
    const ids = new Map(); let n=0;
    comps.forEach(c=> c.terminals.forEach((t,ti)=>{ ids.set(termId(c.id,ti), n++); }));

    let refKey = null;
    const gnd = comps.find(c=>DEF(c).isGround);
    if(gnd){
      refKey = termId(gnd.id,0);
    } else {
      // Busca la PRIMERA fuente reconocida (de cualquier tipo) y usa
      // su terminal negativo/terminal 0 como referencia de tierra.
      const fuente = comps.find(c=> FUENTES_TIPOS.includes(c.type));
      if(fuente) refKey = termId(fuente.id,0);
    }
    const refNode = refKey!==null ? ids.get(refKey) : (n>0?0:null);
    return {ids, termId, refNode, totalTerminals:n};
  };
})();
</script>
